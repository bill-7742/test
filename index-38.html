    const Reports = (() => {
      let range = { start: U.todayISO(), end: U.todayISO(), label: "Today" };

      function shiftDate(dir) {
        // shifts the whole range by its own span (simple day-back/forward for single-day ranges)
        const s = new Date(range.start), e = new Date(range.end);
        const spanDays = Math.round((e - s) / 86400000) + 1;
        s.setDate(s.getDate() + dir * spanDays);
        e.setDate(e.getDate() + dir * spanDays);
        range.start = s.toISOString().slice(0, 10);
        range.end = e.toISOString().slice(0, 10);
        range.label = range.start === range.end ? U.fmtDate(range.start) : `${U.fmtDate(range.start)} – ${U.fmtDate(range.end)}`;
        render();
      }

      function setPreset(p) {
        const now = new Date(); let s, e = new Date();
        if (p === "today") { s = new Date(); range.label = "Today"; }
        else if (p === "week") { s = new Date(); s.setDate(now.getDate() - now.getDay()); range.label = "This Week"; }
        else if (p === "month") { s = new Date(now.getFullYear(), now.getMonth(), 1); range.label = "This Month"; }
        else if (p === "year") { s = new Date(now.getFullYear(), 0, 1); range.label = "This Year"; }
        else if (p === "lastyear") { s = new Date(now.getFullYear() - 1, 0, 1); e = new Date(now.getFullYear() - 1, 11, 31); range.label = "Last Year"; }
        range.start = s.toISOString().slice(0, 10); range.end = e.toISOString().slice(0, 10);
        UI.close(); render();
      }

      function openRange() {
        UI.sheet(`
      <div class="sheet-head"><h3>Select Date Range</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label class="label">Start Date</label><input class="input" type="date" id="rgStart" value="${range.start}"></div>
        <div class="field"><label class="label">End Date</label><input class="input" type="date" id="rgEnd" value="${range.end}"></div>
        <button class="btn primary block" onclick="Reports.confirmRange()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Confirm</button>
        <div class="divider"></div>
        <div class="row" style="flex-wrap:wrap; gap:8px;">
          <button class="chip" onclick="Reports.setPreset('today')">This Week</button>
        </div>

          <button class="chip" style="width:100%" onclick="Reports.setPreset('today')">Today</button>
          <button class="chip" style="width:100%" onclick="Reports.setPreset('week')">This Week</button>
          <button class="chip" style="width:100%" onclick="Reports.setPreset('month')">This Month</button>
          <button class="chip" style="width:100%" onclick="Reports.setPreset('year')">This Year</button>
          <button class="chip" style="width:100%" onclick="Reports.setPreset('lastyear')">Last Year</button>
        </div>
      </div>`);
      }
      function confirmRange() {
        range.start = document.getElementById("rgStart").value;
        range.end = document.getElementById("rgEnd").value;
        range.label = range.start === range.end ? U.fmtDate(range.start) : `${U.fmtDate(range.start)} – ${U.fmtDate(range.end)}`;
        UI.close(); render();
      }

      function inRange(dateStr) {
        const d = new Date(dateStr).setHours(0, 0, 0, 0);
        return d >= new Date(range.start).setHours(0, 0, 0, 0) && d <= new Date(range.end).setHours(23, 59, 59, 999);
      }

      async function computeNetIncome() {
        const allTxs = await DB.all("transactions");
        const incomeExtra = allTxs.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
        const expense = allTxs.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
        return incomeExtra - expense;
      }

      async function computeStats() {
        const bills = (await DB.all("bills")).filter(b => inRange(b.date));
        const txs = (await DB.all("transactions")).filter(t => inRange(t.date));
        const totalSales = bills.reduce((s, b) => s + b.total - (b.refundedAmount || 0), 0);
        const grossProfit = bills.reduce((s, b) => s + b.items.reduce((si, it) => si + (it.price - (it.cost || 0)) * Math.max(0, it.qty - (it.returnedQty || 0)), 0), 0);
        const incomeExtra = txs.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
        const expense = txs.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
        const totalIncome = totalSales + incomeExtra - expense;
        const payMode = {};
        bills.forEach(b => { payMode[b.paymentMode] = (payMode[b.paymentMode] || 0) + b.total; });
        return { bills, txs, totalSales, grossProfit, incomeExtra, expense, totalIncome, payMode };
      }

        if (allBills.length === 0) {
          document.getElementById("billsCountSub").textContent = "0 bills";
          body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/></svg><div>No bills yet</div><div class="hint">Bills made from Counter will appear here</div></div>`;
          return;
        }
        const q = (document.getElementById("billsSearch")?.value || "").trim().toLowerCase();
        let bills = allBills;
        if (q) {
          bills = bills.filter(b => (b.idLabel || "").toLowerCase().includes(q) || (b.customerName || "").toLowerCase().includes(q));
        }
        bills = bills.slice().sort((a, b) => {
          if (sortMode === "oldest") return new Date(a.date) - new Date(b.date);
          if (sortMode === "high") return b.total - a.total;
          if (sortMode === "low") return a.total - b.total;
          return new Date(b.date) - new Date(a.date);
        });
        document.getElementById("billsCountSub").textContent = q ? `${bills.length} of ${allBills.length} bills` : `${allBills.length} bills`;
        if (bills.length === 0) {
          body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><div>No matching bills</div><div class="hint">Try a different search</div></div>`;
          return;
        }
        let html = "";
        if (sortMode === "newest" || sortMode === "oldest") {
          const today = new Date().toDateString();
          const yest = new Date(Date.now() - 86400000).toDateString();
          const groups = {}; const order = [];
          bills.forEach(b => {
            const dstr = new Date(b.date).toDateString();
            const key = dstr === today ? "Today" : dstr === yest ? "Yesterday" : U.fmtDate(b.date);
            if (!groups[key]) { groups[key] = []; order.push(key); }
            groups[key].push(b);
          });
          order.forEach(label => {
            html += `<div class="date-head">${label} · ${groups[label].length} Bill${groups[label].length === 1 ? "" : "s"}</div>`;
            groups[label].forEach(b => {
              const retTag = b.status === "returned" ? '<span class="pill red" style="margin-left:6px;font-size:9.5px;padding:2px 7px;">Returned</span>' : b.status === "partially_returned" ? '<span class="pill red" style="margin-left:6px;font-size:9.5px;padding:2px 7px;">Partial Return</span>' : "";
              html += `<div class="list-row" onclick="Bills.view(${b.id})">
            ${U.custAvatar(custById[b.customerId] || { name: b.customerName || "Walk-in" }, "var(--gold-dark)")}
            <div class="main"><div class="title">${b.idLabel}${retTag}</div><div class="meta">${U.escapeHtml(b.customerName || "Walk-in")} · ${U.fmtTime(b.date)}</div></div>
            <div class="right"><div class="title num">${U.money(b.total)}</div>${b.refundedAmount ? `<div style="font-size:10px;color:var(--danger);font-weight:700;">-${U.money(b.refundedAmount)} refund</div>` : ""}</div>
          </div>`;
            });
          });
        } else {
          bills.forEach(b => {
            const retTag = b.status === "returned" ? '<span class="pill red" style="margin-left:6px;font-size:9.5px;padding:2px 7px;">Returned</span>' : b.status === "partially_returned" ? '<span class="pill red" style="margin-left:6px;font-size:9.5px;padding:2px 7px;">Partial Return</span>' : "";
            html += `<div class="list-row" onclick="Bills.view(${b.id})">
          ${U.custAvatar(custById[b.customerId] || { name: b.customerName || "Walk-in" }, "var(--gold-dark)")}
          <div class="main"><div class="title">${b.idLabel}${retTag}</div><div class="meta">${U.escapeHtml(b.customerName || "Walk-in")} · ${U.fmtDate(b.date)} · ${U.fmtTime(b.date)}</div></div>
          <div class="right"><div class="title num">${U.money(b.total)}</div>${b.refundedAmount ? `<div style="font-size:10px;color:var(--danger);font-weight:700;">-${U.money(b.refundedAmount)} refund</div>` : ""}</div>
        </div>`;
          });
        }
        body.innerHTML = html;
      }
      function openSort() {
        const options = [
          { key: "newest", label: "Newest First", hint: "Latest bills on top" },
          { key: "oldest", label: "Oldest First", hint: "Earliest bills on top" },
          { key: "high", label: "Highest Amount", hint: "Highest bill amount first" },
          { key: "low", label: "Lowest Amount", hint: "Lowest bill amount first" },
        ];
        UI.sheet(`<div class="sheet-head"><h3>Sort Bills</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body" style="padding:8px 0;">
        ${options.map(o => `
          <div class="list-row" style="cursor:pointer;padding:12px 16px;" onclick="Bills.setSort('${o.key}')">
            <div class="main"><div class="title">${o.label}</div><div class="meta">${o.hint}</div></div>
            ${sortMode === o.key ? `<div class="right"><svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-dark)" stroke-width="2.6" style="width:20px;height:20px"><path d="M20 6L9 17l-5-5"/></svg></div>` : ""}
          </div>`).join("")}
      </div>`);
      }
      function setSort(key) {
        sortMode = key;
        document.getElementById("billsSortLabel").textContent = sortLabels[key];
        UI.close();
        render();
      }
      async function view(id) {
        const bill = await DB.get("bills", id);
        Receipt.show(bill);
      }
      return { render, view, openSort, setSort };
    })();

    /* ================================================================
       RECEIPT (shared between counter checkout + bills history)
    ================================================================ */
    const Receipt = (() => {
      let currentBill = null;
      function qrGlyph() {
        return `<svg viewBox="0 0 100 100" width="100%" height="100%">
      <rect x="6" y="6" width="26" height="26" fill="none" stroke="#0B0B0C" stroke-width="7"/>
      <rect x="15" y="15" width="8" height="8" fill="#0B0B0C"/>
      <rect x="68" y="6" width="26" height="26" fill="none" stroke="#0B0B0C" stroke-width="7"/>
      <rect x="77" y="15" width="8" height="8" fill="#0B0B0C"/>
      <rect x="6" y="68" width="26" height="26" fill="none" stroke="#0B0B0C" stroke-width="7"/>
      <rect x="15" y="77" width="8" height="8" fill="#0B0B0C"/>
      <rect x="44" y="44" width="7" height="7" fill="#0B0B0C"/>
      <rect x="56" y="44" width="7" height="7" fill="#0B0B0C"/>
      <rect x="44" y="56" width="7" height="7" fill="#0B0B0C"/>
      <rect x="60" y="60" width="9" height="9" fill="#0B0B0C"/>
      <rect x="76" y="76" width="12" height="12" fill="#0B0B0C"/>
      <rect x="44" y="76" width="7" height="7" fill="#0B0B0C"/>
      <rect x="62" y="42" width="7" height="20" fill="#0B0B0C"/>
    </svg>`;
      }
      function html(b, langArg) {
        const s = Settings.get();
        const lang = langArg || s.printLang || "en", hi = lang === "hi";
        const money = U.money;
        const l = (k) => Printer.L(k, lang);
        const T = (t) => hi ? (Tr.peek(String(t || "").trim()) || t) : t;
        const custMobile = b.customerMobile || "";
        const sv = Printer.savings(b, s);
        const mrpSubtotal = s.showMrp ? b.items.reduce((sum, it) => sum + ((it.mrp && it.mrp > 0 ? it.mrp : it.price) * it.qty), 0) : 0;
        const rows = b.items.map((it, i) => {
          const showMrpLine = s.showMrp && it.mrp && it.mrp > it.price;
          const mrpLine = showMrpLine ? `<div style="font-size:10px;color:var(--text-muted,#8A8F9B);margin-top:2px;">${l("MRP")} <s>${money(it.mrp)}</s></div>` : "";
          return `
      <tr>
        <td class="name">${i + 1}. ${U.escapeHtml(hi ? T(it.name) : it.name)}${mrpLine}</td>
        <td class="qty">${it.qty}</td>
        <td class="rate">${s.showRate ? money(it.price) : ""}</td>
        <td class="amt">${s.showRate ? money(it.price * it.qty) : ""}</td>
      </tr>`;
        }).join("");
        const metaLeft = `
      <div class="g-label">${l("Bill No.")}</div><div class="g-val">${U.escapeHtml(b.idLabel)}</div>
      <div class="g-label">${l("Date")}</div><div class="g-val">${U.fmtDate(b.date)}</div>
      <div class="g-label">${l("Time")}</div><div class="g-val">${U.fmtTime(b.date)}</div>
      ${s.showCashier ? `<div class="g-label">${l("Cashier")}</div><div class="g-val">${U.escapeHtml(s.cashierName || s.businessName || "-")}</div>` : ""}
    `;
        const metaRight = `
      ${s.showCustName ? `<div class="g-label">${l("Customer")}</div><div class="g-val">${U.escapeHtml(b.customerName || l("Walk-in"))}</div>` : ""}
      ${s.showCustName && custMobile ? `<div class="g-label">${l("Mobile")}</div><div class="g-val">${U.escapeHtml(custMobile)}</div>` : ""}
      ${s.showCustAddr && b.customerAddress ? `<div class="g-label">${l("Address")}</div><div class="g-val">${U.escapeHtml(b.customerAddress)}</div>` : ""}
      <div class="g-label">${l("Payment")}</div><div class="g-val">${U.escapeHtml(l(b.paymentMode || "-"))}</div>
    `;
        return `
      ${s.logo ? `<div class="r-logo"><img src="${s.logo}"></div>` : ""}
      <div class="r-brand">${U.escapeHtml(T(s.businessName || "Rakesh Mart"))}</div>
      ${s.address ? `<div class="r-sub">${U.escapeHtml(T(s.address))}</div>` : ""}
      ${s.mobile ? `<div class="r-sub">Ph: ${U.escapeHtml(s.mobile)}</div>` : ""}
      ${s.gstNumber ? `<div class="r-sub">GSTIN: ${U.escapeHtml(s.gstNumber)}</div>` : ""}
      <div class="r-title">${U.escapeHtml(hi ? Printer.hiTitle(s.receiptTitle || "Tax Invoice") : (s.receiptTitle || "Tax Invoice"))}</div>
      <div class="r-div solid"></div>
      <div class="r-meta">${metaLeft}${metaRight}</div>
      <div class="r-div"></div>
      <table class="r-table">
        <thead><tr><th>${l("Item")}</th><th class="c">${l("Qty")}</th><th class="r">${l("Rate")}</th><th class="r">${l("Total")}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="r-div"></div>
      <div class="r-sumblock">
        ${s.showItemCount ? `<div class="r-sumrow"><span class="l">${l("Total Items")}</span><span class="v">${b.items.length}</span></div>` : ""}
        <div class="r-sumrow"><span class="l">${l("Subtotal")}</span><span class="v">${(s.showMrp && mrpSubtotal > b.subtotal) ? `<s style="color:var(--text-muted,#8A8F9B);margin-right:6px;">${money(mrpSubtotal)}</s>` : ""}${money(b.subtotal)}</span></div>
        ${s.showDiscount && b.discount ? `<div class="r-sumrow neg"><span class="l">${l("Discount")}</span><span class="v">-${money(b.discount)}</span></div>` : ""}
        ${s.showTax && b.tax ? `<div class="r-sumrow"><span class="l">${l("Tax")}</span><span class="v">${money(b.tax)}</span></div>` : ""}
        ${b.appliedFees && b.appliedFees.length ? b.appliedFees.map(f => {
          const amt = f.unit === "%" ? (b.subtotal || 0) * (f.value || 0) / 100 : (f.value || 0);
          return `<div class="r-sumrow"><span class="l">${U.escapeHtml(T(f.name || 'Fee'))}</span><span class="v">${money(amt)}</span></div>`;
        }).join("") : (b.additionalFee ? `<div class="r-sumrow"><span class="l">${l("Additional Fee")}</span><span class="v">${money(b.additionalFee)}</span></div>` : "")}
        ${b.deliveryFee ? `<div class="r-sumrow"><span class="l">${l("Delivery")}</span><span class="v">${money(b.deliveryFee)}</span></div>` : ""}
        ${b.packingFee ? `<div class="r-sumrow"><span class="l">${l("Packing")}</span><span class="v">${money(b.packingFee)}</span></div>` : ""}
      </div>
      <div class="r-grand"><span class="l">${l("Grand Total")}</span><span class="v">${money(b.total)}</span></div>
      <div class="r-pay">
        ${s.showPaymentDetails ? `<div class="r-sumrow"><span class="l">${l("Paid via")}</span><span class="v">${U.escapeHtml(l(b.paymentMode || "-"))}</span></div>` : ""}
        ${s.showPaymentDetails && b.paymentSplits && b.paymentSplits.length ? b.paymentSplits.map(sp => `<div class="r-sumrow"><span class="l">&nbsp;&nbsp;${U.escapeHtml(l(sp.mode))}</span><span class="v">${money(sp.amount)}</span></div>`).join("") : ""}
        ${s.showChangeReturn && b.paymentMode === "Cash" ? `
        <div class="r-sumrow"><span class="l">${l("Cash Received")}</span><span class="v">${money(b.cashGiven)}</span></div>
        <div class="r-sumrow"><span class="l">${l("Change Returned")}</span><span class="v">${money(b.changeReturned)}</span></div>` : ""}
        ${sv.total > 0 ? `<div class="r-sumrow"><span class="l">${l("You Saved")}</span><span class="v">${money(sv.total)}</span></div>` : ""}
      </div>
      ${s.showQr ? `
      <div class="r-qr">
        <div class="box">${qrGlyph()}</div>
        <div class="cap">${l("Scan to Verify Invoice")}</div>
      </div>` : ""}
      <div class="r-div"></div>
      <div class="r-foot">
        <div class="thanks">${U.escapeHtml(T(s.thankYouNote || "Thank you for shopping with us!"))}</div>
        <div class="line">${l("Visit Again")}</div>
      </div>
      ${s.showBarcode ? `<div class="r-barcode">*${U.escapeHtml(b.idLabel)}*<span class="id">${U.escapeHtml(b.idLabel)}</span></div>` : ""}
    `;
      }
      function show(b) {
        currentBill = b;
        const pStatus = Printer.statusLabel();
        const s = Settings.get();
        const lang = s.printLang || "en";
        const pw = (s.printer && s.printer.paperWidth) || 58;
        UI.sheet(`
      <div class="sheet-head"><h3>${b.idLabel}</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="receipt-actions">
        <button class="icon-btn dark" onclick="Receipt.send()">Send</button>
        <button class="icon-btn dark" onclick="Receipt.download()">Download</button>
        <button class="icon-btn dark" onclick="Receipt.print()">🖨️ Print</button>
        <button class="icon-btn dark" onclick="EditBill.open(${b.id})">Edit Bill</button>
        <button class="icon-btn dark" onclick="Returns.open(${b.id})">Return</button>
        <button class="icon-btn dark" onclick="Receipt.del(${b.id})">Delete</button>
      </div>
      <div class="section" style="padding-top:0;padding-bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <div class="lang-seg"><span class="lg">🌐 Print Language</span>
          <button class="${lang === 'en' ? 'on' : ''}" onclick="Receipt.setLang('en')">English</button>
          <button class="${lang === 'hi' ? 'on' : ''}" onclick="Receipt.setLang('hi')">हिंदी</button></div>
        <div class="pill ${pStatus.ok ? 'green' : 'red'}" style="cursor:pointer" onclick="More.printerSetup()">${pStatus.text}</div>
        ${b.status === "returned" ? `<div class="pill red">Fully Returned · Refunded ${U.money(b.refundedAmount || 0)}</div>` : b.status === "partially_returned" ? `<div class="pill red">Partially Returned · Refunded ${U.money(b.refundedAmount || 0)}</div>` : ""}
      </div>
      <div class="sheet-body" style="padding:0;">
        <div class="receipt-wrap">
          <div class="receipt ${pw == 80 ? 'w80' : 'w58'}">${html(b, lang)}</div>
        </div>
      </div>
    `);
        if (lang === "hi") Printer.prefetchHindi(b).then(() => {
          const el = document.querySelector(".receipt");
          if (el && currentBill === b && (Settings.get().printLang || "en") === "hi") el.innerHTML = html(b, "hi");
        });
      }
      function setLang(l) { Settings.set({ printLang: l }); SFX.tap(); if (currentBill) show(currentBill); }
      function current() { return currentBill; }
      async function download() {
        if (!currentBill) return;
        U.toast("Bill image ban rahi hai…");
        try {
          const blob = await Printer.billImage(currentBill, Settings.get().printLang || "en");
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${currentBill.idLabel}.png`;
          document.body.appendChild(a); a.click();
          setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
          U.toast("Bill image download ho gayi ✓ (Gallery / Downloads)");
        } catch (e) { U.toast("Download fail: " + e.message); }
      }
      async function openWA(ten) {
        const b = currentBill; if (!b) return;
        const text = await Printer.billText(b, Settings.get().printLang || "en");
        window.open(`https://wa.me/91${ten}?text=${encodeURIComponent(text)}`, "_blank");
      }
      function send() {
        if (!currentBill) return;
        const num = String(currentBill.customerMobile || "").replace(/\D/g, "");
        if (num.length >= 10) { openWA(num.slice(-10)); return; }
        UI.sheet(`<div class="sheet-head"><h3>WhatsApp Number</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body"><div class="hint" style="margin-bottom:10px">Is bill me customer ka mobile number nahi hai.</div>
        <input class="input" id="waNum" type="tel" placeholder="10 digit mobile number" style="margin-bottom:12px">
        <button class="btn primary block" onclick="Receipt.sendTo()">Open WhatsApp</button></div>`, { center: true });
      }
      function sendTo() {
        const v = String((document.getElementById("waNum") || {}).value || "").replace(/\D/g, "");
        if (v.length < 10) { U.toast("Sahi 10 digit number daalein"); return; }
        UI.close(); openWA(v.slice(-10));
      }
      async function print() {
        if (!currentBill) return;
        await Printer.printBill(currentBill, Settings.get().printLang || "en");
      }
      async function del(id) {
        if (!(await UI.confirm("Delete this bill?"))) return;
        await DB.del("bills", id); UI.close(); U.toast("Bill deleted"); Bills.render();
      }
      return { html, show, current, print, del, setLang, download, send, sendTo };
    })();

    /* ================================================================
       EDIT BILL — item add/remove, qty, rate, discount, customer.
       Stock, customer totals, income/profit entries and the Sheet row
       are all corrected by the difference.
    ================================================================ */
    const EditBill = (() => {
      let orig = null, d = null;
      const num = (v) => parseFloat(v) || 0, r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
      async function open(id) {
        const b = await DB.get("bills", id); if (!b) return;
        if (b.status && b.status !== "completed") { U.toast("Return ho chuki bill edit nahi ho sakti"); return; }
        if (b.paymentMode === "PayLater" || (b.paymentSplits && b.paymentSplits.length)) { U.toast("PayLater / Split payment wali bill edit nahi hoti"); return; }
        orig = b; d = JSON.parse(JSON.stringify(b)); d.discount = b.discount || 0;
        render();
      }
      function calc() {
        const sub = d.items.reduce((a, i) => a + num(i.price) * num(i.qty), 0), oldSub = orig.subtotal || 0;
        const tax = orig.tax ? (oldSub ? orig.tax * sub / oldSub : 0) : 0;
        const fees = (d.appliedFees && d.appliedFees.length) ? d.appliedFees.reduce((a, f) => a + (f.unit === "%" ? sub * (f.value || 0) / 100 : (f.value || 0)), 0) : (orig.additionalFee || 0);
        const disc = Math.min(num(d.discount), sub);
        return { sub: r2(sub), tax: r2(tax), fees: r2(fees), disc: r2(disc), total: r2(sub - disc + tax + fees) };
      }
      function totalsHtml() {
        const c = calc();
        return `<div class="r-sumrow"><span class="l">Subtotal</span><span class="v">${U.money(c.sub)}</span></div>
        ${c.disc ? `<div class="r-sumrow"><span class="l">Discount</span><span class="v">-${U.money(c.disc)}</span></div>` : ""}
        ${c.tax ? `<div class="r-sumrow"><span class="l">Tax</span><span class="v">${U.money(c.tax)}</span></div>` : ""}
        ${c.fees ? `<div class="r-sumrow"><span class="l">Fees</span><span class="v">${U.money(c.fees)}</span></div>` : ""}
        <div class="r-sumrow" style="font-weight:800;font-size:15px"><span class="l">New Total</span><span class="v">${U.money(c.total)}</span></div>
        ${c.total !== orig.total ? `<div class="hint">Pehle: ${U.money(orig.total)} (${c.total > orig.total ? "+" : "-"}${U.money(Math.abs(c.total - orig.total))})</div>` : ""}`;
      }
      function refresh() { const el = document.getElementById("ebTotals"); if (el) el.innerHTML = totalsHtml(); }
      function render() {
        const rows = d.items.map((it, i) => `
          <div class="list-row" style="padding:10px 0;align-items:flex-start;">
            <div class="main"><div class="title">${U.escapeHtml(it.name)}</div>
              <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap">
                <button class="icon-btn dark" style="width:30px;height:30px" onclick="EditBill.qty(${i},-1)">−</button>
                <input class="input" type="number" step="any" inputmode="decimal" style="width:62px;text-align:center;padding:6px" value="${it.qty}" onchange="EditBill.setQty(${i},this.value)">
                <button class="icon-btn dark" style="width:30px;height:30px" onclick="EditBill.qty(${i},1)">+</button>
                <span class="hint">×  ₹</span>
                <input class="input" type="number" step="any" inputmode="decimal" style="width:84px;padding:6px" value="${it.price}" onchange="EditBill.setPrice(${i},this.value)">
                <button class="icon-btn dark" style="width:30px;height:30px;color:var(--danger)" onclick="EditBill.remove(${i})">🗑</button>
              </div></div></div>`).join("");
        UI.sheet(`<div class="sheet-head"><h3>Edit Bill · ${U.escapeHtml(orig.idLabel)}</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="row" style="gap:8px;margin-bottom:10px">
          <input class="input" id="ebName" placeholder="Customer name" value="${U.escapeHtml(d.customerName || "")}" oninput="EditBill.setField('customerName',this.value)">
          <input class="input" id="ebMob" type="tel" placeholder="Mobile" value="${U.escapeHtml(d.customerMobile || "")}" oninput="EditBill.setField('customerMobile',this.value)">
        </div>
        <div class="sec-title">Items</div>
        ${rows || '<div class="empty">Koi item nahi</div>'}
        <button class="btn ghost block" style="margin:10px 0" onclick="EditBill.addOpen()">＋ Add Item</button>
        <div class="field"><label class="label">Discount (₹)</label><input class="input" type="number" step="any" inputmode="decimal" value="${d.discount || ""}" placeholder="0" oninput="EditBill.setDiscount(this.value)"></div>
        <div class="r-sumblock" id="ebTotals" style="margin:8px 0 12px">${totalsHtml()}</div>
        <button class="btn primary block" onclick="EditBill.save()">Save Changes</button>
      </div>`);
      }

      async function buildBytes(bill, lang) {

      /* ---------- platform + Bluetooth ---------- */
      function nativeBridge() {

      async function openGatt(dev) {

      async function connectBluetooth(opts) {

          const ok = await openGatt(dev);
          if (!ok) { U.toast("Printer connected but no known print service found"); return false; }
          const cur = Settings.get().printer || {};

      /* Silent reconnect after refresh: reuse the permission Chrome already
         granted (getDevices); if the printer isn't in cache, wait for its
         advertisement and connect as soon as it is seen. */
      async function tryAutoReconnect() {
        if (btConnected && btChar && btDevice && btDevice.gatt && btDevice.gatt.connected) return true;
        if (connecting) return connecting;
        connecting = (async () => {
          try {
            const saved = Settings.get().printer;
            if (!saved || saved.type !== "bluetooth" || !navigator.bluetooth) return false;
            let dev = (btDevice && btDevice.id === saved.btDeviceId) ? btDevice : null;
            if (!dev && navigator.bluetooth.getDevices) {
              const list = await navigator.bluetooth.getDevices();
              dev = list.find(d => d.id === saved.btDeviceId) || list.find(d => d.name && d.name === saved.name) || null;
            }
            if (!dev) return false;
            bindDevice(dev);
            try { if (await openGatt(dev)) return true; } catch (e) { }
            if (!dev.watchAdvertisements) return false;

              const ctl = new AbortController(); let fin = false;

      }
      async function writeToBluetooth(data) {
        let i = 0; const fast = Settings.get().fastBT !== false;
        while (i < data.length) {
          const slice = data.slice(i, i + Math.min(chunkSize, fast ? 512 : 100));
          try {
            if (btChar.writeValueWithoutResponse) await btChar.writeValueWithoutResponse(slice); else await btChar.writeValue(slice);

    /* ================================================================
       HW SCAN — external hardware barcode scanner (Bluetooth/USB)
       Priority chain, same spirit as Printer:
         Real Bluetooth/USB barcode scanners work as a "keyboard wedge" —
         once paired (phone Bluetooth settings, or plugged in via USB),
         they simply type the scanned code as fast keystrokes + Enter/Tab
         into whatever field is focused. No custom protocol needed.
       Web Bluetooth's requestDevice()/gatt.connect() below is a
       best-effort pairing/record step (mirrors Printer Setup's flow) so
       the app can show a real Connected / Not Connected status — the
       actual scan data always arrives through the focused hidden input
       via normal keyboard events, which is what makes this work with
       virtually any hardware scanner without extra native code.
    ================================================================ */
    const HWScan = (() => {
      let btDevice = null;
      let liveEl = null, liveKeyHandler = null, liveBlurHandler = null;

      function statusLabel() {
        const s = Settings.get().barcodeScanner;

        return { ok: false, text: "⚠️ No barcode scanner connected" };

      /* ---------- Web Bluetooth pairing (best-effort) ---------- */
      async function connectBluetooth() {
        if (!navigator.bluetooth) { U.toast("Bluetooth not supported on this browser"); return false; }

          Settings.set({ barcodeScanner: { type: "bluetooth", name: btDevice.name || "Bluetooth Scanner", btDeviceId: btDevice.id } });
          U.toast("Barcode scanner linked: " + (btDevice.name || "Bluetooth Scanner"));

          U.toast("USB barcode scanner linked (basic support)");

        if (btDevice && btDevice.gatt && btDevice.gatt.connected) btDevice.gatt.disconnect();

         code then send Enter/Tab automatically — that's our "detect"

      function attach(el, onDetect) {

      }

    })();

        <div class="field"><label class="label">MRP ₹ (optional)</label><input class="input" id="fMrp" type="number" placeholder="e.g. 30" value="${it.mrp || ''}"></div>
        <div class="field"><label class="label">Hindi Name (optional, Hindi bill ke liye)</label><input class="input" id="fNameHi" placeholder="जैसे: सरस दूध" value="${U.escapeHtml(it.nameHi || '')}"></div>
        <div class="row">
          <div class="field"><label class="label">Unit</label>
            <select class="select" id="fUnit">
              ${["pcs", "bori", "bundle", "patti", "kg", "litre"].map(u => `<option ${it.unit === u ? 'selected' : ''}>${u}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label class="label">Qty in Stock</label><input class="input" id="fStock" type="number" value="${it.stockQty}"></div>
        </div>
        <div class="row">
          <div class="field"><label class="label">Low Stock Alert #</label><input class="input" id="fLow" type="number" value="${it.lowStockThreshold}"></div>
          <div class="field"><label class="label">Expiry Date</label><input class="input" id="fExpiry" type="date" value="${it.expiryDate || ''}"></div>
        </div>
        ${existing ? `<button class="btn ghost block" style="margin-bottom:12px;justify-content:space-between;" onclick="Items.openExtraStockTable(${existing.id})">
          <span style="display:flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> Extra Stock</span>
          ${existing.extraStock && existing.extraStock.length ? `<span class="pill gold">${existing.extraStock.length}</span>` : ''}
        </button>` : ''}
        <div class="row">
          <button class="btn primary block" onclick="Items.save(${existing ? existing.id : 'null'})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save Item</button>
        </div>
        ${existing ? `<button class="btn danger block" style="margin-top:10px" onclick="Items.delItem(${existing.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg> Delete Item</button>` : ''}
      </div>`);
      }
      async function scanForForm() {
        const code = await Scanner.scan();
        if (code) document.getElementById("fBarcode").value = code;
      }
      function previewImage() {
        const url = document.getElementById("fImage").value.trim();
        const el = document.getElementById("fImagePreview");
        if (url) {
          el.innerHTML = `<img src="${U.escapeHtml(url)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.textContent='?';">`;
        } else {
          el.textContent = "?";
        }
      }
      async function save(id) {
        const name = document.getElementById("fName").value.trim();
        if (!name) { SFX.error(); U.toast("Item name daliye"); return; }
        const obj = {
          name, category: document.getElementById("fCategory").value,
          imageUrl: document.getElementById("fImage").value.trim(),
          barcode: document.getElementById("fBarcode").value.trim(),
          sellPrice: parseFloat(document.getElementById("fSell").value) || 0,
          buyPrice: parseFloat(document.getElementById("fBuy").value) || 0,
          mrp: parseFloat(document.getElementById("fMrp").value) || 0, nameHi: ((document.getElementById("fNameHi") || {}).value || "").trim(),
          unit: document.getElementById("fUnit").value,
          stockQty: parseFloat(document.getElementById("fStock").value) || 0,
          lowStockThreshold: parseFloat(document.getElementById("fLow").value) || 0,
          expiryDate: document.getElementById("fExpiry").value
        };
        if (id) obj.id = id;
        const savedId = await DB.put("items", obj);
        const pid = id || savedId;
        Sync.push("Products", "Product ID", {
          "Product ID": pid, "Product Name": obj.name, "Category": obj.category,
          "Barcode": obj.barcode, "Selling Price": obj.sellPrice, "Buying Price": obj.buyPrice, "MRP": obj.mrp,
          "Unit": obj.unit, "Opening Stock": obj.stockQty, "Low Stock Alert": obj.lowStockThreshold,
          "Expiry Date": obj.expiryDate, "Image URL": obj.imageUrl
        });
        SFX.success();
        UI.close(); U.toast("Item saved"); render();
      }
      async function openExtraStockTable(id) {
        const it = await DB.get("items", id);
        const batches = (it && it.extraStock) || [];
        UI.sheet(`
      <div class="sheet-head"><h3>Extra Stock — ${U.escapeHtml(it.name)}</h3><button class="icon-btn dark" onclick="Items.openEdit(${id})">✕</button></div>
      <div class="sheet-body" style="padding:0;">
        ${batches.length === 0 ? `<div class="empty" style="padding:30px 20px;">No extra stock batches yet</div>` : `
        <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <thead>
            <tr style="background:var(--paper);">
              <th style="text-align:left;padding:10px 12px;font-weight:800;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;">Date</th>
              <th style="text-align:center;padding:10px 8px;font-weight:800;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;">Stock</th>
              <th style="text-align:right;padding:10px 12px;font-weight:800;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;">Sell Price</th>
              <th style="text-align:right;padding:10px 12px;font-weight:800;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;">Buy Price</th>
            </tr>
          </thead>
          <tbody>
            ${batches.map(b => `
              <tr style="border-bottom:1px solid var(--line);">
                <td style="padding:10px 12px;color:var(--text-muted);">${U.fmtDate(b.date)}<br><span style="font-size:10.5px;">${U.fmtTime(b.date)}</span></td>
                <td style="padding:10px 8px;text-align:center;font-weight:700;" class="num">${b.qty} ${U.escapeHtml(it.unit || "")}</td>
                <td style="padding:10px 12px;text-align:right;font-weight:700;" class="num">${U.money(b.sellPrice)}</td>
                <td style="padding:10px 12px;text-align:right;color:var(--text-muted);" class="num">${U.money(b.buyPrice)}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        </div>`}
        <div class="section">
          <div class="hint">New stock jab bhi "Add Stock" se daala jaayega, yahan naya row apne aap jud jaayega.</div>
        </div>
      </div>`);
      }
      async function openEdit(id) { openItemForm(await DB.get("items", id)); }
      async function delItem(id) { if (!(await UI.confirm("Delete item?"))) return; await DB.del("items", id); SFX.remove(); UI.close(); render(); }
      function openCategoryForm() {
        UI.sheet(`<div class="sheet-head"><h3>Add Category</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label class="label">Category Name</label><input class="input" id="fCatName" placeholder="e.g. Dairy, Snacks"></div>
        <button class="btn primary block" onclick="Items.saveCategory()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save Category</button>
      </div>`);
      }
      async function saveCategory() {
        const name = document.getElementById("fCatName").value.trim();
        if (!name) return;
        const cid = await DB.put("categories", { name });
        Sync.push("Categories", "Category ID", { "Category ID": cid, "Category Name": name });
        UI.close(); U.toast("Category added"); render();
      }
      async function delCategory(id) { await DB.del("categories", id); render(); }
      async function scan() {
        const code = await Scanner.scan();
        if (!code) return;
        const items = await DB.all("items");
        const it = items.find(i => String(i.barcode || "").trim() === String(code || "").trim());
        if (it) {
          if (tab !== "items") switchTab("items");
          document.getElementById("itemsSearch").value = it.name;
          render();
        } else {
          U.toast("Item not found for this barcode");
        }
      }
      async function promoteExtraStock(it) {
        if ((Number(it.stockQty) || 0) > 0) return it;
        if (!it.extraStock || it.extraStock.length === 0) return it;
        const batch = it.extraStock.shift();
        it.stockQty = batch.qty;
        it.buyPrice = batch.buyPrice;
        it.sellPrice = batch.sellPrice;
        await DB.put("items", it);
        Sync.push("Products", "Product ID", {
          "Product ID": it.id, "Product Name": it.name, "Category": it.category,
          "Barcode": it.barcode, "Selling Price": it.sellPrice, "Buying Price": it.buyPrice,
          "Unit": it.unit, "Opening Stock": it.stockQty, "Low Stock Alert": it.lowStockThreshold,
          "Expiry Date": it.expiryDate, "Image URL": it.imageUrl
        });
        Sync.deleteBatch("New stoke", it.id, batch.date);
        return it;
      }
      function toggleExtraStock(id) {
        const panel = document.getElementById(`extraPanel_${id}`);
        const arrow = document.getElementById(`extraArrow_${id}`);
        if (!panel) return;
        const open = panel.style.display !== "none";
        panel.style.display = open ? "none" : "block";
        if (arrow) arrow.style.transform = open ? "rotate(0deg)" : "rotate(180deg)";
      }
      return { switchTab, render, openAdd, openItemForm, scanForForm, previewImage, save, openEdit, delItem, openCategoryForm, saveCategory, delCategory, scan, promoteExtraStock, toggleExtraStock, openExtraStockTable };
    })();

    /* ================================================================
       ADD STOCK — bulk stock intake page with search, barcode scan,
       per-item qty/price entry and a resumable draft ("Save for Later")
    ================================================================ */
    const StockAdd = (() => {
      const DRAFT_KEY = "rakeshmart_addstock_draft";
      let sessionDraft = {};
      let currentSupplier = null;

      function loadDraft() {
        try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "{}"); } catch (e) { return {}; }
      }
      function persistDraft(obj) {
        try { localStorage.setItem(DRAFT_KEY, JSON.stringify(obj)); } catch (e) { }
      }
      function clearPersistedDraft() {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { }
      }

      async function openSupplierPicker() {
        const list = (await DB.all("suppliers")).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        UI.sheet(`<div class="sheet-head"><h3>Choose Supplier</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:12px;">Stock add karne se pehle supplier chuno</div>
        <button class="btn primary block" style="margin-bottom:12px" onclick="StockAdd.addSupplierInline()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg> Add New Supplier</button>
        ${list.length === 0 ? '<div class="empty">No suppliers yet. Add one to continue.</div>' : list.map(s => `
          <div class="list-row" style="padding:10px 0;cursor:pointer;" onclick="StockAdd.pickSupplier(${s.id})">
            <div class="avatar" style="background:var(--gold-dark)">${U.initials(s.name)}</div>
            <div class="main"><div class="title">${U.escapeHtml(s.name)}</div><div class="meta">${U.escapeHtml(s.mobile || "")}${s.location ? " · " + U.escapeHtml(s.location) : ""}</div></div>
            <div class="right"><svg viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></div>
          </div>`).join("")}
      </div>`);
      }
      function addSupplierInline() {
        UI.sheet(`<div class="sheet-head"><h3>Add Supplier</h3><button class="icon-btn dark" onclick="StockAdd.openSupplierPicker()">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label class="label">Name</label><input class="input" id="supName"></div>
        <div class="field"><label class="label">Mobile Number</label><input class="input" id="supMobile" inputmode="numeric"></div>
        <div class="field"><label class="label">Location</label><input class="input" id="supLocation"></div>
        <button class="btn primary block" onclick="StockAdd.saveSupplierInline()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save & Continue</button>
      </div>`);
      }
      async function saveSupplierInline() {
        const name = document.getElementById("supName").value.trim();
        const mobile = document.getElementById("supMobile").value.trim();
        const location = document.getElementById("supLocation").value.trim();
        if (!name) { SFX.error(); U.toast("Naam bharo"); return; }
        const obj = { name, mobile, location };
        const newId = await DB.put("suppliers", obj);
        Sync.push("Suppliers", "Supplier ID", { "Supplier ID": newId, "Name": name, "Mobile": mobile, "Location": location });
        SFX.success();
        pickSupplier(newId);
      }
      async function pickSupplier(id) {
        const s = await DB.get("suppliers", id);
        if (!s) { openSupplierPicker(); return; }
        open(s);
      }

      function open(supplier) {
        currentSupplier = supplier || currentSupplier;
        if (!currentSupplier) { openSupplierPicker(); return; }
        sessionDraft = JSON.parse(JSON.stringify(loadDraft()));
        Router.go("addstock");
        document.getElementById("stockAddSearch").value = "";
        const bar = document.getElementById("stockAddSupplierBar");
        if (bar) bar.innerHTML = `<span>Supplier: ${U.escapeHtml(currentSupplier.name)}</span><span onclick="StockAdd.openSupplierPicker()" style="color:var(--gold-dark);cursor:pointer;">Change</span>`;
        render();
      }
      function close() {
        sessionDraft = {};
        currentSupplier = null;
        Router.go("items");
      }

      async function render() {
        const q = document.getElementById("stockAddSearch").value.trim().toLowerCase();
        const items = (await DB.all("items")).filter(i => (typeof i.name === "string" ? i.name : Array.isArray(i.name) ? (i.name[0] || "") : String(i.name || "")).toLowerCase().includes(q));
        const body = document.getElementById("stockAddBody");
        document.getElementById("stockAddCountSub").textContent = `${items.length} items`;
        if (items.length === 0) { body.innerHTML = `<div class="empty">No items found</div>`; return; }
        body.innerHTML = items.map(it => {
          const d = sessionDraft[it.id] || {};
          const qtyVal = d.qty !== undefined ? d.qty : "";
          const priceVal = d.price !== undefined ? d.price : (it.buyPrice || "");
          const sellVal = d.sellPrice !== undefined ? d.sellPrice : (it.sellPrice || "");
          const total = (Number(qtyVal) || 0) * (Number(priceVal) || 0);
          return `<div class="list-row" style="flex-direction:column; align-items:stretch; gap:8px;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${U.itemAvatar(it, 'var(--ink)')}
          <div class="main"><div class="title">${U.escapeHtml(it.name)}</div><div class="meta">Current stock: ${it.stockQty ?? 0} ${U.escapeHtml(it.unit || "")}</div></div>
        </div>
        <div class="row" style="gap:8px;">
          <div class="field" style="margin-bottom:0;">
            <label class="label" style="margin-bottom:3px;">New Stock</label>
            <input class="input num" type="number" min="0" placeholder="Qty" style="padding:8px 10px;" id="saQty_${it.id}" value="${qtyVal}" oninput="StockAdd.recalcRow(${it.id})">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="label" style="margin-bottom:3px;">New Buy Price ₹</label>
            <input class="input num" type="number" min="0" step="0.01" style="padding:8px 10px;" id="saPrice_${it.id}" value="${priceVal}" oninput="StockAdd.recalcRow(${it.id})">
          </div>
        </div>
        <div class="row" style="gap:8px;">
          <div class="field" style="margin-bottom:0;">
            <label class="label" style="margin-bottom:3px;">New Sell Price ₹</label>
            <input class="input num" type="number" min="0" step="0.01" style="padding:8px 10px;" id="saSell_${it.id}" value="${sellVal}" oninput="StockAdd.recalcRow(${it.id})">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label class="label" style="margin-bottom:3px;">Total</label>
            <div class="input num" style="padding:8px 10px;background:var(--paper);color:var(--text-muted);font-weight:700;" id="saTotal_${it.id}">${U.money(total)}</div>
          </div>
        </div>
      </div>`;
        }).join("");
        updateGrandTotal();
      }

      function updateGrandTotal() {
        let sum = 0;
        Object.values(sessionDraft).forEach(d => {
          sum += (Number(d.qty) || 0) * (Number(d.price) || 0);
        });
        const el = document.getElementById("stockAddGrandTotal");
        if (el) el.textContent = U.money(sum);
      }

      function recalcRow(itemId) {
        const qtyEl = document.getElementById(`saQty_${itemId}`);
        const priceEl = document.getElementById(`saPrice_${itemId}`);
        const sellEl = document.getElementById(`saSell_${itemId}`);
        if (!qtyEl || !priceEl) return;
        const qtyNum = Number(qtyEl.value) || 0;
        const priceNum = Number(priceEl.value) || 0;
        document.getElementById(`saTotal_${itemId}`).textContent = U.money(qtyNum * priceNum);
        if (qtyEl.value !== "" || priceEl.value !== "" || (sellEl && sellEl.value !== "")) {
          sessionDraft[itemId] = { qty: qtyEl.value, price: priceEl.value, sellPrice: sellEl ? sellEl.value : "" };
        } else {
          delete sessionDraft[itemId];
        }
        updateGrandTotal();
      }

      async function scan() {
        const code = await Scanner.scan();
        if (!code) return;
        const items = await DB.all("items");
        const it = items.find(i => String(i.barcode || "").trim() === String(code || "").trim());
        if (it) {
          document.getElementById("stockAddSearch").value = it.name;
          await render();
          const qtyEl = document.getElementById(`saQty_${it.id}`);
          if (qtyEl) qtyEl.focus();
        } else {
          U.toast("Item not found for this barcode");
        }
      }

      function saveForLater() {
        persistDraft(sessionDraft);
        U.toast("Saved for later");
        sessionDraft = {};
        Router.go("items");
      }

      async function done() {
        const ids = Object.keys(sessionDraft).filter(id => (Number(sessionDraft[id].qty) || 0) > 0);
        if (ids.length === 0) { U.toast("Kisi item me stock qty nahi dali"); return; }
        if (!currentSupplier) { U.toast("Supplier select karo pehle"); openSupplierPicker(); return; }
        const purchaseItems = [];
        for (const id of ids) {
          const it = await DB.get("items", Number(id));
          if (!it) continue;
          const addQty = Number(sessionDraft[id].qty) || 0;
          const newBuy = Number(sessionDraft[id].price);
          const newSell = Number(sessionDraft[id].sellPrice);
          const buyPrice = (!isNaN(newBuy) && newBuy > 0) ? newBuy : (it.buyPrice || 0);
          const sellPrice = (!isNaN(newSell) && newSell > 0) ? newSell : (it.sellPrice || 0);
          const currentStock = Number(it.stockQty) || 0;
          purchaseItems.push({ name: it.name, qty: addQty, price: buyPrice });

          if (currentStock <= 0) {
            it.stockQty = addQty;
            it.buyPrice = buyPrice;
            it.sellPrice = sellPrice;
            await DB.put("items", it);
            Sync.push("Products", "Product ID", {
              "Product ID": it.id, "Product Name": it.name, "Category": it.category,
              "Barcode": it.barcode, "Selling Price": it.sellPrice, "Buying Price": it.buyPrice,
              "Unit": it.unit, "Opening Stock": it.stockQty, "Low Stock Alert": it.lowStockThreshold,
              "Expiry Date": it.expiryDate, "Image URL": it.imageUrl
            });
          } else {
            const batchDate = new Date().toISOString();
            it.extraStock = it.extraStock || [];
            it.extraStock.push({ qty: addQty, buyPrice, sellPrice, date: batchDate });
            await DB.put("items", it);
            Sync.push("New stoke", "", {
              "Product ID": it.id, "Item name": it.name, "Stoke": addQty,
              "Buy price": buyPrice, "sell price": sellPrice, "date": batchDate
            });
          }
        }
        const purchaseTotal = purchaseItems.reduce((sum, pi) => sum + pi.qty * pi.price, 0);
        const existingPurchases = await DB.all("purchases");
        const purchase = {
          idLabel: `PUR-${existingPurchases.length + 1}`,
          date: new Date().toISOString(),
          supplierId: currentSupplier.id,
          supplierName: currentSupplier.name,
          supplierMobile: currentSupplier.mobile || "",
          supplierLocation: currentSupplier.location || "",
          items: purchaseItems,
          total: purchaseTotal
        };
        await DB.put("purchases", purchase);
        Sync.push("Purchases", "Purchase No.", {
          "Purchase No.": purchase.idLabel, "Date & Time": purchase.date,
          "Supplier Name": purchase.supplierName, "Supplier Mobile": purchase.supplierMobile,
          "Products": purchaseItems.map(pi => `${pi.name} x${pi.qty}`).join(", "),
          "Total": purchase.total
        });
        // Stock purchase ko Income & Expense me expense ke roop me bhi save karo
        if (purchaseTotal > 0) {
          await DB.put("transactions", { date: purchase.date, type: "expense", label: `Stock Purchase ${purchase.idLabel} (${purchase.supplierName})`, amount: purchaseTotal });
          Sync.push("Income & Expenses", "", { "Date": purchase.date, "Type": "expense", "Label": `Stock Purchase ${purchase.idLabel} (${purchase.supplierName})`, "Amount": purchaseTotal });
        }
        sessionDraft = {};
        clearPersistedDraft();
        SFX.success();
        U.toast(`Stock updated for ${ids.length} item${ids.length === 1 ? "" : "s"}`);
        Purchases.showReceiptSheet(purchase);
        currentSupplier = null;
      }

      return { open, close, render, recalcRow, scan, saveForLater, done, openSupplierPicker, addSupplierInline, saveSupplierInline, pickSupplier };
    })();

    /* ================================================================
       PURCHASES — purchase bills created from Add Stock, with print & history
    ================================================================ */
    const Purchases = (() => {
      function showReceiptSheet(p) {
        UI.sheet(`<div class="sheet-head"><h3>${U.escapeHtml(p.idLabel)}</h3><button class="icon-btn dark" onclick="UI.close();Router.go('items')">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:10px;">${U.fmtDate(p.date)} · ${U.fmtTime(p.date)}</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-weight:700;">Supplier</span><span>${U.escapeHtml(p.supplierName)}</span></div>
        ${p.supplierMobile ? `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:var(--text-muted);">Mobile</span><span>${U.escapeHtml(p.supplierMobile)}</span></div>` : ""}
        ${p.supplierLocation ? `<div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="color:var(--text-muted);">Location</span><span>${U.escapeHtml(p.supplierLocation)}</span></div>` : ""}
        <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:12px;">

        await Printer.printBill({
          idLabel: p.idLabel, date: p.date,
          customerName: p.supplierName, customerMobile: p.supplierMobile, customerAddress: p.supplierLocation,
          items: p.items, subtotal: p.total, discount: 0, tax: 0, total: p.total,
          paymentMode: "", docTitle: "Purchase Bill", docType: "purchase"
        });
      }
      async function open() {
        const list = (await DB.all("purchases")).sort((a, b) => new Date(b.date) - new Date(a.date));
        UI.sheet(`<div class="sheet-head"><h3>Purchase History</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        ${list.length === 0 ? '<div class="empty">No purchases yet</div>' : list.map(p => `
          <div class="list-row" style="padding:10px 0;cursor:pointer;" onclick="Purchases.viewDetail(${p.id})">
            <div class="avatar" style="background:var(--gold-dark)">${U.initials(p.supplierName)}</div>
            <div class="main"><div class="title">${U.escapeHtml(p.idLabel)}</div><div class="meta">${U.escapeHtml(p.supplierName)} · ${U.fmtDate(p.date)}</div></div>
            <div class="right title num">${U.money(p.total)}</div>
          </div>`).join("")}
      </div>`);
      }
      async function viewDetail(id) {
        const p = await DB.get("purchases", id);
        if (!p) { open(); return; }
        UI.sheet(`<div class="sheet-head"><h3>${U.escapeHtml(p.idLabel)}</h3><button class="icon-btn dark" onclick="Purchases.open()">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:10px;">${U.fmtDate(p.date)} · ${U.fmtTime(p.date)}</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-weight:700;">Supplier</span><span>${U.escapeHtml(p.supplierName)}</span></div>
        ${p.supplierMobile ? `<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="color:var(--text-muted);">Mobile</span><span>${U.escapeHtml(p.supplierMobile)}</span></div>` : ""}
        ${p.supplierLocation ? `<div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="color:var(--text-muted);">Location</span><span>${U.escapeHtml(p.supplierLocation)}</span></div>` : ""}
        <div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:12px;">
          ${p.items.map(it => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${U.escapeHtml(it.name)} x${it.qty}</span><span class="num">${U.money(it.qty * it.price)}</span></div>`).join("")}
        </div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:16px;"><span>Total</span><span class="num">${U.money(p.total)}</span></div>
        <button class="btn primary block" onclick="Purchases.print(${p.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print Bill</button>
      </div>`);
      }
      return { open, viewDetail, print, showReceiptSheet };
    })();

    /* ================================================================
       BARCODE SCANNER — uses BarcodeDetector where available
    ================================================================ */
    const Scanner = (() => {
      async function scan() {
        if (!("BarcodeDetector" in window)) {
          const manual = prompt("Barcode scanner is not supported on this browser.\nEnter barcode manually:");
          return manual ? manual.trim() : null;
        }
        return new Promise(async (resolve) => {
          const video = document.createElement("video");
          video.style.cssText = "width:100%;height:260px;object-fit:cover;border-radius:12px;background:#000";
          video.autoplay = true; video.muted = true; video.playsInline = true;
          UI.sheet(`<div class="sheet-head"><h3>Scan Barcode</h3><button class="icon-btn dark" id="scanClose">✕</button></div><div class="sheet-body" id="scanHolder"></div>`, { center: true });
          document.getElementById("scanHolder").appendChild(video);
          let stream, stop = false;
          document.getElementById("scanClose").onclick = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); UI.close(); resolve(null); };
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            const detector = new BarcodeDetector();
            const loop = async () => {
              if (stop) return;
              try {
                const codes = await detector.detect(video);
                if (codes.length) { stop = true; stream.getTracks().forEach(t => t.stop()); UI.close(); resolve(codes[0].rawValue); return; }
              } catch (e) { }
              requestAnimationFrame(loop);
            };
            loop();
          } catch (e) {
            U.toast("Camera access denied"); UI.close(); resolve(null);
          }
        });
      }
      return { scan };
    })();

    const Counter = (() => {
      const state = { started: false, step: "home", customer: null, cart: {}, savedSales: [], appliedTaxes: [], appliedDiscounts: [], appliedFees: [], scanMode: null };
      function calcAmounts(cart) {
        const subtotal = cartTotalFor(cart);
        const discountAmt = state.appliedDiscounts.reduce((sum, d) => sum + (d.unit === "%" ? subtotal * (d.value || 0) / 100 : (d.value || 0)), 0);
        const taxableBase = Math.max(0, subtotal - discountAmt);
        const taxAmt = state.appliedTaxes.reduce((sum, t) => sum + taxableBase * (t.pct || 0) / 100, 0);
        const feeAmt = state.appliedFees.reduce((sum, f) => sum + (f.unit === "%" ? subtotal * (f.value || 0) / 100 : (f.value || 0)), 0);
        return { subtotal, discountAmt, taxAmt, taxableBase, feeAmt };
      }

      function renderHome() {
        state.started = false;
        const root = document.getElementById("counterRoot");
        root.innerHTML = `
      <div class="topbar"><h1>Counter</h1></div>
      <div class="scroll">
        <div class="section" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:60px;">
          <button class="btn gold" style="padding:20px 36px;border-radius:18px;font-size:16px;" onclick="Counter.startSale()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> New Sale</button>
        </div>
        <div id="savedSalesArea"></div>
        <div style="display:flex;justify-content:center;margin:18px 14px 6px"><button class="btn danger" style="padding:10px 22px;" onclick="UseItems.openGrid()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8L2 22M17.5 15H9"/></svg> Use Items</button></div>
      </div>`;
        renderSavedSales();
      }
      async function renderSavedSales() {
        const area = document.getElementById("savedSalesArea");
        if (!area) return;
        const list = await DB.all("savedSales");
        if (list.length === 0) { area.innerHTML = ""; return; }
        area.innerHTML = `<div class="date-head">Saved For Later</div>` + list.map((s) => `
      <div class="list-row" onclick="Counter.resumeSaved(${s.id})">
        ${U.custAvatar(s.customer || { name: "WI" })}
        <div class="main"><div class="title">${U.escapeHtml(s.customer?.name || "Walk-in")}</div><div class="meta">${Object.keys(s.cart).length} items</div></div>
        <div class="right title num">${U.money(cartTotalFor(s.cart))}</div>
      </div>`).join("");
      }
      async function resumeSaved(id) {
        const s = await DB.get("savedSales", id);
        if (!s) return;
        state.customer = s.customer; state.cart = s.cart;
        await DB.del("savedSales", id);
        Sync.call({ action: "deleteByKey", sheet: "Saved Sales", key: "Saved ID", keyValue: id });
        startSale(true);
      }

      function startSale(skipCustomer) {
        state.started = true; state.step = "customer";
        state.appliedTaxes = []; state.appliedDiscounts = []; state.appliedFees = [];
        if (skipCustomer) { openItemGrid(); return; }
        openCustomerSelect();
      }

      async function openCustomerSelect() {
        const root = document.getElementById("counterRoot");
        const customers = await DB.all("customers");
        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="Counter.renderHome()">←</button><h1 style="flex:1">Select Customer</h1></div>
      <div class="item-search"><input class="input" id="custSearch" placeholder="Search customer..." oninput="Counter.filterCustomers()"></div>
      <div class="scroll">
        <div class="list-row" onclick="Counter.pickCustomer(null)">
          <div class="avatar" style="background:var(--gold-dark)">WI</div>
          <div class="main"><div class="title">Walk-in Customer</div><div class="meta">No details</div></div>
        </div>
        <div class="list-row" onclick="Counter.openAddCustomer()" style="background:#FFE8DA;">
          <div class="avatar" style="background:var(--gold);"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg></div>
          <div class="main"><div class="title" style="color:var(--gold-dark);">+ Add New Customer</div></div>
        </div>
        <div id="custList">${customers.map(c => custRow(c)).join("")}</div>
      </div>`;
        root._customers = customers;
      }
      function custRow(c) {
        return `<div class="list-row" onclick="Counter.pickCustomer(${c.id})">
      ${U.custAvatar(c)}
      <div class="main"><div class="title">${U.escapeHtml(c.name)}</div><div class="meta">${U.escapeHtml(c.mobile || "")}</div></div>
    </div>`;
      }
      function filterCustomers() {
        const root = document.getElementById("counterRoot");
        const q = document.getElementById("custSearch").value.toLowerCase();
        document.getElementById("custList").innerHTML = (root._customers || []).filter(c => (c.name || "").toLowerCase().includes(q)).map(custRow).join("");
      }
            function openAddCustomer() {
        UI.sheet(`<div class="sheet-head"><h3>Add Customer</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <input type="hidden" id="cId" value="">
        <div class="field"><label class="label">Photo / Image Link</label>
          <div class="row" style="align-items:flex-start;">
            <input class="input" id="cPhotoUrl" placeholder="Paste Google Drive / GitHub / Image URL" oninput="Counter.previewCustomerPhoto()">
            <div id="cPhotoPreview" style="flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;background:#EEF1F6;display:flex;align-items:center;justify-content:center;color:#B7BDCB;font-weight:800;font-size:13px;">?</div>
            <input type="file" id="cPhotoFileInput" accept="image/*" class="visually-hidden" onchange="Counter.handlePhotoFileChange(event,'cPhotoUrl','cPhotoPreview')">
            <label for="cPhotoFileInput" class="icon-btn dark" style="width:44px;flex-shrink:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></label>
          </div>
        </div>
        <div class="field"><label class="label">Name</label><input class="input" id="cName"></div>
        <div class="field"><label class="label">Mobile Number</label><input class="input" id="cMobile" inputmode="numeric"></div>
        <div class="row">
          <div class="field"><label class="label">Gender</label><select class="select" id="cGender"><option>Male</option><option>Female</option></select></div>
          <div class="field"><label class="label">Date of Birth</label><input class="input" id="cDob" type="date"></div>
        </div>
        <div class="field"><label class="label">Address</label><input class="input" id="cAddr"></div>
        <button class="btn primary block" onclick="Counter.saveAddCustomer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save & Select</button>
      </div>`);
      }

            function previewCustomerPhoto() {
        const raw = document.getElementById('cPhotoUrl').value.trim();
        const preview = document.getElementById('cPhotoPreview');
        if (!raw) { preview.textContent = '?'; return; }
        if (U.driveFolderId(raw)) {
          preview.textContent = '?';
          U.toast('Ye Google Drive folder link hai. Customer DP ke liye image/file ka link dijiye.');
          return;
        }
        const url = U.getCustomerImageUrl(raw);
        const alt = U.getCustomerImageUrlAlt(raw);
        preview.innerHTML = `<img src="${U.escapeHtml(url)}" data-alt="${U.escapeHtml(alt)}" data-tried-alt="0" style="width:100%;height:100%;object-fit:cover;" onerror="if(this.dataset.triedAlt==='0'&&this.dataset.alt){this.dataset.triedAlt='1';this.src=this.dataset.alt;}else{this.style.display='none';this.parentElement.textContent='?';}">`;
      }

      async function handlePhotoFileChange(ev, inputId, previewId) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) { U.toast('Please select an image'); ev.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = async function(e) {
          let base64 = e.target.result;
          base64 = await U.resizeImageBase64(base64, 1000, 0.82);
          const preview = document.getElementById(previewId);
          if (preview) preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;">`;
          U.toast('Uploading photo...');

          // Customer ID pehle chahiye — warna backend Sheet me matching
          // row nahi dhoond payega. Agar abhi tak nahi bana, to yahin
          // generate karke ek placeholder row bhi push kar do.
          const idField = document.getElementById('cId');
          let cid = idField && idField.value ? Number(idField.value) : null;
          if (!cid) {
            cid = await Sync.getNextId('Customers', 'Customer ID');
            if (cid) {
              if (idField) idField.value = cid;
              // MUST be awaited: this row has to exist in the Sheet before we
              // write the Photo URL, otherwise this later "Photo: ''" write can
              // land after the URL write and blank it back out.
              await Sync.push('Customers', 'Customer ID', {
                'Customer ID': cid,
                'Name': document.getElementById('cName').value.trim(),
                'Mobile': document.getElementById('cMobile').value.trim(),
                'Gender': document.getElementById('cGender').value,
                'DOB': document.getElementById('cDob').value,
                'Address': document.getElementById('cAddr').value.trim(),
                'Photo': ''
              });
            }
          }
          if (!cid) { U.toast('Customer ID nahi mila, dobara try karo'); return; }

          const mobileHint = (document.getElementById('cMobile')?.value || '').trim() || String(cid);
          await PhotoUpload.choose(base64, file.type, mobileHint, previewId, async function(url) {
            const inputField = document.getElementById(inputId);
            if (inputField) inputField.value = url || '';
            if (url && String(url).indexOf('http') === 0) {
              const existing = await DB.get('customers', cid);
              if (existing) { existing.photo = url; await DB.put('customers', existing); }
            }
          }, { targetSheet: 'Customers', targetColumn: 'Photo', key: 'Customer ID', keyValue: cid });
        };
        reader.readAsDataURL(file);
        ev.target.value = ''; // allow re-selecting the same photo later
      }

      async function saveAddCustomer() {
        const name = document.getElementById("cName").value.trim();
        if (!name) { U.toast("Naam daliye"); return; }
        const photoUrl = document.getElementById("cPhotoUrl")?.value.trim() || "";
        const idField = document.getElementById("cId");
        const preId = idField && idField.value ? Number(idField.value) : null;
        const obj = { name, mobile: document.getElementById("cMobile").value.trim(), gender: document.getElementById("cGender").value, dob: document.getElementById("cDob").value, address: document.getElementById("cAddr").value.trim(), photo: photoUrl };
        if (preId) obj.id = preId;
        const id = await DB.put("customers", obj);
        Sync.push("Customers", "Customer ID", {
          "Customer ID": id, "Name": obj.name, "Mobile": obj.mobile, "Gender": obj.gender,
          "DOB": obj.dob, "Address": obj.address, "Photo": obj.photo || ""
        });
        UI.close(); pickCustomer(id);
      }
      async function pickCustomer(id) {
        state.customer = id ? await DB.get("customers", id) : null;
        openItemGrid();
      }

      async function openItemGrid() {
        state.step = "items";
        const root = document.getElementById("counterRoot");
        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="Counter.renderHome()">✕</button>
        <div style="flex:1"><h1 style="font-size:14px">${state.customer ? U.escapeHtml(state.customer.name) : "Walk-in Customer"}</h1></div>
      </div>
      <div class="item-search">
        <input class="input" id="itemGridSearch" placeholder="Search item..." oninput="Counter.renderGrid()">
        <button class="icon-btn dark" onclick="Counter.scanBarcode()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg></button>
      </div>
      <div class="scroll" style="position:relative;"><div class="item-grid" id="itemGridBody"></div></div>

        renderGrid();

      async function renderGrid() {
        const q = document.getElementById("itemGridSearch").value.toLowerCase();
        const items = (await DB.all("items")).filter(i => (typeof i.name === "string" ? i.name : Array.isArray(i.name) ? (i.name[0] || "") : String(i.name || "")).toLowerCase().includes(q));

        if (items.length === 0) { body.innerHTML = `<div class="empty" style="grid-column:1/-1">No items found</div>`; return; }

          const qty = state.cart[it.id]?.qty || 0;

      let longPressTimer = null;
      let longPressFired = false;
      function startLongPress(itemId) {
        longPressFired = false;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          removeFromCart(itemId);
        }, 1000);
      }
      function cancelLongPress() {
        clearTimeout(longPressTimer);
      }
      function handleCardClick(itemId) {
        if (longPressFired) { longPressFired = false; return; }
        addToCart(itemId);
      }
      function removeFromCart(itemId) {
        if (!state.cart[itemId]) return;
        const name = state.cart[itemId].name;
        delete state.cart[itemId];
        if (navigator.vibrate) navigator.vibrate(35);
