    /* ---------- 1. Field maps between app Settings keys <-> Sheet column headers ---------- */
    // Business details ab Receipt Setting ka hi hissa hain — isliye ek hi
    // complete map, Business Setting sheet ko bilkul touch nahi karta.
    const RECEIPT_FIELD_MAP = {
      logo: "Store Logo URL", businessName: "Business Name", mobile: "Mobile Number",
      address: "Business Address", gstNumber: "GST Number", cashierName: "Cashier Name",
      receiptTitle: "Receipt Title", thankYouNote: "Thank You Note", orderBy: "Order Items By",
      showRate: "Show Rate In Receipt", showSaved: "Show Total Money Saved", showMrp: "Show MRP & Savings In Receipt", showCashier: "Show Cashier Name",
      showCustName: "Show Customer Name & Mobile", showCustAddr: "Show Customer Address",
      showItemCount: "Show Total Item Count", showTax: "Show Tax In Receipt", showDiscount: "Show Discount In Receipt",
      showChangeReturn: "Show Cash Received / Change", showPaymentDetails: "Show Payment Mode",
      showQr: "Show QR Code", showBarcode: "Show Barcode"
    };

    // Business Setting sheet ke liye dynamic column builder (Tax/Discount/
    // Fee/Payment Mode groups horizontal repeated columns me jaate hain)
    Sync.pushBusinessSettings = function () {
      if (!Sync.getUrl()) return;
      const s = Settings.get();
      const data = {
        "Bill ID Prefix": s.idPrefix,
        "Round Off": !!s.roundOff,
        "Sound Effects": s.soundOn !== false
      };
      (s.taxes || []).forEach(function (t, i) {
        data["Tax " + (i + 1) + " Name"] = t.name || "";
        data["Tax " + (i + 1) + " Value"] = t.pct || 0;
      });
      (s.discounts || []).forEach(function (d, i) {
        data["Discount " + (i + 1) + " Name"] = d.name || "";
        data["Discount " + (i + 1) + " Value"] = d.value || 0;
        data["Discount " + (i + 1) + " Unit"] = d.unit || "%";
      });
      (s.paymentModes || []).forEach(function (m, i) {
        data["Payment Mode " + (i + 1)] = m;
      });
      (s.fees || []).forEach(function (f, i) {
        data["Fee " + (i + 1) + " Name"] = f.name || "";
        data["Fee " + (i + 1) + " Value"] = f.value || 0;
        data["Fee " + (i + 1) + " Unit"] = f.unit || "₹";
      });
      Sync.call({ action: "saveSettings", sheet: "Business Setting", data: data });
    };

    /* ---------- 2. New Sync helpers (settings push/pull, next-ID, image upload) ---------- */
    Sync.pushSettings = function (sheetName, fieldMap, jsObj) {
      if (!Sync.getUrl()) return;
      const data = {};
      Object.keys(fieldMap).forEach(k => { if (jsObj[k] !== undefined) data[fieldMap[k]] = jsObj[k]; });
      Sync.call({ action: "saveSettings", sheet: sheetName, data });
    };

    Sync.getNextId = async function (sheet, column) {
      if (!Sync.getUrl()) return null;
      try {
        const url = Sync.getUrl() + "?action=getNextId&sheet=" + encodeURIComponent(sheet) + "&column=" + encodeURIComponent(column);
        const res = await fetch(url);
        const data = await res.json();
        return (data && data.success) ? data.nextId : null;
      } catch (e) { return null; }
    };

    Sync.uploadImage = function (base64, fileName, mimeType, targetSheet, targetColumn, key, keyValue, folderLink) {
      if (!Sync.getUrl()) return Promise.resolve(null);
      return Sync.call({
        action: "uploadImage", base64, fileName, mimeType,
        targetSheet: targetSheet || null, targetColumn: targetColumn || null,
        key: key || null, keyValue: (keyValue === undefined ? null : keyValue),
        folderLink: folderLink || null
      }).then(function (r) {
        if (r.ok && r.data && r.data.success && r.data.url) return r.data.url;
        console.warn("Sync.uploadImage failed", r);
        return null;
      }).catch(function (e) { console.warn("Sync.uploadImage error", e); return null; });
    };

    // Full-detail variant — returns {url, fileId, sheetUpdated, customerId} so
    // callers (like customer DP upload) can confirm the Sheet write actually
    // happened, instead of assuming success just because Drive got the file.
    Sync.uploadImageFull = function (base64, fileName, mimeType, targetSheet, targetColumn, key, keyValue, folderLink) {
      if (!Sync.getUrl()) return Promise.resolve(null);
      return Sync.call({
        action: "uploadImage", base64, fileName, mimeType,
        targetSheet: targetSheet || null, targetColumn: targetColumn || null,
        key: key || null, keyValue: (keyValue === undefined ? null : keyValue),
        folderLink: folderLink || null
      }).then(function (r) {
        if (r.ok && r.data && r.data.success && r.data.url) {
          return { url: r.data.url, fileId: r.data.fileId, sheetUpdated: !!r.data.sheetUpdated, customerId: r.data.customerId };
        }
        console.warn("Sync.uploadImageFull failed", r);
        return { url: null, error: (r.data && r.data.error) || "Upload failed" };
      }).catch(function (e) { console.warn("Sync.uploadImageFull error", e); return { url: null, error: String(e) }; });
    };



    /* ---------------------------------------------------------------
       PhotoUpload — customer photo select hote hi seedha backend ke
       FIXED Drive folder (CUSTOMER_PHOTO_FOLDER_ID) me upload karta hai.
       Koi folder-picker screen beech me nahi aati — isliye Add/Edit
       Customer form kabhi overwrite nahi hota aur upload turant hota hai.
    --------------------------------------------------------------- */
    const PhotoUpload = (() => {
      async function choose(base64, mimeType, nameHint, previewElId, onDone, meta) {
        const m = meta || {};
        if (!Sync.getUrl()) { if (onDone) onDone(base64); return; }
        if (m.key && (m.keyValue === undefined || m.keyValue === null || m.keyValue === "")) {
          U.toast("Customer ID missing — photo save skipped");
          if (onDone) onDone(base64);
          return;
        }
        const safeName = String(nameHint || "customer").replace(/[^a-zA-Z0-9]+/g, "_").slice(0, 40);
        const fileName = `customer_${safeName}_${Date.now()}.jpg`;
        const result = await Sync.uploadImageFull(base64, fileName, mimeType, m.targetSheet || null, m.targetColumn || null, m.key || null, m.keyValue || null, null);
        console.log("CUSTOMER PHOTO UPLOAD", { customerId: m.keyValue, fileId: result && result.fileId, url: result && result.url, sheetUpdated: result && result.sheetUpdated });
        if (result && result.url && result.sheetUpdated) {
          U.toast("Photo uploaded & saved to Sheet");
          if (previewElId) {
            const prev = document.getElementById(previewElId);
            if (prev) prev.innerHTML = `<img src="${U.escapeHtml(result.url)}" style="width:100%;height:100%;object-fit:cover;">`;
          }
          if (onDone) onDone(result.url);
        } else if (result && result.url && !result.sheetUpdated) {
          U.toast("Photo Drive me upload ho gayi, lekin Customer Sheet update nahi hui.");
          if (onDone) onDone(result.url);
        } else {
          U.toast("Upload fail hua, local photo use hogi");
          if (onDone) onDone(base64);
        }
      }
      return { choose };
    })();

    /* ---------- 3. Pull everything from the Sheet into local IndexedDB + Settings ---------- */
    Sync.pullAll = async function () {
      if (!Sync.getUrl()) return;
      try {
        const res = await fetch(Sync.getUrl() + "?action=getAll");
        const data = await res.json();
        if (!data || !data.success) return;
        const d = data.data;

        for (const row of (d["Categories"] || [])) {
          const id = parseInt(row["Category ID"]); if (!id) continue;
          await DB.put("categories", { id, name: row["Category Name"] });
        }
        for (const row of (d["Products"] || [])) {
          const id = parseInt(row["Product ID"]); if (!id) continue;
          const existing = await DB.get("items", id);
          await DB.put("items", Object.assign({}, existing, {
            id, name: row["Product Name"] || (existing ? existing.name : "") || "Unnamed Item",
            category: (row["Category"] !== undefined && row["Category"] !== "") ? row["Category"] : (existing ? existing.category : ""),
            barcode: (row["Barcode"] !== undefined && row["Barcode"] !== "") ? String(row["Barcode"]) : (existing ? existing.barcode : ""),
            sellPrice: parseFloat(row["Selling Price"]) || 0, buyPrice: parseFloat(row["Buying Price"]) || 0,
            unit: row["Unit"] || "pcs", stockQty: parseFloat(row["Opening Stock"]) || 0,
            lowStockThreshold: parseFloat(row["Low Stock Alert"]) || 0, expiryDate: row["Expiry Date"] || "",
            imageUrl: row["Image URL"] || "",
            mrp: (row["MRP"] !== undefined && row["MRP"] !== "") ? (parseFloat(row["MRP"]) || 0) : (existing ? (existing.mrp || 0) : 0)
          }));
        }
        for (const row of (d["Customers"] || [])) {
          const id = parseInt(row["Customer ID"]); if (!id) continue;
          const existing = await DB.get("customers", id);
          await DB.put("customers", Object.assign({}, existing, {
            id, name: row["Name"], mobile: row["Mobile"], gender: row["Gender"],
            dob: row["DOB"], address: row["Address"], photo: row["Photo"] || (existing ? existing.photo : "")
          }));
        }
        if ((d["Bills"] || []).length) {
          const localBills = await DB.all("bills");
          const byLabel = {}; localBills.forEach(b => { byLabel[b.idLabel] = b; });
          for (const row of d["Bills"]) {
            const label = row["Bill No."];
            if (!label) continue;
            const existing = byLabel[label];
            if (existing) {
              // Bill pehle se local me hai — jo naya change ho sakta hai
              // wo sirf Status/Refunded Amount hai (Return doosre device
              // pe hone se). Baaki data overwrite nahi karte.
              if (row["Status"] && row["Status"] !== existing.status) {
                existing.status = row["Status"];
                existing.refundedAmount = parseFloat(row["Refunded Amount"]) || existing.refundedAmount || 0;
                await DB.put("bills", existing);
              }
              continue;
            }
            await DB.put("bills", {
              idLabel: label, date: row["Date & Time"], customerName: row["Customer Name"],
              customerMobile: row["Customer Mobile"], items: [], subtotal: parseFloat(row["Subtotal"]) || 0,
              discount: parseFloat(row["Discount"]) || 0, tax: parseFloat(row["Tax"]) || 0,
              additionalFee: parseFloat(row["Additional Fee"]) || 0, total: parseFloat(row["Total"]) || 0,
              paymentMode: row["Payment Mode"], cashGiven: parseFloat(row["Cash Given"]) || 0,
              changeReturned: parseFloat(row["Change Returned"]) || 0, status: row["Status"] || "completed",
              refundedAmount: parseFloat(row["Refunded Amount"]) || 0
            });
          }
        }
        if ((d["Income & Expenses"] || []).length) {
          const localTx = await DB.all("transactions");
          const have = new Set(localTx.map(t => t.date));
          for (const row of d["Income & Expenses"]) {
            if (!row["Date"] || have.has(row["Date"])) continue;
            await DB.put("transactions", { date: row["Date"], type: row["Type"], label: row["Label"], amount: parseFloat(row["Amount"]) || 0 });
          }
        }
        // ---- NAYA: pehle ye 5 sheets kabhi pull hi nahi hoti thi ----
        for (const row of (d["Suppliers"] || [])) {
          const id = parseInt(row["Supplier ID"]); if (!id) continue;
          const existing = await DB.get("suppliers", id);
          await DB.put("suppliers", Object.assign({}, existing, {
            id, name: row["Name"], mobile: row["Mobile"], location: row["Location"]
          }));
        }
        if ((d["Purchases"] || []).length) {
          const localPurchases = await DB.all("purchases");
          const have = new Set(localPurchases.map(p => p.idLabel));
          for (const row of d["Purchases"]) {
            const label = row["Purchase No."];
            if (!label || have.has(label)) continue;
            await DB.put("purchases", {
              idLabel: label, date: row["Date & Time"], supplierName: row["Supplier Name"],
              supplierMobile: row["Supplier Mobile"], items: [], total: parseFloat(row["Total"]) || 0
            });
          }
        }
        if ((d["Returns"] || []).length) {
          const localReturns = await DB.all("returns");
          const have = new Set(localReturns.map(r => r.returnLabel));
          for (const row of d["Returns"]) {
            const label = row["Return No."];
            if (!label || have.has(label)) continue;
            await DB.put("returns", {
              returnLabel: label, billIdLabel: row["Bill No."], date: row["Date & Time"],
              items: [], refundAmount: parseFloat(row["Refund Amount"]) || 0, type: row["Type"] || ""
            });
          }
        }
        if ((d["Revenue & Expenses"] || []).length) {
          const localRE = await DB.all("revenueExpense");
          const have = new Set(localRE.map(r => r.date + "|" + r.title + "|" + r.amount));
          for (const row of d["Revenue & Expenses"]) {
            const sig = row["Date"] + "|" + row["Title"] + "|" + row["Amount"];
            if (!row["Date"] || have.has(sig)) continue;
            await DB.put("revenueExpense", { date: row["Date"], type: row["Type"], title: row["Title"], amount: parseFloat(row["Amount"]) || 0, mode: row["Mode"] || "" });
          }
        }
        if ((d["Used Items"] || []).length) {
          const localUsed = await DB.all("usedItems");
          const have = new Set(localUsed.map(u => u.date + "|" + u.itemName + "|" + u.qty));
          for (const row of d["Used Items"]) {
            const sig = row["Date"] + "|" + row["Item"] + "|" + row["Qty"];
            if (!row["Date"] || have.has(sig)) continue;
            await DB.put("usedItems", { date: row["Date"], itemId: null, itemName: row["Item"], qty: parseFloat(row["Qty"]) || 0, unit: row["Unit"] || "", cost: parseFloat(row["Cost Price"]) || 0, total: parseFloat(row["Total"]) || 0 });
          }
        }
        if ((d["Saved Sales"] || []).length) {
          for (const row of d["Saved Sales"]) {
            const id = parseInt(row["Saved ID"]); if (!id) continue;
            const existing = await DB.get("savedSales", id);
            if (existing) continue;
            let cart = {}, customer = null;
            try {
              const parsed = JSON.parse(row["Cart JSON"] || "{}");
              cart = parsed.cart || {}; customer = parsed.customer || null;
            } catch (e) { }
            await DB.put("savedSales", { id, customer, cart, date: row["Date & Time"] });
          }
        }
        const bs = d["Business Setting"] || {}, rs = d["Receipt Setting"] || {};
        const patch = {};
        Object.keys(RECEIPT_FIELD_MAP).forEach(k => {
          const v = rs[RECEIPT_FIELD_MAP[k]];
          if (v === undefined || v === "") return;
          const isBoolKey = k.startsWith("show");
          patch[k] = isBoolKey ? (v === true || v === "TRUE" || v === "true") : v;
        });
        if (bs["Bill ID Prefix"]) patch.idPrefix = bs["Bill ID Prefix"];
        if (bs["Round Off"] !== undefined && bs["Round Off"] !== "") patch.roundOff = (bs["Round Off"] === true || bs["Round Off"] === "TRUE");
        if (bs["Sound Effects"] !== undefined && bs["Sound Effects"] !== "") patch.soundOn = (bs["Sound Effects"] === true || bs["Sound Effects"] === "TRUE");
        // Tax / Discount / Fee / Payment Mode — dynamic groups
        const taxes = []; for (let i = 1; bs["Tax " + i + " Name"] !== undefined; i++) { if (bs["Tax " + i + " Name"]) taxes.push({ name: bs["Tax " + i + " Name"], pct: parseFloat(bs["Tax " + i + " Value"]) || 0 }); }
        if (taxes.length) patch.taxes = taxes;
        const discounts = []; for (let i = 1; bs["Discount " + i + " Name"] !== undefined; i++) { if (bs["Discount " + i + " Name"]) discounts.push({ name: bs["Discount " + i + " Name"], value: parseFloat(bs["Discount " + i + " Value"]) || 0, unit: bs["Discount " + i + " Unit"] || "%" }); }
        if (discounts.length) patch.discounts = discounts;
        const fees = []; for (let i = 1; bs["Fee " + i + " Name"] !== undefined; i++) { if (bs["Fee " + i + " Name"]) fees.push({ name: bs["Fee " + i + " Name"], value: parseFloat(bs["Fee " + i + " Value"]) || 0, unit: bs["Fee " + i + " Unit"] || "₹" }); }
        if (fees.length) patch.fees = fees;
        const payModes = []; for (let i = 1; bs["Payment Mode " + i] !== undefined; i++) { if (bs["Payment Mode " + i]) payModes.push(bs["Payment Mode " + i]); }
        if (payModes.length) patch.paymentModes = payModes;
        if (Object.keys(patch).length) Settings.set(patch);
      } catch (e) { console.warn("Sync.pullAll failed", e); }
    };

    /* ---------- 4. Pull on load: right after boot, and right after login ---------- */
    (async function patchInit() {
      await DB.open();
      if (Auth.isLoggedIn() && Sync.getUrl()) {
        await Sync.pullAll();
        if (document.getElementById("app").style.display === "flex" || Router.current) {
          Router.go(Router.current || "counter");
        }
      }
    })();

    if (typeof proceedAfterLogin === "function") {
      const _origProceedAfterLogin = proceedAfterLogin;
      proceedAfterLogin = async function () {
        if (Sync.getUrl()) { await Sync.pullAll(); }
        _origProceedAfterLogin();
      };
    }

    /* ---------- 5. Product / Category / Customer ID from the Sheet, not local counter ---------- */
    Items.save = async function (id) {
      const name = document.getElementById("fName").value.trim();
      if (!name) { SFX.error(); U.toast("Item name daliye"); return; }
      const obj = {
        name, category: document.getElementById("fCategory").value,
        imageUrl: document.getElementById("fImage").value.trim(),
        barcode: document.getElementById("fBarcode").value.trim(),
        sellPrice: parseFloat(document.getElementById("fSell").value) || 0,
        buyPrice: parseFloat(document.getElementById("fBuy").value) || 0,
        mrp: parseFloat(document.getElementById("fMrp").value) || 0, nameHi: ((document.getElementById("fNameHi") || {}).value || "").trim(),
        unit: document.getElementById("fUnit").value,
        stockQty: parseFloat(document.getElementById("fStock").value) || 0,
        lowStockThreshold: parseFloat(document.getElementById("fLow").value) || 0,
        expiryDate: document.getElementById("fExpiry").value
      };
      if (id) { obj.id = id; }
      else { const nextId = await Sync.getNextId("Products", "Product ID"); if (nextId) obj.id = nextId; }
      const savedId = await DB.put("items", obj);
      const pid = obj.id || savedId;
      await Sync.push("Products", "Product ID", {
        "Product ID": pid, "Product Name": obj.name, "Category": obj.category,
        "Barcode": obj.barcode, "Selling Price": obj.sellPrice, "Buying Price": obj.buyPrice, "MRP": obj.mrp,
        "Unit": obj.unit, "Opening Stock": obj.stockQty, "Low Stock Alert": obj.lowStockThreshold,
        "Expiry Date": obj.expiryDate, "Image URL": obj.imageUrl
      });
      SFX.success(); UI.close(); U.toast("Item saved"); Items.render();
    };

    Items.saveCategory = async function () {
      const name = document.getElementById("fCatName").value.trim();
      if (!name) return;
      const nextId = await Sync.getNextId("Categories", "Category ID");
      const cid = await DB.put("categories", nextId ? { id: nextId, name } : { name });
      Sync.push("Categories", "Category ID", { "Category ID": nextId || cid, "Category Name": name });
      UI.close(); U.toast("Category added"); Items.render();
    };



    Counter.saveAddCustomer = async function () {
      const name = document.getElementById("cName").value.trim();
      if (!name) { U.toast("Naam daliye"); return; }
      const photoUrl = document.getElementById("cPhotoUrl")?.value.trim() || "";
      const nextId = await Sync.getNextId("Customers", "Customer ID");
      const obj = { name, mobile: document.getElementById("cMobile").value.trim(), gender: document.getElementById("cGender").value, dob: document.getElementById("cDob").value, address: document.getElementById("cAddr").value.trim(), photo: photoUrl };
      if (nextId) obj.id = nextId;
      const id = await DB.put("customers", obj);
      const r = await Sync.push("Customers", "Customer ID", {
        "Customer ID": nextId || id, "Name": obj.name, "Mobile": obj.mobile, "Gender": obj.gender,
        "DOB": obj.dob, "Address": obj.address, "Photo": obj.photo || ""
      });
      if (!r || !r.ok || (r.data && r.data.success === false)) {
        console.error("CUSTOMER SHEET SYNC FAILED", r);
        U.toast("Customer save hua, lekin Google Sheet sync nahi hua");
      }
      UI.close(); Counter.pickCustomer(nextId || id);
    };

    More.saveCustomer = async function () {
      const name = document.getElementById("mcName").value.trim();
      if (!name) return;
      const idVal = document.getElementById("mcId").value;
      const photoUrl = document.getElementById("mcPhotoUrl")?.value.trim() || "";
      const obj = { name, mobile: document.getElementById("mcMobile").value.trim(), gender: document.getElementById("mcGender").value, dob: document.getElementById("mcDob").value, address: document.getElementById("mcAddr").value.trim(), photo: photoUrl };
      let idToUse = idVal ? Number(idVal) : null;
      if (!idToUse) { const nextId = await Sync.getNextId("Customers", "Customer ID"); if (nextId) idToUse = nextId; }
      if (idToUse) obj.id = idToUse;
      const savedId = await DB.put("customers", obj);
      const r = await Sync.push("Customers", "Customer ID", {
        "Customer ID": idToUse || savedId, "Name": obj.name, "Mobile": obj.mobile, "Gender": obj.gender,
        "DOB": obj.dob, "Address": obj.address, "Photo": obj.photo || ""
      });
      if (!r || !r.ok || (r.data && r.data.success === false)) {
        console.error("CUSTOMER SHEET SYNC FAILED", r);
        U.toast("Customer save hua, lekin Google Sheet sync nahi hua");
      }
      SFX.success(); U.toast(idVal ? "Customer updated" : "Customer added"); More.customers();
    };

    /* ---------- 6. Receipt Setting -> Receipt Setting sheet only; Business Setting untouched ---------- */
    More.saveReceiptSettings = function () {
      const patch = {
        businessName: document.getElementById("rsBiz").value.trim(),
        mobile: document.getElementById("rsMobile").value.trim(),
        address: document.getElementById("rsAddr").value.trim(),
        gstNumber: document.getElementById("rsGst").value.trim(),
        cashierName: document.getElementById("rsCashier").value.trim(),
        receiptTitle: document.getElementById("rsTitle").value.trim(),
        thankYouNote: document.getElementById("rsThanks").value.trim(),
        orderBy: document.getElementById("rsOrderBy").value
      };
      Settings.set(patch);
      Sync.pushSettings("Receipt Setting", RECEIPT_FIELD_MAP, Settings.get());
      U.toast("Saved"); UI.close();
    };

    More.toggleSetting = function (key, el) {
      const s = Settings.get();
      Settings.set({ [key]: !s[key] });
      el.classList.toggle("on");
      if (RECEIPT_FIELD_MAP[key]) {
        Sync.pushSettings("Receipt Setting", { [key]: RECEIPT_FIELD_MAP[key] }, Settings.get());
      } else if (key === "roundOff") {
        Sync.pushBusinessSettings();
      }
    };

    const _origToggleSound = More.toggleSound;
    More.toggleSound = function (el) {
      _origToggleSound(el);
      Sync.pushBusinessSettings();
    };

    More.handleLogoUpload = function (ev) {
      const file = ev.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        Settings.set({ logo: base64 }); // instant local preview
        U.toast("Uploading logo...");
        const url = await Sync.uploadImage(base64, "logo_" + Date.now() + ".png", file.type || "image/png", "Receipt Setting", "Store Logo URL");
        if (url) { Settings.set({ logo: url }); U.toast("Logo saved"); await Printer.setLocalLogo(base64, url); }
        Printer.prepareLogo();
        Sync.pushSettings("Receipt Setting", RECEIPT_FIELD_MAP, Settings.get());
        More.receiptSettings();
      };
      reader.readAsDataURL(file);
    };

    /* ---------- 7. Item image: upload straight from device instead of only a manual link ---------- */
    Items.uploadItemImage = async function (ev, existingId) {
      const file = ev.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        U.toast("Uploading image...");
        const url = await Sync.uploadImage(reader.result, "product_" + Date.now() + ".jpg", file.type || "image/jpeg",
          existingId ? "Products" : null, existingId ? "Image URL" : null, existingId ? "Product ID" : null, existingId || null);
        const finalUrl = url || reader.result;
        const fImage = document.getElementById("fImage");
        if (fImage) { fImage.value = finalUrl; Items.previewImage(); }
      };
      reader.readAsDataURL(file);
    };

    /* Wire the upload button into the item form: inject a file input +
       button right after the sheet renders (avoids re-typing the whole
       large openItemForm template). */
    const _origOpenItemForm = Items.openItemForm;
    Items.openItemForm = async function (existing) {
      await _origOpenItemForm(existing);
      const wrap = document.getElementById("fImage")?.parentElement;
      if (wrap && !document.getElementById("fImageUploadBtn")) {
        const input = document.createElement("input");
        input.type = "file"; input.accept = "image/*"; input.id = "fImageUploadFile"; input.style.display = "none";
        input.onchange = (ev) => Items.uploadItemImage(ev, existing ? existing.id : null);
        const btn = document.createElement("button");
        btn.className = "icon-btn dark"; btn.id = "fImageUploadBtn"; btn.style.cssText = "width:44px;flex-shrink:0;margin-top:6px;";
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>`;
        btn.onclick = () => input.click();
        wrap.appendChild(input); wrap.appendChild(btn);
      }
    };

    /* ---------- 8. Cross-browser camera scanner (works on iPhone Safari too) ----------
       FIX: pehle Scanner.scan() apna preview app ke shared #overlay/#sheet element me
       hi UI.sheet() se render karta tha. Lekin puri app me sirf EK hi #sheet element hai —
       to jab Item Add/Edit form (ya kisi bhi sheet) ke andar se scan button dabaya jata,
       scanner us shared #sheet ka poora innerHTML overwrite kar deta, aur barcode read
       hote hi UI.close() poora overlay hi hide kar deta — jisse peeche khula hua form
       (uske fields samet) hamesha ke liye gayab ho jata ("cut/back ho jana"). Isiliye
       barcode number field me kabhi bharta hi nahi tha.
       Fix: scanner ab apna khud ka independent full-screen overlay banata hai (document.body
       me alag se), jo app ke #overlay/#sheet ko bilkul touch nahi karta. Scan hote hi sirf
       yeh apna overlay hata deta hai — jo bhi form/sheet peeche khula tha wo bilkul waisa hi
       safe rehta hai, aur scanned number turant sahi field me apne aap bhar jata hai. ---------- */
    Scanner.getPreferredMode = function () {
      try { return localStorage.getItem("rm_scan_mode") || "hardware"; } catch (e) { return "hardware"; }
    };
    Scanner.setPreferredMode = function (m) {
      try { localStorage.setItem("rm_scan_mode", m); } catch (e) { }
    };
    const SCAN_MODE_ICON = {
      camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
      hardware: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M6 8v8M9 8v8M12 8v8M15 8v8M18 8v8" stroke-linecap="round"/></svg>`
    };
    Scanner.scan = async function scan() {
      if (typeof Html5Qrcode === "undefined") {
        const manual = prompt("Scanner library load nahi hui. Barcode manually daalein:");
        return manual ? manual.trim() : null;
      }
      return new Promise((resolve) => {
        let mode = Scanner.getPreferredMode();
        let qr = null, done = false, switching = false;
        const ov = document.createElement("div");
        ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(6,32,21,.85);display:flex;align-items:center;justify-content:center;padding:16px;";
        ov.innerHTML = `<div style="background:#fff;border-radius:16px;max-width:420px;width:100%;overflow:hidden;">
          <div class="sheet-head"><h3>Scan Barcode</h3>
            <div style="display:flex;align-items:center;gap:6px;">
              <div class="scan-mode-switch light" id="scanModal2Switch">
                <button class="scan-mode-btn" id="scanModal2CamBtn" title="Camera">${SCAN_MODE_ICON.camera}</button>
                <button class="scan-mode-btn" id="scanModal2HwBtn" title="Barcode Scanner">${SCAN_MODE_ICON.hardware}</button>
              </div>
              <button class="icon-btn dark" id="scanFlip2" title="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
              <button class="icon-btn dark" id="scanClose2">✕</button>
            </div>
          </div>
          <div class="sheet-body" id="scanModal2Body"></div>
        </div>`;
        document.body.appendChild(ov);

        const cleanup = async () => {
          if (done) return; done = true;
          try { if (qr) await qr.stop(); } catch (e) { }
          HWScan.detach();
          ov.remove();
        };
        ov.querySelector("#scanClose2").onclick = async () => { await cleanup(); resolve(null); };

        const startCam = () => {
          Scanner._applyMirror("qrReader2");
          qr.start(
            { facingMode: Scanner._facingMode },
            { fps: 10, qrbox: { width: 240, height: 160 } },
            async (decodedText) => { if (done || switching) return; await cleanup(); resolve(decodedText ? decodedText.trim() : decodedText); },
            () => { }
          ).catch(() => { if (!switching) { U.toast("Camera access denied ya support nahi hai"); cleanup(); resolve(null); } });
        };
        function renderCamBody() {
          HWScan.detach();
          const flip = ov.querySelector("#scanFlip2");
          if (flip) flip.style.display = "";
          document.getElementById("scanModal2Body").innerHTML = `<div id="qrReader2" style="width:100%;border-radius:12px;overflow:hidden;"></div>`;
          qr = new Html5Qrcode("qrReader2");
          startCam();
        }
        function renderHwBody() {
          if (qr) { try { qr.stop(); } catch (e) { } qr = null; }
          const flip = ov.querySelector("#scanFlip2");
          if (flip) flip.style.display = "none";
          const scanner = Settings.get().barcodeScanner;
          const linked = !!scanner;
          document.getElementById("scanModal2Body").innerHTML = `
        <div class="hw-scan-stage" style="height:220px;min-height:0;max-height:none;border-radius:12px;">
          <div class="hw-scan-panel">
            <div class="hw-scan-icon ${linked ? 'linked' : ''}">${SCAN_MODE_ICON.hardware}</div>
            <div class="hw-scan-title">${linked ? "Barcode Scanner Ready" : "Use your Barcode Scanner"}</div>
            <div class="hw-scan-sub">${linked ? `Linked: ${U.escapeHtml(scanner.name)}` : "Scan any barcode to link"}</div>
            <input id="scanModal2HwInput" class="hw-scan-input" autocomplete="off" inputmode="none">
          </div>
        </div>`;
          const el = document.getElementById("scanModal2HwInput");
          HWScan.attach(el, async (code) => {
            HWScan.markLinkedFromScan();
            if (done) return;
            await cleanup();
            resolve(code);
          });
        }
        function setMode(m) {
          mode = m;
          Scanner.setPreferredMode(m);
          const camBtn = document.getElementById("scanModal2CamBtn");
          const hwBtn = document.getElementById("scanModal2HwBtn");
          if (camBtn) camBtn.classList.toggle("on", m === "camera");
          if (hwBtn) hwBtn.classList.toggle("on", m === "hardware");
          if (m === "camera") renderCamBody(); else renderHwBody();
        }
        ov.querySelector("#scanModal2CamBtn").onclick = () => setMode("camera");
        ov.querySelector("#scanModal2HwBtn").onclick = () => setMode("hardware");
        ov.querySelector("#scanFlip2").onclick = async () => {
          if (done || switching || mode !== "camera") return;
          switching = true;
          try { await qr.stop(); } catch (e) { }
          try { qr.clear(); } catch (e) { }
          Scanner._facingMode = Scanner._facingMode === "environment" ? "user" : "environment";
          qr = new Html5Qrcode("qrReader2");
          switching = false;
          startCam();
        };
        setMode(mode);
      });
    };

    /* ---------- Continuous scanner (camera stays open, fires onDetect
       repeatedly) — used by Counter's "Scan Items" live-scan page so the
       user doesn't have to reopen the camera for every item. Same-code
       repeats within COOLDOWN ms are ignored so one barcode held in
       frame for a moment doesn't get added multiple times; showing the
       same barcode again after the cooldown adds it again on purpose. */
    Scanner._continuous = null;
    Scanner._continuousMeta = null;
    // Default camera: front ("user"). Users can flip to the back
    // ("environment") camera anytime using the switch-camera button.
    if (typeof Scanner._facingMode === "undefined") Scanner._facingMode = "user";
    // Mirrors the video horizontally only when the front camera is active,
    // so the feed matches real-world left/right movement (see CSS above).
    Scanner._applyMirror = function (containerId) {
      const el = document.getElementById(containerId);
      if (!el) return;
      el.classList.toggle("mirror-cam", Scanner._facingMode === "user");
    };
    Scanner.startContinuous = function (containerId, opts) {
      const onDetect = (opts && opts.onDetect) || function () { };
      if (typeof Html5Qrcode === "undefined") {
        U.toast("Scanner library load nahi hui");
        return null;
      }
      Scanner.stopContinuous();
      const qr = new Html5Qrcode(containerId);
      let lastCode = null, lastTime = 0;
      const COOLDOWN = 1500;
      Scanner._continuous = qr;
      Scanner._continuousMeta = { containerId, opts };
      Scanner._applyMirror(containerId);
      qr.start(
        { facingMode: Scanner._facingMode },
        { fps: 10, qrbox: { width: 240, height: 160 } },
        (decodedText) => {
          const code = decodedText ? decodedText.trim() : decodedText;
          if (!code) return;
          const now = Date.now();
          if (code === lastCode && (now - lastTime) < COOLDOWN) return;
          lastCode = code; lastTime = now;
          onDetect(code);
        },
        () => { }
      ).catch(() => { U.toast("Camera access denied ya support nahi hai"); Scanner._continuous = null; });
      return qr;
    };
    Scanner.stopContinuous = async function () {
      const qr = Scanner._continuous;
      if (!qr) return;
      Scanner._continuous = null;
      try { await qr.stop(); } catch (e) { }
      try { qr.clear(); } catch (e) { }
    };
    // Flips front/back camera for whichever continuous (live) scan page
    // is currently open, restarting the stream in place.
    Scanner.switchCamera = async function () {
      const meta = Scanner._continuousMeta;
      if (!Scanner._continuous || !meta) return;
      Scanner._facingMode = Scanner._facingMode === "environment" ? "user" : "environment";
      await Scanner.stopContinuous();
      Scanner.startContinuous(meta.containerId, meta.opts);
    };

  </script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(console.error);
    });
  }
</script>
