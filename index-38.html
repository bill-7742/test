    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--paper);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    input,
    select,
    textarea {
      outline: none;
    }

    .num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    /* ---- premium micro-interactions (surgical, additive only) ---- */
    .btn,
    .icon-btn,
    .navbtn,
    .chip,
    .tab,
    .item-card,
    .more-box,
    .fab,
    .sort-btn,
    .denom-chip,
    .switch {
      transition: transform .16s var(--ease-premium), background-color .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
    }

    .btn:active,
    .icon-btn:active,
    .fab:active,
    .sort-btn:active,
    .chip:active,
    .tab:active,
    .denom-chip:active {
      transform: scale(.96);
    }

    .item-card:active,
    .more-box:active {
      transform: scale(.97);
    }

    .navbtn:active svg {
      transform: scale(.88);
    }

    .navbtn svg {
      transition: transform .18s var(--ease-premium), stroke .18s ease;
    }

    .list-row {
      transition: background-color .15s ease;
    }

    .list-row:active {
      background: var(--paper);
    }

    /* ---- Admin-Panel-style hover/press micro-interactions (desktop pointer + touch) ---- */
    .icon-btn svg,
    .btn svg,
    .more-box svg,
    .stat-bar svg {
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), stroke .2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, .22);
      transform: translateY(-2px);
    }

    .icon-btn.dark:hover {
      background: rgba(11, 51, 36, .12);
    }

    .icon-btn:hover svg {
      transform: scale(1.14) rotate(-4deg);
    }

    .btn:hover svg {
      transform: scale(1.14);
    }

    .more-box {
      transition: transform .2s var(--ease-premium), border-color .2s ease, box-shadow .2s ease;
      border: 1.5px solid transparent;
    }

    .more-box:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: var(--shadow-lg);
    }

    .more-box:hover svg {
      transform: scale(1.12) rotate(-6deg);
    }

    .stat-bar {
      transition: transform .2s var(--ease-premium), border-color .2s ease, box-shadow .2s ease;
      border: 1.5px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .stat-bar::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--gold);
      opacity: .08;
      transform: translate(18px, -18px);
      pointer-events: none;
    }

    .stat-bar:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: var(--shadow-lg);
    }

    .stat-bar:hover svg {
      transform: scale(1.12) rotate(-6deg);
      stroke: var(--gold-dark);
    }

    .tab,
    .chip {
      transition: transform .18s var(--ease-premium), background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .tab:hover,
    .chip:hover {
      border-color: var(--gold);
    }

    .pill {
      transition: transform .18s var(--ease-premium);
    }

    .item-card {
      transition: transform .2s var(--ease-premium), box-shadow .2s ease;
    }

    .item-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .sheet-head .icon-btn {
      transition: transform .2s var(--ease-premium), color .2s ease, background-color .18s ease;
    }

    .sheet-head .icon-btn:hover {
      color: var(--danger);
      background: var(--danger-bg);
      transform: rotate(90deg) scale(1.08);
    }

    /* number pop when the cart/amount changes */
    @keyframes numPop {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.12);
      }

      100% {
        transform: scale(1);
      }
    }

    .num-pop {
      animation: numPop .28s var(--ease-premium);
    }

    /* item card qty badge pop-in */
    @keyframes badgePop {
      0% {
        transform: scale(0);
      }

      60% {
        transform: scale(1.22);
      }

      100% {
        transform: scale(1);
      }
    }

    .item-qty-badge {
      animation: badgePop .28s var(--ease-premium);
    }

    /* success ring pulse for check icons on completed rows */
    @keyframes ringPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 184, 148, .35);
      }

      100% {
        box-shadow: 0 0 0 10px rgba(0, 184, 148, 0);
      }
    }

    .ring-pulse {
      animation: ringPulse .6s ease-out;
    }

    /* ============================================================ APP SHELL */
    #app {
      display: none;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .page.active {
      display: flex;
      animation: pageIn .3s var(--ease-premium);
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll {
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .topbar {
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
      box-shadow: 0 4px 16px rgba(6, 32, 21, .18);
    }

    .topbar h1 {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .2px;
    }

    .topbar .sub {
      font-size: 11px;
      opacity: .75;
      margin-top: 1px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .12);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, .22);
    }

    .icon-btn.dark {
      background: rgba(11, 51, 36, .06);
      color: #0B0B0C;
    }

    .icon-btn.dark:active {
      background: rgba(11, 51, 36, .12);
    }

    /* Bottom nav */
    .bottomnav {
      display: flex;
      background: #fff;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
      z-index: 5;
    }

    .navbtn {
      flex: 1;
      border: none;
      background: none;
      padding: 8px 2px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 600;
    }

    .navbtn svg {
      width: 21px;
      height: 21px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.9;
    }

    .navbtn.on {
      color: #0B0B0C;
    }

    .navbtn.on svg {
      stroke: var(--gold);
      fill: rgba(255, 107, 43, .12);
    }

    /* Cards / generic */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .section {
      padding: 12px 14px;
    }

    .hint {
      color: var(--text-muted);
      font-size: 12.5px;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 10px 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.gold {
      background: #FFE8DA;
      color: var(--gold-dark);
    }

    .pill.green {
      background: var(--success-bg);
      color: var(--success);
    }

    .pill.red {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .pill.green::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--success);
      animation: dotBlink 1.4s ease-in-out infinite;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-weight: 700;
      font-size: 14.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.primary {
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
      color: #fff;
    }

    .btn.primary:active {
      background-color: var(--ink-2);
    }

    .btn.gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .btn.gold::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .4) 45%, transparent 65%);
      background-size: 220% 100%;
      animation: shine 3.2s ease-in-out infinite;
    }

    .btn.ghost {
      background: #fff;
      color: var(--text);
      border: 1.5px solid var(--ink);
      font-weight: 800;
    }

    .btn.ghost:active {
      background: rgba(15, 90, 62, .08);
    }

    .btn.danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn.block {
      width: 100%;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(1, 45, 26, 0);
      backdrop-filter: blur(0px);
      transition: background-color .22s var(--ease-premium), backdrop-filter .22s var(--ease-premium);
    }

    .confirm-overlay.show {
      background: rgba(1, 45, 26, .45);
      backdrop-filter: blur(2px);
    }

    .confirm-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px 20px 18px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(1, 45, 26, .28);
      transform: translateY(14px) scale(.96);
      opacity: 0;
      transition: transform .24s var(--ease-premium), opacity .24s var(--ease-premium);
    }

    .confirm-overlay.show .confirm-card {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .confirm-msg {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      margin: 4px 0 18px;
      line-height: 1.45;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    .btn:disabled {
      opacity: .45;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .input,
    .select {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      background: #fff;
    }

    .input:focus,
    .select:focus {
      border-color: var(--gold);
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0 0 5px 2px;
      display: block;
    }

    .field {
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row>* {
      flex: 1;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty svg {
      width: 44px;
      height: 44px;
      stroke: #C7CCD8;
      margin-bottom: 10px;
    }

    /* Modal / Sheet */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 32, 21, .55);
      display: none;
      align-items: flex-end;
      z-index: 50;
      animation: overlayIn .2s ease;
    }

    .overlay.show {
      display: flex;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .sheet {
      background: #fff;
      width: 100%;
      max-height: 90%;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      animation: up .28s var(--ease-premium);
      box-shadow: 0 -10px 40px rgba(6, 32, 21, .2);
    }

    @keyframes up {
      from {
        transform: translateY(24px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes dotBlink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .25;
      }
    }

    .profit-dot.blink {
      animation: dotBlink 1s ease-in-out infinite;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .sheet-body {
      overflow-y: auto;
      padding: 14px 16px;
    }

    .grabber {
      width: 36px;
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      margin: 8px auto 0;
    }

    .center-modal {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .center-modal .sheet {
      border-radius: 18px;
      max-width: 380px;
      max-height: 85%;
    }

    /* Skeleton */
    .sk {
      background: linear-gradient(90deg, #EEF0F4 25%, #F6F7FA 37%, #EEF0F4 63%);
      background-size: 400% 100%;
      animation: skm 1.3s ease infinite;
      border-radius: 8px;
    }

    @keyframes skm {
      0% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0 50%;
      }
    }

    /* Item grid (counter) */
    .item-search {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .bills-search-bar {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-input-wrap .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      pointer-events: none;
    }

    .sort-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      padding: 0 12px;
      height: 42px;
      border-radius: var(--radius-sm);
      background: #fff;
      border: 1.5px solid var(--line);
      color: #0B0B0C;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .sort-btn svg {
      width: 15px;
      height: 15px;
      stroke: var(--gold-dark);
      flex-shrink: 0;
    }

    .sort-btn:active {
      background: var(--paper);
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      padding: 12px 14px 90px;
    }

    .item-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      border: 1.5px solid transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .item-card.added {
      border-color: var(--gold);
    }

    .item-thumb {
      height: 100px;
      background: #EEF1F6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #B7BDCB;
      font-size: 26px;
      font-weight: 800;
    }

    .item-body {
      padding: 8px 10px 10px;
    }

    .item-name {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
      height: 32px;
      overflow: hidden;
    }

    .item-price {
      font-size: 13.5px;
      font-weight: 800;
      color: #0B0B0C;
      margin-top: 3px;
    }

    .item-qty-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--gold);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    .stock-badge-oos {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    .stock-badge-oos span {
      background: #D32F2F;
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: .3px;
      padding: 6px 11px;
      border-radius: 7px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
      text-transform: uppercase;
    }

    .stock-badge-low {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #F0511A;
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 99px;
      letter-spacing: .3px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
    }

    .cart-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(6, 32, 21, .28);
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
      animation: cartIn .28s var(--ease-premium);
    }

    .cart-bar .amt {
      font-weight: 800;
      font-size: 15px;
    }

    .cart-bar .btn {
      padding: 10px 18px;
    }

    @keyframes cartIn {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .scan-live-video-wrap {
      position: relative;
      width: 100%;
      height: 36vh;
      min-height: 210px;
      max-height: 320px;
      flex-shrink: 0;
      background: #000;
      overflow: hidden;
    }

    .scan-live-video-wrap #contScanReader {
      width: 100%;
      height: 100%;
    }

    .scan-live-video-wrap #contScanReader video,
    .scan-live-video-wrap #contScanReader canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* html5-qrcode draws its own plain shaded-region border around the
       qrbox by default (inline-styled) — we hide just that border so our
       own premium reticle below is the only frame shown; the video feed
       itself is untouched. */
    .scan-live-video-wrap #contScanReader div[style*="border"] {
      border-color: transparent !important;
      box-shadow: none !important;
    }

    /* The raw front ("user") camera feed from getUserMedia is not
       mirrored, so an object moved to the person's left appears to
       enter from the right on screen — feels reversed. We flip it back
       just for the front camera so movement matches the real world;
       the back ("environment") camera is left untouched. */
    .mirror-cam video {
      transform: scaleX(-1);
    }

    .scan-live-video-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(1, 24, 13, .5) 76%, rgba(1, 24, 13, .82) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .scan-live-video-wrap::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: linear-gradient(to top, rgba(1, 24, 13, .8), transparent);
      z-index: 2;
      pointer-events: none;
    }

    .scan-live-frame {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 72%;
      height: 40%;
      z-index: 3;
      pointer-events: none;
    }

    .scan-live-corner {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 3px solid var(--gold-light);
      filter: drop-shadow(0 0 5px rgba(255, 107, 43, .6));
      transition: border-color .25s ease, filter .25s ease;
    }

    .scan-live-corner.tl {
      top: 0;
      left: 0;
      border-right: none;
      border-bottom: none;
      border-radius: 10px 0 0 0;
    }

    .scan-live-corner.tr {
      top: 0;
      right: 0;
      border-left: none;
      border-bottom: none;
      border-radius: 0 10px 0 0;
    }

    .scan-live-corner.bl {
      bottom: 0;
      left: 0;
      border-right: none;
      border-top: none;
      border-radius: 0 0 0 10px;
    }

    .scan-live-corner.br {
      bottom: 0;
      right: 0;
      border-left: none;
      border-top: none;
      border-radius: 0 0 10px 0;
    }

    .scan-live-frame.found .scan-live-corner {
      border-color: var(--success);
      filter: drop-shadow(0 0 7px rgba(0, 184, 148, .75));
    }

    .scan-live-frame.not-found .scan-live-corner {
      border-color: var(--danger);
      filter: drop-shadow(0 0 7px rgba(214, 48, 49, .75));
    }

    .scan-live-laser {
      position: absolute;
      left: 3%;
      right: 3%;
      height: 2px;
      top: 8%;
      background: linear-gradient(90deg, transparent, var(--gold-light) 18%, #fff 50%, var(--gold-light) 82%, transparent);
      box-shadow: 0 0 9px 1px rgba(255, 159, 67, .85);
      border-radius: 2px;
      animation: laserSweep 2.1s ease-in-out infinite;
    }

    .scan-live-frame.found .scan-live-laser,
    .scan-live-frame.not-found .scan-live-laser {
      animation-play-state: paused;
      opacity: 0;
    }

    @keyframes laserSweep {

      0%,
      100% {
        top: 8%;
        opacity: .9;
      }

      50% {
        top: 88%;
        opacity: .5;
      }
    }

    .scan-live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, .12);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      color: #fff;
      flex-shrink: 0;
    }

    .scan-live-badge .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff4d4d;
      animation: livePulse 1.6s ease-out infinite;
    }

    @keyframes livePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 77, 77, .55);
      }

      70% {
        box-shadow: 0 0 0 7px rgba(255, 77, 77, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 77, 77, 0);
      }
    }

    .scan-live-pill {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(1, 24, 13, .72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .14);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      max-width: 88%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
      transition: background .2s ease, border-color .2s ease;
    }

    .scan-live-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-light);
      flex-shrink: 0;
      box-shadow: 0 0 6px 1px rgba(255, 159, 67, .8);
    }

    .scan-live-pill.found {
      background: rgba(0, 184, 148, .24);
      border-color: rgba(0, 184, 148, .55);
    }

    .scan-live-pill.found .dot {
      background: var(--success);
      box-shadow: 0 0 6px 1px rgba(0, 184, 148, .8);
    }

    .scan-live-pill.not-found {
      background: rgba(214, 48, 49, .24);
      border-color: rgba(214, 48, 49, .55);
    }

    .scan-live-pill.not-found .dot {
      background: var(--danger);
      box-shadow: 0 0 6px 1px rgba(214, 48, 49, .8);
    }

    /* ---- Camera / Barcode Scanner mode switch (Scan Items topbar) ---- */
    .scan-mode-switch {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, .12);
      border-radius: 999px;
      padding: 3px;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .scan-mode-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .6);
      transition: background .18s var(--ease-premium), color .18s var(--ease-premium);
    }

    .scan-mode-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .scan-mode-btn.on {
      background: var(--gold);
      color: #fff;
    }

    /* Variant for use on light/white backgrounds (e.g. the one-shot
       "Scan Barcode" modal's sheet-head, vs the dark Scan Items topbar). */
    .scan-mode-switch.light {
      background: rgba(1, 45, 26, .08);
    }

    .scan-mode-switch.light .scan-mode-btn {
      color: var(--ink);
    }

    .scan-mode-switch.light .scan-mode-btn.on {
      color: #fff;
    }

    /* ---- Hardware barcode scanner stage (replaces camera preview) ---- */
    .hw-scan-stage {
      position: relative;
      width: 100%;
      height: 36vh;
      min-height: 210px;
      max-height: 320px;
      flex-shrink: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #16324f, #0d1b2a);
    }

    .hw-scan-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 0 26px;
    }

    .hw-scan-icon {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .09);
      color: var(--gold-light);
      margin-bottom: 4px;
      animation: hwScanPulse 2.2s ease-in-out infinite;
    }

    .hw-scan-icon svg {
      width: 28px;
      height: 28px;
    }

    .hw-scan-icon.linked {
      color: var(--success);
      background: rgba(0, 184, 148, .16);
      animation: hwScanPulseGreen 2.2s ease-in-out infinite;
    }

    @keyframes hwScanPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 159, 67, .35);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(255, 159, 67, 0);
      }
    }

    @keyframes hwScanPulseGreen {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 184, 148, .35);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(0, 184, 148, 0);
      }
    }

    .hw-scan-title {
      color: #fff;
      font-weight: 800;
      font-size: 14.5px;
    }

    .hw-scan-sub {
      color: rgba(255, 255, 255, .65);
      font-size: 12px;
    }

    .hw-scan-hint {
      color: rgba(255, 255, 255, .55);
      font-size: 11.5px;
      margin-top: 2px;
    }

    .hw-scan-input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      left: -9999px;
    }

    .scan-feed-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 10px;
    }

    .scan-feed-head .t {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: .2px;
    }

    .scan-feed-head .count {
      background: var(--success-bg);
      color: var(--success);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .scan-live-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 2px;
      border-bottom: 1px solid var(--line);
      border-radius: 8px;
      animation: scanRowIn .22s var(--ease-premium);
    }

    .scan-live-row:last-child {
      border-bottom: none;
    }

    .scan-live-row.new {
      animation: scanRowIn .28s var(--ease-premium), scanRowGlow 1.2s var(--ease-premium);
    }

    @keyframes scanRowGlow {
      0% {
        background: var(--success-bg);
      }

      100% {
        background: transparent;
      }
    }

    @keyframes scanRowIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Denomination chips */
    .denom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }

    .denom-chip {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 4px;
      text-align: center;
      font-weight: 800;
      position: relative;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .denom-chip:not(.img-chip)::before {
      content: "₹";
      font-size: 10px;
      opacity: .5;
      display: block;
    }

    .denom-chip.img-chip {
      border-radius: 12px;
      overflow: hidden;
    }

    .denom-chip.img-chip .denom-label {
      padding: 7px 4px;
      font-weight: 800;
      font-size: 13.5px;
    }

    .denom-chip.on {
      border-color: var(--gold);
      background: #FFE8DA;
      color: var(--gold-dark);
    }

    .denom-chip.img-chip.on .denom-label {
      background: #FFE8DA;
      color: var(--gold-dark);
    }

    /* ============================================================
   PREMIUM THERMAL RECEIPT
   Black & white, monospace, 58mm/80mm responsive. Screen preview
   mimics an actual thermal paper strip; ESC/POS builder (Printer
   module) renders the matching layout on real hardware.
   ============================================================ */
    .receipt-wrap {
      background: #E4E7EC;
      padding: 18px 10px 26px;
      display: flex;
      justify-content: center;
    }

    .receipt {
      --rw: 300px;
      width: var(--rw);
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      color: #0B0B0C;
      font-family: 'SF Mono', 'SFMono-Regular', 'Courier New', ui-monospace, Menlo, monospace;
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: .1px;
      padding: 24px 16px 22px;
      position: relative;
      box-shadow: 0 1px 0 #fff inset, 0 14px 30px rgba(10, 14, 25, .16), 0 2px 8px rgba(10, 14, 25, .08);
    }

    .receipt.w58 {
      --rw: 250px;
      font-size: 11px;
      padding: 20px 12px 18px;
    }

    .receipt.w80 {
      --rw: 300px;
    }

    .receipt::before {
      /* torn / serrated thermal paper edge */
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -7px;
      height: 7px;
      background:
        linear-gradient(135deg, #fff 50%, transparent 50%) 0 0/9px 9px repeat-x,
        linear-gradient(-135deg, #fff 50%, transparent 50%) 0 0/9px 9px repeat-x;
      background-position: bottom left, bottom left;
    }

    .r-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .r-logo img {
      max-height: 44px;
      max-width: 72%;
      object-fit: contain;
    }

    .r-brand {
      text-align: center;
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: .3px;
      margin: 0;
    }

    .r-sub {
      text-align: center;
      font-size: 10.5px;
      color: #6B6B6E;
      margin: 2px 0 0;
    }

    .r-title {
      text-align: center;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin: 12px 0 0;
      color: #0B0B0C;
    }

    .r-div {
      border-top: 1px dashed #C6C6C9;
      margin: 12px 0;
    }

    .r-div.solid {
      border-top: 1.5px solid #0B0B0C;
      margin: 10px 0 12px;
    }

    .r-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
    }

    .r-meta .g-label {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9A9A9E;
      margin: 7px 0 1px;
    }

    .r-meta .g-label:first-child {
      margin-top: 0;
    }

    .r-meta .g-val {
      font-size: 11.5px;
      font-weight: 600;
      color: #0B0B0C;
      word-break: break-word;
    }

    .r-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2px;
    }

    .r-table thead th {
      font-size: 8.5px;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #0B0B0C;
      border-bottom: 1.6px solid #0B0B0C;
      padding: 0 0 7px;
      text-align: left;
    }

    .r-table thead th.c {
      text-align: center;
    }

    .r-table thead th.r {
      text-align: right;
    }

    .r-table tbody td {
      padding: 8px 0;
      border-bottom: 1px dashed #E3E3E6;
      font-size: 11.5px;
      vertical-align: top;
    }

    .r-table tbody tr:last-child td {
      border-bottom: none;
    }

    .r-table td.name {
      padding-right: 6px;
      word-break: break-word;
    }

    .r-table td.qty {
      text-align: center;
      color: #55555A;
      white-space: nowrap;
      width: 26px;
    }

    .r-table td.rate {
      text-align: right;
      color: #55555A;
      white-space: nowrap;
      width: 52px;
    }

    .r-table td.amt {
      text-align: right;
      font-weight: 700;
      white-space: nowrap;
      width: 58px;
    }

    .r-sumrow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11.5px;
      padding: 3px 0;
    }

    .r-sumrow .l {
      color: #57575C;
    }

    .r-sumrow .v {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .r-sumrow.neg .v {
      color: #0B0B0C;
    }

    .r-grand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 6px;
      padding: 12px 0;
      border-top: 1.6px solid #0B0B0C;
      border-bottom: 1.6px solid #0B0B0C;
    }

    .r-grand .l {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .r-grand .v {
      font-size: 19px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .r-pay {
      margin-top: 10px;
    }

    .r-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 18px 0 4px;
    }

    .r-qr .box {
      width: 70px;
      height: 70px;
    }

    .r-qr .cap {
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9A9A9E;
      margin-top: 7px;
      text-align: center;
    }

    .r-foot {
      text-align: center;
      margin-top: 2px;
    }

    .r-foot .thanks {
      font-size: 12px;
      font-weight: 700;
      margin: 0 0 2px;
    }

    .r-foot .line {
      font-size: 10px;
      color: #8F8F94;
      margin: 1px 0;
    }

    .r-barcode {
      text-align: center;
      margin-top: 12px;
      font-size: 15px;
      letter-spacing: 3px;
      font-weight: 600;
      color: #0B0B0C;
    }

    .r-barcode .id {
      display: block;
      font-size: 9px;
      letter-spacing: 1px;
      color: #9A9A9E;
      margin-top: 3px;
    }

    .receipt-actions {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }

    .receipt-actions .icon-btn {
      width: auto;
      padding: 0 12px;
      height: 36px;
      border-radius: 9px;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .sec-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin: 4px 0 10px;
    }

    .lang-seg { display:inline-flex; align-items:center; gap:4px; background:var(--card,#fff); border:1px solid var(--line,#E3E3E6); border-radius:999px; padding:3px 4px 3px 10px; }
    .lang-seg .lg { font-size:11px; font-weight:700; color:var(--text-muted,#8A8F9B); margin-right:4px; }
    .lang-seg button { border:0; background:transparent; font-weight:700; font-size:12px; padding:6px 12px; border-radius:999px; color:inherit; cursor:pointer; }
    .lang-seg button.on { background:#0B0B0C; color:#fff; }
    @media print {
      body * {
        visibility: hidden !important;
      }

      .receipt,
      .receipt * {
        visibility: visible !important;
      }

      .receipt {
        position: absolute !important;
        left: 0;
        top: 0;
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
      }

      .receipt::before {
        display: none !important;
      }
    }

    /* List rows */
    .list-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 99px;
      background: var(--ink);
      background-image: var(--texture) !important;
      background-repeat: no-repeat !important;
      background-size: cover !important;
      background-position: center !important;
      background-blend-mode: soft-light;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    .list-row .main {
      flex: 1;
      min-width: 0;
    }

    .list-row .title {
      font-weight: 700;
      font-size: 13.5px;
    }

    .list-row .meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .list-row .right {
      text-align: right;
      flex-shrink: 0;
    }

    .date-head {
      padding: 10px 14px 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      background: var(--paper);
    }

    /* Reports stat bars */
    .stat-bar {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin: 0 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-bar .lbl {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stat-bar .val {
      font-size: 19px;
      font-weight: 800;
      color: #0B0B0C;
      margin-top: 2px;
    }

    .stat-bar svg {
      width: 18px;
      height: 18px;
      stroke: #B7BDCB;
    }

    /* More grid */
    .more-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
    }

    .more-box {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .more-box svg {
      width: 22px;
      height: 22px;
      stroke: var(--gold-dark);
    }

    .more-box .t {
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.25;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 2px;
      border-bottom: 1px solid var(--line);
    }

    .settings-row .l {
      font-size: 13.5px;
      font-weight: 600;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 99px;
      background: var(--line);
      position: relative;
      flex-shrink: 0;
      border: none;
    }

    .switch.on {
      background: var(--gold);
    }

    .switch::after {
      content: "";
      width: 19px;
      height: 19px;
      border-radius: 99px;
      background: #fff;
      position: absolute;
      top: 2.5px;
      left: 2.5px;
      transition: .15s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
    }

    .switch.on::after {
      left: 20.5px;
    }

    /* toast */
    #toast {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px) scale(.95);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s var(--ease-premium), transform .25s var(--ease-premium);
      z-index: 200;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(6, 32, 21, .25);
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Login page */
    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      background-color: var(--ink-3);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      animation: loginIn .45s var(--ease-premium);
    }

    @keyframes loginIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      margin: 0 auto 14px;
      box-shadow: 0 6px 18px rgba(232, 90, 31, .35);
      position: relative;
      overflow: hidden;
    }

    .login-logo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, .55) 40%, transparent 60%);
      background-size: 220% 100%;
      animation: shine 2.8s ease-in-out infinite;
    }

    @keyframes shine {
      0% {
        background-position: 130% 0;
      }

      55%,
      100% {
        background-position: -40% 0;
      }
    }

    .login-card h2 {
      text-align: center;
      margin: 0 0 2px;
      color: #0B0B0C;
    }

    .login-card p.sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 12.5px;
      margin: 0 0 20px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px 14px 0;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      background: #fff;
      border: 1.5px solid var(--line);
      color: var(--text-muted);
    }

    .tab.on {
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
      color: #fff;
      border-color: var(--ink);
    }

    .fab {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 52px;
      height: 52px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: #fff;
      border: none;
      box-shadow: 0 8px 20px rgba(255, 107, 43, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: fabPulse 2.6s ease-in-out infinite;
    }

    @keyframes fabPulse {

      0%,
      100% {
        box-shadow: 0 8px 20px rgba(255, 107, 43, .4);
      }

      50% {
        box-shadow: 0 8px 26px rgba(255, 107, 43, .65), 0 0 0 6px rgba(255, 107, 43, .12);
      }
    }

    .chip-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .chip {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 99px;
      background: #fff;
      border: 1.5px solid var(--line);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .chip.on {
      background-color: var(--ink);
      background-image: var(--texture);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-blend-mode: soft-light;
      color: #fff;
      border-color: var(--ink);
    }
  </style>
</head>

<body>

  <!-- ============================================================ LOGIN ============================================================ -->
  <div id="loginScreen">
    <!-- STEP 1: Username & Password -->
    <div class="login-card" id="loginStep1">
      <div class="login-logo">RM</div>
      <h2>Rakesh Mart</h2>
      <p class="sub">Login to continue</p>
      <div class="field">
        <label class="label">Username</label>
        <input class="input" id="loginUsername" placeholder="Enter username" autocomplete="username">
      </div>
      <div class="field">
        <label class="label">Password</label>
        <input class="input" id="loginPassword" type="password" placeholder="Enter password"
          autocomplete="current-password">
      </div>
      <div id="loginError"
        style="display:none;color:var(--danger);font-size:12.5px;margin:-8px 0 14px;text-align:center;"></div>
      <button class="btn gold block" id="loginBtn" onclick="doAuthLogin()"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" style="width:15px;height:15px;flex-shrink:0">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg> Login</button>
      <p class="sub" style="margin-top:16px;cursor:pointer;text-decoration:underline;" onclick="Sync.openConfig()">⚙
        Google Sheet Setup</p>
    </div>

    <!-- STEP 2: Shop details (shown after successful login, only first time) -->
    <div class="login-card" id="loginStep2" style="display:none;">
      <div class="login-logo">RM</div>
      <h2>Rakesh Mart</h2>
      <p class="sub">Premium billing, set up your store</p>
      <div class="field">
        <label class="label">Business Name</label>
        <input class="input" id="loginBizName" placeholder="e.g. Rakesh Mart">
      </div>
      <div class="field">
        <label class="label">Mobile Number</label>
        <input class="input" id="loginMobile" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10">
      </div>
      <div class="field">
        <label class="label">Business Address</label>
        <input class="input" id="loginAddress" placeholder="Shop address">
      </div>
      <button class="btn gold block" onclick="doShopSetup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" style="width:15px;height:15px;flex-shrink:0">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg> Continue</button>
    </div>
  </div>

  <!-- ============================================================ APP SHELL ============================================================ -->
  <div id="app">

    <!-- ---------- REPORTS ---------- -->
    <div class="page" id="page-reports">
      <div class="topbar">
        <button class="icon-btn" onclick="Reports.shiftDate(-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div style="flex:1;cursor:pointer" onclick="Reports.openRange()">
          <h1 id="repRangeLabel">Today</h1>
          <div class="sub" id="repRangeSub">Tap to change range</div>
        </div>
        <button class="icon-btn" onclick="Reports.shiftDate(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </div>
      <div class="scroll" id="reportsBody"></div>
    </div>

    <!-- ---------- BILLS ---------- -->
    <div class="page" id="page-bills">
      <div class="topbar">
        <div>
          <h1>Bills</h1>
          <div class="sub" id="billsCountSub">—</div>
        </div>

  <script>
    "use strict";
    /* ================================================================
       RAKESH MART BILLING — modular vanilla JS PWA
       Modules: DB (IndexedDB), Settings (localStorage), Router, UI,
       and one module per page: Reports, Bills, Counter, Items, More.
       ================================================================ */

    /* ---------------------------------------------------------------
       DB — thin promise wrapper around IndexedDB
       Stores: items, categories, customers, bills, transactions
    --------------------------------------------------------------- */
    const DB = (() => {
      let db;
      function open() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open("RakeshBillingDB", 7);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains("items")) {
              const s = d.createObjectStore("items", { keyPath: "id", autoIncrement: true });
              s.createIndex("barcode", "barcode", { unique: false });
              s.createIndex("category", "category", { unique: false });
            }
            if (!d.objectStoreNames.contains("categories")) d.createObjectStore("categories", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("customers")) d.createObjectStore("customers", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("bills")) d.createObjectStore("bills", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("transactions")) d.createObjectStore("transactions", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("revenueExpense")) d.createObjectStore("revenueExpense", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("suppliers")) d.createObjectStore("suppliers", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("purchases")) d.createObjectStore("purchases", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("returns")) d.createObjectStore("returns", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("usedItems")) d.createObjectStore("usedItems", { keyPath: "id", autoIncrement: true });
            if (!d.objectStoreNames.contains("savedSales")) d.createObjectStore("savedSales", { keyPath: "id", autoIncrement: true });
          };
          req.onsuccess = (e) => { db = e.target.result; resolve(db); };
          req.onerror = (e) => reject(e);
        });
      }
      function tx(store, mode = "readonly") { return db.transaction(store, mode).objectStore(store); }
      const all = (store) => new Promise((res) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result || []); });
      const get = (store, id) => new Promise((res) => { const r = tx(store).get(id); r.onsuccess = () => res(r.result); });
      const put = (store, obj) => new Promise((res) => { const r = tx(store, "readwrite").put(obj); r.onsuccess = () => res(r.result); });
      const del = (store, id) => new Promise((res) => { const r = tx(store, "readwrite").delete(id); r.onsuccess = () => res(); });
      return { open, all, get, put, del };
    })();

    /* ---------------------------------------------------------------
       Settings — persisted to localStorage (business/receipt config)
    --------------------------------------------------------------- */
    const Settings = (() => {
      const KEY = "rm_settings";
      const defaults = {
        businessName: "", mobile: "", address: "",
        receiptTitle: "Tax Invoice", logo: "", gstNumber: "", cashierName: "",
        showRate: true, showSaved: false, showMrp: false, showCashier: false, showCustName: true,
        showCustAddr: false, thankYouNote: "Thank you for shopping with us!",
        showItemCount: true, showChangeReturn: true, showPaymentDetails: true,
        showQr: true, showBarcode: true, showTax: true, showDiscount: true,
        orderBy: "added", printLang: "en", itemLines: true, plainLines: false, printGraphic: false, fastBT: true, logoLocal: "", logoLocalFor: "",
        idPrefix: "RM", nextBillNo: 1,
        taxes: [], discounts: [], fees: [], paymentModes: ["Cash", "Online", "PayLater"],
        roundOff: true,
        soundOn: true,
        /* printer: { type: 'bluetooth'|'usb'|'network', name, btDeviceId, paperWidth: 58|80 } */
        printer: null,
        /* barcodeScanner: { type: 'bluetooth'|'usb', name, btDeviceId } */
        barcodeScanner: null
      };
      let cur = load();
      function load() { try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return { ...defaults }; } }
      function save() { localStorage.setItem(KEY, JSON.stringify(cur)); }
      function get() { return cur; }
      function set(patch) { cur = Object.assign({}, cur, patch); save(); }
      return { get, set };
    })();

    /* ---------------------------------------------------------------
       Sync — pushes every save (Products, Categories, Customers, Bills,
       Income & Expenses) to a Google Sheet via an Apps Script Web App,
       and checks the Username/Password login against the "Login" sheet.
       Works fully offline (local-only) if no Sheet URL is configured.
    --------------------------------------------------------------- */
    const Sync = (() => {
      const URL_KEY = "rm_sync_url";
      // Rakesh Mart ki Google Sheet se juda hua Apps Script Web App URL —
      // yeh default hai, isliye app pehli baar khulte hi automatically
      // isi Sheet se connect ho jaata hai. Login, aur Products/Categories/
      // Customers/Bills/Income & Expenses — sab data isi URL par jaata hai.
      const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbz5NTeQR-ut5rhpLQnyZ-pdekcbziaXN53o5pzSCZZ5iIkDLoKpq9-5Q2ostI4xFJcs/exec";
      function getUrl() {
        const stored = (localStorage.getItem(URL_KEY) || "").trim();
        return stored || DEFAULT_SHEET_URL;
      }
      function setUrl(u) { localStorage.setItem(URL_KEY, (u || "").trim()); }

      // ---- Udhar (Credit Ledger) app ka ALAG Google Sheet + Apps Script ----
      // Isi URL se "PayLater" button ki eligibility (customer ki Membership
      // sheet me entry + credit limit) check hoti hai, aur PayLater se hui
      // sale ko Udhar sheet me credit entry ke roop me bhi save kiya jaata hai.
      const UDHAR_URL_KEY = "rm_udhar_url";
      // Udhar app ka default Web App URL — isse Settings me kuch bhare bina
      // hi PayLater eligibility check aur Udhar sheet me order push hote
      // rahenge. Settings ke "Udhar Sheet API URL" field se ise kabhi bhi
      // override kiya ja sakta hai.
      const DEFAULT_UDHAR_URL = "https://script.google.com/macros/s/AKfycbyCZMuUbbyIGmUzQTDFKKzOkqwyBbf4wJzrHn8wcfhvKTGJJfAsl2iM-RsG5CAMy8Kt/exec";
      function getUdharUrl() {
        const stored = (localStorage.getItem(UDHAR_URL_KEY) || "").trim();
        return stored || DEFAULT_UDHAR_URL;
      }
      function setUdharUrl(u) { localStorage.setItem(UDHAR_URL_KEY, (u || "").trim()); }

      async function callUdhar(payload, _attempt) {
        const url = getUdharUrl();
        if (!url) return { ok: false, offline: true };
        const attempt = _attempt || 1;
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          const raw = await res.text();
          let data;
          try {
            data = JSON.parse(raw);
          } catch (parseErr) {
            if (attempt < 3) { await new Promise(r => setTimeout(r, 500 * attempt)); return callUdhar(payload, attempt + 1); }
            console.warn("Sync.callUdhar: invalid JSON after retries", raw);
            return { ok: false, error: "Invalid response", raw };
          }
          return { ok: true, data };
        } catch (e) {
          if (attempt < 3) { await new Promise(r => setTimeout(r, 500 * attempt)); return callUdhar(payload, attempt + 1); }
          return { ok: false, error: e };
        }
      }

      // Mobile number Udhar ki "Membership" sheet me hai ya nahi, aur agar
      // hai to abhi kitna Pay Later credit baaki hai (Membership sheet ke
      // "Credit limit" column E se — kabhi hardcode nahi karna, wahi se
      // dynamically aata hai, level-up hone par khud badh jaata hai).
      async function checkPayLater(mobile) {
        if (!mobile || !getUdharUrl()) return { allowed: false };
        const r = await callUdhar({ action: "checkPayLaterEligibility", mobile: mobile });
        if (r.ok && r.data) return r.data;
        return { allowed: false };
      }

      // PayLater se hui sale ko Udhar sheet me ek credit (udhar) entry ke
      // roop me bhi save karta hai — Udhar backend ka addUdharFromOnlineOrder
      // action isi ke liye bana hai.
      function pushUdharOrder(mobile, items, date) {
        if (!getUdharUrl()) return Promise.resolve({ ok: false, offline: true });
        return callUdhar({ action: "addUdharFromOnlineOrder", mobile: mobile, items: JSON.stringify(items), date: date });
      }

      async function call(payload, _attempt) {
        const url = getUrl();
        if (!url) return { ok: false, offline: true };
        const attempt = _attempt || 1;
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
            body: JSON.stringify(payload)
          });
          const raw = await res.text();
          let data;
          try {
            data = JSON.parse(raw);
          } catch (parseErr) {
            // Apps Script ka echo/redirect kabhi kabhi flaky hota hai
            // (khaas kar photo jaise bade payload me) — retry se usually
            // theek ho jaata hai.
            if (attempt < 3) { await new Promise(r => setTimeout(r, 500 * attempt)); return call(payload, attempt + 1); }
            console.warn("Sync.call: invalid JSON after retries", raw);
            return { ok: false, error: "Invalid response", raw };
          }
          return { ok: true, data };
        } catch (e) {
          if (attempt < 3) { await new Promise(r => setTimeout(r, 500 * attempt)); return call(payload, attempt + 1); }
          return { ok: false, error: e };
        }
      }

      // Push one row into a sheet tab. Silently does nothing if no Google
      // Sheet is connected (pure local/offline mode). Returns a promise so
      // callers that need to be sure the write reached the Sheet before
      // moving on (e.g. before closing a form / allowing a refresh) can
      // await it; callers that don't await it keep the old fire-and-forget
      // behavior exactly as before.
      function push(sheet, key, row) {
        if (!getUrl()) return Promise.resolve();
        return call({ action: "sync", sheet, key, row }).then((r) => {
          if (!r.ok || (r.data && r.data.success === false)) {
            console.warn("Sheet sync failed for", sheet, r);
          }
          return r;
        });
      }

      function login(username, password) {
        return call({ action: "login", username, password });
      }

      function deleteBatch(sheet, productId, dateStr) {
        if (!getUrl()) return;
        call({ action: "deleteBatch", sheet, productId, date: dateStr }).then((r) => {
          if (!r.ok || (r.data && r.data.success === false)) console.warn("Batch delete failed", r);
        });
      }

      function openConfig() {
        const cur = getUrl();
        const curUdhar = getUdharUrl();
        UI.sheet(`<div class="sheet-head"><h3>Google Sheet Setup</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:10px">Apps Script ko Web App ke roop me deploy karke uska URL yahan paste karo. Isse login check hoga aur Products, Categories, Customers, Bills, Income & Expenses — sab kuchh tumhari Google Sheet me apne aap save hota rahega.</div>
        <div class="field"><label class="label">Web App URL</label><input class="input" id="syncUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${U.escapeHtml(cur)}"></div>
        ${cur ? `<div class="hint" style="margin-top:-6px;margin-bottom:14px;color:var(--success)">✓ Connected</div>` : ""}
        <div class="divider"></div>
        <div class="hint" style="margin:12px 0 10px">Udhar (Credit Ledger) app ka Web App URL — isse "PayLater" button sirf un customers ko dikhega jinka Mobile Number Udhar ki "Membership" sheet me hai, aur unki credit limit bhi wahi se live check hogi.</div>
        <div class="field"><label class="label">Udhar Sheet API URL</label><input class="input" id="udharUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${U.escapeHtml(curUdhar)}"></div>
        ${curUdhar ? `<div class="hint" style="margin-top:-6px;margin-bottom:14px;color:var(--success)">✓ Connected</div>` : ""}
        <button class="btn primary block" onclick="Sync.saveConfig()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save</button>
      </div>`, { center: true });
      }
      function saveConfig() {
        const v = document.getElementById("syncUrlInput").value.trim();
        const udharInput = document.getElementById("udharUrlInput");
        const vu = udharInput ? udharInput.value.trim() : "";
        setUrl(v);
        setUdharUrl(vu);
        UI.close();
        U.toast(v ? "Sheet connected" : "Sheet URL removed — local-only mode");
      }

      return { getUrl, setUrl, push, login, deleteBatch, openConfig, saveConfig, call, getUdharUrl, setUdharUrl, checkPayLater, pushUdharOrder };
    })();

    /* ---------------------------------------------------------------
       Auth — Username/Password login gate. Verifies against the
       "Login" sheet (A2 username, B2 password) when a Sheet is
       connected; falls back to a locally cached login otherwise.
    --------------------------------------------------------------- */
    const Auth = (() => {
      const LOGGED_KEY = "rm_logged_in";
      const CRED_KEY = "rm_cred_cache";
      function isLoggedIn() { return localStorage.getItem(LOGGED_KEY) === "1"; }
      function setLoggedIn(v) { v ? localStorage.setItem(LOGGED_KEY, "1") : localStorage.removeItem(LOGGED_KEY); }
      function cacheCreds(u, p) { localStorage.setItem(CRED_KEY, JSON.stringify({ u, p })); }
      function getCachedCreds() { try { return JSON.parse(localStorage.getItem(CRED_KEY) || "null"); } catch (e) { return null; } }
      async function logout() { if (!(await UI.confirm("Logout karein?", { okText: "Logout" }))) return; setLoggedIn(false); location.reload(); }
      return { isLoggedIn, setLoggedIn, cacheCreds, getCachedCreds, logout };
    })();

    /* ---------------------------------------------------------------
       SFX — lightweight Web Audio API sound effects (no audio files,
       synthesized tones only). Muted automatically if user has sound
       turned off in Settings, and completely silent-safe if the
       browser blocks audio before first user gesture.
    --------------------------------------------------------------- */
    const SFX = (() => {
      let ctx;
      function ac() {
        if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
        if (ctx.state === "suspended") ctx.resume().catch(() => { });
        return ctx;
      }
      function enabled() { return Settings.get().soundOn !== false; }
      function tone(freq, dur, type, startGain, delay) {
        if (!enabled()) return;
        const c = ac(); if (!c) return;
        const t0 = c.currentTime + (delay || 0);
        const osc = c.createOscillator(); const gain = c.createGain();
        osc.type = type || "sine"; osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(startGain || 0.14, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
      }
      return {
        tap() { tone(720, 0.06, "sine", 0.09); },
        add() { tone(880, 0.08, "triangle", 0.11); tone(1180, 0.07, "triangle", 0.07, 0.03); },
        remove() { tone(420, 0.09, "sine", 0.1); },
        success() { tone(660, 0.1, "sine", 0.12); tone(880, 0.12, "sine", 0.12, 0.09); tone(1320, 0.16, "sine", 0.1, 0.18); },
        cash() { tone(1046, 0.09, "square", 0.05, 0); tone(1318, 0.09, "square", 0.05, 0.07); tone(1568, 0.22, "sine", 0.08, 0.14); },
        error() { tone(220, 0.16, "sawtooth", 0.09); tone(160, 0.2, "sawtooth", 0.08, 0.09); },
        scan() { tone(2800, 0.075, "square", 0.17); }
      };
    })();

    /* ---------------------------------------------------------------
       Utils
    --------------------------------------------------------------- */
    const U = {
      money(n) { n = Number(n) || 0; return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 }); },
      todayISO() { return new Date().toISOString().slice(0, 10); },
      fmtDate(d) { const dt = new Date(d); return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); },
      fmtTime(d) { return new Date(d).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }); },
      isSameDay(a, b) { return new Date(a).toDateString() === new Date(b).toDateString(); },
      initials(name) {
        const s = typeof name === "string" ? name : Array.isArray(name) ? (name[0] || "") : String(name || "");
        return (s.trim() || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
      },
      uid() { return Date.now() + Math.floor(Math.random() * 1000); },
      toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); },
      escapeHtml(s) { return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
      itemAvatar(it, bg) {
        bg = bg || "var(--ink)";
        const initials = U.initials(it && it.name);
        if (it && it.imageUrl) {
          return `<div class="avatar" style="background:${bg};padding:0;overflow:hidden;position:relative;">
        <img src="${U.escapeHtml(it.imageUrl)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;">${initials}</span>
      </div>`;
        }
        return `<div class="avatar" style="background:${bg}">${initials}</div>`;
      },
      resizeImageBase64(base64, maxDim, quality) {
        return new Promise((resolve) => {
          try {
            const img = new Image();
            img.onload = function () {
              let { width, height } = img;
              const max = maxDim || 1000;
              if (width > max || height > max) {
                if (width >= height) { height = Math.round(height * (max / width)); width = max; }
                else { width = Math.round(width * (max / height)); height = max; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width; canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality || 0.82));
            };
            img.onerror = function () { resolve(base64); };
            img.src = base64;
          } catch (e) { resolve(base64); }
        });
      },
      itemThumb(it) {
        const initials = U.initials(it && it.name);
        if (it && it.imageUrl) {
          const src = U.escapeHtml(it.imageUrl);
          return `<div class="item-thumb" style="padding:0;overflow:hidden;position:relative;">
        <img src="${src}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;">${initials}</span>
      </div>`;
        }
        return `<div class="item-thumb">${initials}</div>`;
      },
      driveFileId(url) {
        if (!url) return "";
        const s = String(url).trim();
        let m = s.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/); if (m) return m[1];
        m = s.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/); if (m) return m[1];
        m = s.match(/drive\.google\.com\/(?:uc|thumbnail)\?(?:[^#]*?&)?id=([a-zA-Z0-9_-]+)/); if (m) return m[1];
        return "";
      },
      driveFolderId(url) {
        if (!url) return "";
        const m = String(url).trim().match(/drive\.google\.com\/drive\/folders\/([a-zA-Z0-9_-]+)/);
        return m ? m[1] : "";
      },
      getCustomerImageUrl(url) {
        if (!url) return "";
        url = String(url).trim();
        if (!url) return "";
        if (U.driveFolderId(url)) return ""; // folder link, not an image — see driveFolderId check at call sites

        const id = U.driveFileId(url);
        if (id) return "https://drive.google.com/thumbnail?id=" + id + "&sz=w1000";

        // GitHub blob URL → RAW URL
        const m = url.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
        if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;

        // Direct image URL
        return url;
      },
      getCustomerImageUrlAlt(url) {
        const id = U.driveFileId(url);
        return id ? "https://drive.google.com/uc?export=view&id=" + id : "";
      },

      custAvatar(c, bg) {
        bg = bg || "var(--ink)";
        const initials = U.initials(c && c.name);
        const displayUrl = c && c.photo ? U.getCustomerImageUrl(c.photo) : "";

        if (displayUrl) {
          const altUrl = U.getCustomerImageUrlAlt(c.photo);
          return `<div class="avatar" style="background:${bg};padding:0;overflow:hidden;position:relative;">
      <img
        src="${U.escapeHtml(displayUrl)}"
        data-alt="${U.escapeHtml(altUrl)}"
        data-tried-alt="0"
        style="width:100%;height:100%;object-fit:cover;display:block;"
        onload="this.style.display='block';this.nextElementSibling.style.display='none';"
        onerror="if(this.dataset.triedAlt==='0'&&this.dataset.alt){this.dataset.triedAlt='1';this.src=this.dataset.alt;}else{this.style.display='none';this.nextElementSibling.style.display='flex';}"
      >
      <span style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;">
        ${initials}
      </span>
    </div>`;
        }

        return `<div class="avatar" style="background:${bg}">${initials}</div>`;
      },
    };

      confirm(message, opts) {
        opts = opts || {};
        return new Promise((resolve) => {
          const wrap = document.createElement("div");
          wrap.className = "confirm-overlay";
          wrap.innerHTML = `
            <div class="confirm-card">
              <p class="confirm-msg">${U.escapeHtml(message)}</p>
              <div class="confirm-actions">
                <button class="btn ghost block" type="button" data-act="cancel">${U.escapeHtml(opts.cancelText || "Cancel")}</button>
                <button class="btn ${opts.danger === false ? "primary" : "danger"} block" type="button" data-act="ok">${U.escapeHtml(opts.okText || "Delete")}</button>
              </div>
            </div>`;
          document.body.appendChild(wrap);
          requestAnimationFrame(() => wrap.classList.add("show"));
          function finish(v) {
            SFX.tap();
            wrap.classList.remove("show");
            setTimeout(() => wrap.remove(), 180);
            resolve(v);
          }
          wrap.querySelector('[data-act="cancel"]').onclick = () => finish(false);
          wrap.querySelector('[data-act="ok"]').onclick = () => finish(true);
          wrap.onclick = (e) => { if (e.target === wrap) finish(false); };
        });
      }
    };

    /* ================================================================
       LOGIN
       Step 1: Username & Password (checked against the "Login" sheet).
       Step 2: Shop details (business name / mobile / address) — shown
       only the first time, after a successful login.
    ================================================================ */
    async function doAuthLogin() {
      const btn = document.getElementById("loginBtn");
      const errEl = document.getElementById("loginError");
      errEl.style.display = "none";
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value;
      if (!u || !p) { U.toast("Username aur password daliye"); return; }

      btn.disabled = true;
      let success = false;
      const sheetUrl = Sync.getUrl();

      if (sheetUrl) {
        const res = await Sync.login(u, p);
        if (res.ok && res.data && res.data.success === true) {
          success = true;
          Auth.cacheCreds(u, p);
        } else if (res.ok && res.data && res.data.success === false) {
          success = false;
        } else {
          // Sheet unreachable right now — allow offline login if these
          // exact credentials were verified online before.
          const cached = Auth.getCachedCreds();
          if (cached && cached.u === u && cached.p === p) {
            success = true;
          } else {
            btn.disabled = false;
            errEl.textContent = "Google Sheet se connect nahi ho paaya. Internet check karke dobara try karo.";
            errEl.style.display = "block";
            return;
          }
        }
      } else {
        // No sheet connected yet — first-ever login sets the local credentials.
        const cached = Auth.getCachedCreds();
        if (!cached) { Auth.cacheCreds(u, p); success = true; }
        else success = (cached.u === u && cached.p === p);
      }

      btn.disabled = false;
      if (!success) {
        SFX.error();
        errEl.textContent = "Galat username ya password";
        errEl.style.display = "block";
        return;
      }
      SFX.success();
      Auth.setLoggedIn(true);
      proceedAfterLogin();
    }

    function proceedAfterLogin() {
      const s = Settings.get();
      document.getElementById("loginStep1").style.display = "none";
      if (s.businessName) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        Router.go("counter");
      } else {
        document.getElementById("loginStep2").style.display = "block";
      }
    }

    function doShopSetup() {
      const name = document.getElementById("loginBizName").value.trim();
      const mobile = document.getElementById("loginMobile").value.trim();
      const address = document.getElementById("loginAddress").value.trim();

      Settings.set({ businessName: name, mobile, address });

      Router.go("counter");

    /* ================================================================
