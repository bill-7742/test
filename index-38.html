        renderGrid();
      }
      async function scanBarcode() {
        openContinuousScan();
      }
      async function addToCartCore(itemId) {
        if (!state.cart[itemId]) {
          const it = await DB.get("items", itemId);
          const firstExtra = (it.extraStock && it.extraStock[0]) || null;
          state.cart[itemId] = {
            itemId, name: it.name, price: it.sellPrice, cost: it.buyPrice, mrp: it.mrp || 0, qty: 0,
            mainAvail: it.stockQty || 0, mainPrice: it.sellPrice, mainCost: it.buyPrice,
            extraAvail: firstExtra ? firstExtra.qty : 0,
            extraPrice: firstExtra ? firstExtra.sellPrice : it.sellPrice,
            extraCost: firstExtra ? firstExtra.buyPrice : it.buyPrice,
            extraQty: 0, imageUrl: it.imageUrl || ""
          };
        }
        bumpCartQty(itemId, 1);
        SFX.tap();
      }
      async function addToCart(itemId) {
        await addToCartCore(itemId);
        renderGrid();
      }

      /* ---------- Continuous (live) barcode scan for New Sale ----------
         Camera ek hi baar khulta hai aur khula rehta hai; har naya barcode
         detect hote hi item apne aap cart me add hokar niche list me
         dikhta hai — bina camera band kiye, bina dobara scan button
         dabaye (jaise ek dedicated POS scan page). */
      async function openContinuousScan() {
        if (!state.scanMode) state.scanMode = Scanner.getPreferredMode();
        const root = document.getElementById("counterRoot");
        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="Counter.closeContinuousScan()">✕</button>
        <div style="flex:1"><h1 style="font-size:14px">Scan Items</h1></div>
        <div class="scan-mode-switch">
          <button class="scan-mode-btn" id="scanModeCamBtn" title="Camera" onclick="Counter.setScanMode('camera')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
          <button class="scan-mode-btn" id="scanModeHwBtn" title="Barcode Scanner" onclick="Counter.setScanMode('hardware')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M6 8v8M9 8v8M12 8v8M15 8v8M18 8v8" stroke-linecap="round"/></svg></button>
        </div>
        <button class="icon-btn" style="margin-right:6px" title="Switch camera" id="switchCamBtn" onclick="Scanner.switchCamera()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
        <span id="scanBadgeSlot"></span>
      </div>
      <div id="scanStageWrap"></div>
      <div class="scroll" style="position:relative;"><div class="section" id="contScanFeed" style="padding-top:12px"></div></div>
    `;
        renderContinuousFeed();
        renderScanStage();
      }
      function setScanMode(mode) {
        if (state.scanMode === mode) return;
        state.scanMode = mode;
        Scanner.setPreferredMode(mode);
        renderScanStage();
      }
      function renderScanStage() {
        const camBtn = document.getElementById("scanModeCamBtn");
        const hwBtn = document.getElementById("scanModeHwBtn");
        const switchCamBtn = document.getElementById("switchCamBtn");
        const badgeSlot = document.getElementById("scanBadgeSlot");
        const stageWrap = document.getElementById("scanStageWrap");
        if (!stageWrap) return;
        if (camBtn) camBtn.classList.toggle("on", state.scanMode === "camera");
        if (hwBtn) hwBtn.classList.toggle("on", state.scanMode === "hardware");

        if (state.scanMode === "camera") {
          HWScan.detach();
          if (switchCamBtn) switchCamBtn.style.display = "";
          if (badgeSlot) badgeSlot.innerHTML = `<div class="scan-live-badge"><span class="pulse-dot"></span>LIVE</div>`;
          stageWrap.innerHTML = `
        <div class="scan-live-video-wrap">
          <div id="contScanReader"></div>
          <div class="scan-live-frame" id="contScanFrame">
            <span class="scan-live-corner tl"></span><span class="scan-live-corner tr"></span>
            <span class="scan-live-corner bl"></span><span class="scan-live-corner br"></span>
            <div class="scan-live-laser"></div>
          </div>
          <div class="scan-live-pill" id="contScanPill"><span class="dot"></span><span id="contScanPillText">Camera ke saamne barcode laayein</span></div>
        </div>`;
          Scanner.startContinuous("contScanReader", { onDetect: handleContinuousDetect });
        } else {
          Scanner.stopContinuous();
          if (switchCamBtn) switchCamBtn.style.display = "none";
          const scanner = Settings.get().barcodeScanner;
          const linked = !!scanner;
          if (badgeSlot) badgeSlot.innerHTML = `<div class="scan-live-badge" style="${linked ? '' : 'opacity:.65'}"><span class="pulse-dot" style="background:${linked ? 'var(--success)' : '#8a8f9c'};animation:none;box-shadow:none"></span>${linked ? 'READY' : 'NOT LINKED'}</div>`;
          stageWrap.innerHTML = `
        <div class="hw-scan-stage">
          <div class="hw-scan-panel">
            <div class="hw-scan-icon ${linked ? 'linked' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M6 8v8M9 8v8M12 8v8M15 8v8M18 8v8" stroke-linecap="round"/></svg></div>
            <div class="hw-scan-title">${linked ? "Barcode Scanner Ready" : "Use your Barcode Scanner"}</div>
            <div class="hw-scan-sub">${linked ? `Linked: ${U.escapeHtml(scanner.name)} — scan any item` : "Already paired in phone's Bluetooth settings? Just scan an item below."}</div>
            ${!linked
              ? `<button class="btn gold" style="margin-top:6px" onclick="Counter.openScannerSetupFromScan()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex-shrink:0"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg> Pair Barcode Scanner (optional)</button>`
              : `<div class="hw-scan-hint">Need help connecting? <span style="text-decoration:underline;cursor:pointer" onclick="Counter.openScannerSetupFromScan()">Click Here</span></div>`}
            <input id="hwScanInput" class="hw-scan-input" autocomplete="off" inputmode="none">
          </div>
        </div>`;
          const el = document.getElementById("hwScanInput");
          HWScan.attach(el, (code) => { HWScan.markLinkedFromScan(); handleContinuousDetect(code); });
        }
      }
      function openScannerSetupFromScan() {
        More.barcodeScannerSetup();
      }
      function closeContinuousScan() {
        Scanner.stopContinuous();
        HWScan.detach();
        openItemGrid();
      }
      let _contScanFlashTimer = null;
      function contScanFlash(state) {
        const frame = document.getElementById("contScanFrame");
        const pill = document.getElementById("contScanPill");
        if (!frame || !pill) return;
        clearTimeout(_contScanFlashTimer);
        frame.classList.remove("found", "not-found");
        pill.classList.remove("found", "not-found");
        if (state) { frame.classList.add(state); pill.classList.add(state); }
        _contScanFlashTimer = setTimeout(() => {
          frame.classList.remove("found", "not-found");
          pill.classList.remove("found", "not-found");
          const pillText = document.getElementById("contScanPillText");
          if (pillText) pillText.textContent = "Camera ke saamne barcode laayein";
        }, 1400);
      }
      async function handleContinuousDetect(code) {
        const pillText = document.getElementById("contScanPillText");
        const items = await DB.all("items");
        const it = items.find(i => String(i.barcode || "").trim() === String(code || "").trim());
        if (it) {
          SFX.scan();
          if (navigator.vibrate) navigator.vibrate(30);
          await addToCartCore(it.id);
          if (pillText) pillText.textContent = `✓ ${it.name} added`;
          else U.toast(`✓ ${it.name} added`);
          contScanFlash("found");
          renderContinuousFeed(it.id);
        } else {
          SFX.error();
          if (pillText) pillText.textContent = "Item not found for this barcode";
          contScanFlash("not-found");
          U.toast("Item not found for this barcode");
        }
      }
      function renderContinuousFeed(justAddedId) {
        const feed = document.getElementById("contScanFeed");
        if (!feed) return;
        const items = Object.values(state.cart);
        if (items.length === 0) {
          feed.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>Scanned items yahan dikhenge</div>`;
        } else {
          const count = items.reduce((s, c) => s + c.qty, 0);
          const rows = items.slice().reverse().map(it => {
            const b = cartItemBlended(it);
            const isNew = it.itemId === justAddedId;
            return `<div class="scan-live-row${isNew ? ' new' : ''}">
            <div style="display:flex;align-items:center;gap:10px;">
              ${U.itemAvatar(it)}
              <div><div style="font-weight:700;font-size:13px">${U.escapeHtml(it.name)}</div>
                <div class="hint">${U.money(b.price)} x ${it.qty}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="icon-btn dark" style="width:26px;height:26px" onclick="Counter.contScanChangeQty(${it.itemId},-1)">−</button>
              <span class="num" style="font-weight:700;min-width:16px;text-align:center">${it.qty}</span>
              <button class="icon-btn dark" style="width:26px;height:26px" onclick="Counter.contScanChangeQty(${it.itemId},1)">+</button>
            </div>
          </div>`;
          }).join("");
          feed.innerHTML = `<div class="scan-feed-head"><span class="t">Scanned Items</span><span class="count">${count}</span></div><div class="card">${rows}</div>`;
        }
        renderCartBar();
      }
      function cartItemBlended(c) {
        if (c.mainAvail === undefined) return { price: c.price, cost: c.cost };
        const mainQty = Math.max(0, c.qty - (c.extraQty || 0));
        const extraQty = c.extraQty || 0;
        const totalPrice = mainQty * c.mainPrice + extraQty * c.extraPrice;
        const totalCost = mainQty * c.mainCost + extraQty * c.extraCost;
        return { price: c.qty ? totalPrice / c.qty : c.mainPrice, cost: c.qty ? totalCost / c.qty : c.mainCost };
      }
      function cartTotalFor(cart) {
        return Object.values(cart).reduce((s, c) => { const b = cartItemBlended(c); return s + b.price * c.qty; }, 0);
      }
      function bumpCartQty(itemId, delta) {
        const c = state.cart[itemId];
        if (!c) return;
        const totalAvail = c.mainAvail !== undefined ? ((c.mainAvail || 0) + (c.extraAvail || 0)) : Infinity;
        if (delta > 0) {
          if (totalAvail !== Infinity && c.qty >= totalAvail) { SFX.error(); U.toast("Stock khatam ho gaya"); return; }
          c.qty += 1;
          if (c.mainAvail !== undefined && c.qty > (c.mainAvail || 0)) c.extraQty = (c.extraQty || 0) + 1;
        } else {
          if (c.qty <= 0) return;
          if (c.mainAvail !== undefined && (c.extraQty || 0) > 0 && c.qty > (c.mainAvail || 0)) c.extraQty -= 1;
          c.qty -= 1;
          if (c.qty <= 0) delete state.cart[itemId];
        }
      }
      function plusBtnState(it) {
        if (it.mainAvail === undefined) return { style: "", disabled: false };
        const totalAvail = (it.mainAvail || 0) + (it.extraAvail || 0);
        if (totalAvail > 0 && it.qty >= totalAvail) return { style: "background:var(--danger);color:#fff;opacity:.55;pointer-events:none;", disabled: true };
        if (it.qty >= (it.mainAvail || 0) && (it.extraAvail || 0) > 0) return { style: "background:var(--gold);color:#fff;", disabled: false };
        return { style: "", disabled: false };
      }
      function renderCartBar() {
        const scrollArea = document.querySelector("#page-counter .scroll");
        let bar = document.getElementById("cartBar");
        const count = Object.values(state.cart).reduce((s, c) => s + c.qty, 0);
        if (bar) bar.remove();
        if (count === 0) return;
        const total = cartTotalFor(state.cart);
        bar = document.createElement("div");
        bar.className = "cart-bar"; bar.id = "cartBar";
        bar.innerHTML = `<div><div style="font-size:11px;opacity:.75">${count} items</div><div class="amt num">${U.money(total)}</div></div><button class="btn gold" onclick="Counter.goToCounter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:15px;height:15px;flex-shrink:0"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Go to Counter</button>`;
        scrollArea.parentElement.style.position = "relative";
        scrollArea.parentElement.appendChild(bar);
      }
      function contScanChangeQty(itemId, d) {

      }

      function profitColor(pct) {
        if (pct > 20) return "var(--success)";
        if (pct >= 10) return "var(--gold)";
        return "var(--danger)";
      }
      function openProfitDetail() {

        const netProfit = grossProfit - discountAmt;
        const netSale = subtotal - discountAmt;
        const marginPct = netSale > 0 ? (netProfit / netSale * 100) : 0;
        const color = profitColor(marginPct);
        UI.sheet(`
      <div class="sheet-head"><h3>Profit on this Sale</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>

          <div>
            <div style="font-size:22px;font-weight:800;" class="num">${marginPct.toFixed(1)}% margin</div>
            <div class="hint">Total profit ${U.money(netProfit)} on ${U.money(netSale)} sale${discountAmt > 0 ? ` (after ${U.money(discountAmt)} discount)` : ""}</div>

            <div class="main"><div class="title">${U.escapeHtml(it.name)}</div><div class="meta">Cost ${U.money(b.cost || 0)} · Sell ${U.money(b.price)} · x${it.qty}</div></div>
            <div class="right title num" style="color:${unitProfit >= 0 ? 'var(--success)' : 'var(--danger)'}">${U.money(lineProfit)}</div>
          </div>`;
        }).join("")}
        ${discountAmt > 0 ? `<div class="list-row" style="padding:10px 0;">
          <div class="main"><div class="title">Discount given</div></div>
          <div class="right title num" style="color:var(--danger)">-${U.money(discountAmt)}</div>
        </div>`: ""}
      </div>`);
      }

        const saleNetProfit = saleGrossProfit - discountAmt;

        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="Counter.openItemGrid()">←</button><h1 style="flex:1">Checkout</h1></div>

            <button onclick="Counter.openProfitDetail()" title="Profit on this sale" class="profit-dot${saleNetProfit < 0 ? ' blink' : ''}" style="position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;border:none;padding:0;background:${profitColor(saleMarginPct)};box-shadow:0 0 0 4px ${profitColor(saleMarginPct)}22;"></button>

            ${items.map(it => {

          const pb = plusBtnState(it);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
              <div><div style="font-weight:700;font-size:13px">${U.escapeHtml(it.name)}</div>
                <div class="hint">${U.money(it.mainAvail !== undefined ? it.mainPrice : it.price)} x ${mainQty}${hasExtraMix ? `<br><span style="color:var(--gold-dark);font-weight:800">+ ${U.money(it.extraPrice)} x ${it.extraQty} (new stock)</span>` : ""}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="icon-btn dark" style="width:26px;height:26px" onclick="Counter.changeQty(${it.itemId},-1)">−</button>
                <span class="num" style="font-weight:700;min-width:16px;text-align:center">${it.qty}</span>
                <button class="icon-btn dark" style="width:26px;height:26px;${pb.style}" ${pb.disabled ? 'disabled' : ''} onclick="Counter.changeQty(${it.itemId},1)">+</button>
              </div>
            </div>`;
        }).join("")}
            <div style="display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px;color:var(--text-muted)"><span>Subtotal</span><span class="num">${U.money(subtotal)}</span></div>
            ${discountAmt > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;"><span>Discount</span><span class="num" style="color:var(--success)">-${U.money(discountAmt)}</span></div>` : ""}
            ${taxAmt > 0 ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;"><span>Tax</span><span class="num">${U.money(taxAmt)}</span></div>` : ""}
            ${state.appliedFees.map(f => {
          const amt = f.unit === "%" ? subtotal * (f.value || 0) / 100 : (f.value || 0);

            <div style="display:flex;justify-content:space-between;padding-top:12px;margin-top:4px;border-top:1px solid var(--line);font-weight:800;font-size:16px;"><span>Grand Total</span><span class="num">${U.money(total)}</span></div>

          customerMobile: state.customer?.mobile || "",
          customerAddress: state.customer?.address || "",
          items, subtotal, discount: discountAmt, tax: taxAmt,
          appliedTaxes: state.appliedTaxes.slice(), appliedDiscounts: state.appliedDiscounts.slice(),
          additionalFee: feeAmt, appliedFees: state.appliedFees.slice(),
          total: subtotal - discountAmt + taxAmt + feeAmt,
          paymentMode: mode, cashGiven: given, changeReturned: change, status: "completed",
          paymentSplits: splits && splits.length ? splits : null
        };
        const billId = await DB.put("bills", bill);
        Sync.push("Bills", "Bill No.", {
          "Bill No.": bill.idLabel,
          "Date & Time": bill.date,
          "Customer Name": bill.customerName,
          "Customer Mobile": bill.customerMobile,
          "Products": items.map(it => `${it.name} x${it.qty}`).join(", "),
          "Quantity": items.reduce((a, it) => a + it.qty, 0),
          "Selling Price": items.map(it => it.price).join(", "),
          "Cost Price": items.map(it => it.cost || 0).join(", "),
          "Subtotal": bill.subtotal, "Discount": bill.discount, "Tax": bill.tax,
          "Additional Fee": bill.additionalFee, "Total": bill.total,
          "Payment Mode": bill.paymentMode, "Cash Given": bill.cashGiven,
          "Change Returned": bill.changeReturned, "Status": bill.status,
          "Payment Split": bill.paymentSplits ? bill.paymentSplits.map(sp => `${sp.mode}: ${U.money(sp.amount)}`).join(", ") : "",
          "Refunded Amount": 0
        });
        // Sale ko Income & Expense me income ke roop me bhi save karo
        if (bill.total > 0) {
          await DB.put("transactions", { date: bill.date, type: "income", label: `Sale ${bill.idLabel} (${bill.customerName})`, amount: bill.total });
          Sync.push("Income & Expenses", "", { "Date": bill.date, "Type": "income", "Label": `Sale ${bill.idLabel} (${bill.customerName})`, "Amount": bill.total });
        }
        Settings.set({ nextBillNo: s.nextBillNo + 1 });
        // decrement stock
        // decrement stock, then pull in the next "Extra Stock" batch (if any)
        // the moment the shelf empties out
        for (const c of Object.values(state.cart)) {
          const full = await DB.get("items", c.itemId);
          if (full) {
            const mainQty = c.mainAvail !== undefined ? Math.max(0, c.qty - (c.extraQty || 0)) : c.qty;
            const extraQty = c.mainAvail !== undefined ? (c.extraQty || 0) : 0;
            full.stockQty = Math.max(0, (full.stockQty || 0) - mainQty);
            if (extraQty > 0 && full.extraStock && full.extraStock.length) {
              full.extraStock[0].qty = Math.max(0, (full.extraStock[0].qty || 0) - extraQty);
              if (full.extraStock[0].qty <= 0) full.extraStock.shift();
            }
            await DB.put("items", full);
            await Items.promoteExtraStock(full);
          }
        }
        // update customer totals
        if (state.customer) {
          const c = await DB.get("customers", state.customer.id);
          c.totalSpend = (c.totalSpend || 0) + bill.total;
          c.totalProfit = (c.totalProfit || 0) + items.reduce((s2, it) => s2 + (it.price - (it.cost || 0)) * it.qty, 0);
          await DB.put("customers", c);
        }
        // Is sale ka profit Revenue & Expense me bhi automatically add karo
        const saleProfit = items.reduce((s2, it) => s2 + (it.price - (it.cost || 0)) * it.qty, 0);
        if (saleProfit !== 0) {
          await DB.put("revenueExpense", { date: bill.date, type: "revenue", title: "Profit", amount: saleProfit, mode: bill.paymentMode || "" });
          Sync.push("Revenue & Expenses", "", { "Date": bill.date, "Type": "revenue", "Title": "Profit", "Amount": saleProfit, "Mode": bill.paymentMode || "" });
        }
        // PayLater (poori ya Split Payment ka hissa) ho to isi sale ko
        // Udhar sheet me bhi credit (udhar) entry ke roop me daal do —
        // Udhar app ki Membership sheet me "Total udhar" khud update ho
        // jaayega (checkPayLaterEligibility se hui limit-check ke baad hi
        // yahan tak pahuncha hai, isliye seedha push kar sakte hain).
        const payLaterAmount = mode === "PayLater" ? bill.total
          : (splits && splits.length ? (splits.find(sp => sp.mode === "PayLater") || {}).amount || 0 : 0);
        if (payLaterAmount > 0 && bill.customerMobile) {
          const udharItems = items.map(it => ({ itemName: it.name, quantity: it.qty, unitPrice: it.price }));
          Sync.pushUdharOrder(bill.customerMobile, udharItems, bill.date).then(r => {
            if (!r.ok || (r.data && r.data.success === false)) {
              console.warn("Udhar push failed", r);
              U.toast((r.data && r.data.message) || "Udhar sheet me save nahi hua — dobara try karo");
            }
          });
        }
        bill.id = billId;
        if (mode === "Cash") SFX.cash(); else SFX.success();
        showPostSale(bill);
      }

      async function handlePhotoFileChange(ev, inputId, previewId) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        if (!file.type || !file.type.startsWith('image/')) { U.toast('Please select an image'); ev.target.value = ''; return; }
        const reader = new FileReader();
        reader.onload = async function(e) {
          let base64 = e.target.result;
          base64 = await U.resizeImageBase64(base64, 1000, 0.82);
          const preview = document.getElementById(previewId);
          if (preview) preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover;">`;
          U.toast('Uploading photo...');

          const idField = document.getElementById('mcId');
          let cid = idField && idField.value ? Number(idField.value) : null;
          if (!cid) {
            cid = await Sync.getNextId('Customers', 'Customer ID');
            if (cid) {
              if (idField) idField.value = cid;
              // MUST be awaited — see note in Counter.handlePhotoFileChange.
              await Sync.push('Customers', 'Customer ID', {
                'Customer ID': cid,
                'Name': document.getElementById('mcName').value.trim(),
                'Mobile': document.getElementById('mcMobile').value.trim(),
                'Gender': document.getElementById('mcGender').value,
                'DOB': document.getElementById('mcDob').value,
                'Address': document.getElementById('mcAddr').value.trim(),
                'Photo': ''
              });
            }
          }
          if (!cid) { U.toast('Customer ID nahi mila, dobara try karo'); return; }

          const mobileHint = (document.getElementById('mcMobile')?.value || '').trim() || String(cid);
          await PhotoUpload.choose(base64, file.type, mobileHint, previewId, async function(url) {
            const inputField = document.getElementById(inputId);
            if (inputField) inputField.value = url || '';
            if (url && String(url).indexOf('http') === 0) {
              const existing = await DB.get('customers', cid);
              if (existing) { existing.photo = url; await DB.put('customers', existing); }
            }
          }, { targetSheet: 'Customers', targetColumn: 'Photo', key: 'Customer ID', keyValue: cid });
        };
        reader.readAsDataURL(file);
        ev.target.value = '';
      }

      /* ---- Image Store (Drive folders used for customer/product photos) ---- */
      async function imageStore() {
        // Click hote hi turant ek loading sheet dikhao — isse user ko pata
        // chalta hai ki tap register ho gaya (pehle koi feedback nahi tha,
        // isliye slow/failed network par lag raha tha "click nahi ho raha").
        UI.sheet(`<div class="sheet-head"><h3>Image Store</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body"><div class="empty"><div class="sk" style="height:60px;border-radius:14px;"></div></div></div>`);

        if (!Sync.getUrl()) {
          UI.sheet(`<div class="sheet-head"><h3>Image Store</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
        <div class="sheet-body"><div class="hint">Pehle Google Sheet connect karo (More → Google Sheet Sync).</div></div>`);
          return;
        }

        function withTimeout(promise, ms) {
          return Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve(null), ms))
          ]);
        }

        let list;
        try {
          list = await withTimeout(Sync.getImageStoreList(), 10000);
        } catch (e) {
          list = null;
        }

        if (list === null) {
          UI.sheet(`<div class="sheet-head"><h3>Image Store</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
        <div class="sheet-body">
          <div class="hint" style="margin-bottom:12px;color:var(--danger)">Sheet se data load nahi ho paaya. Internet check karke dobara try karo.</div>
          <button class="btn primary block" onclick="More.imageStore()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M17.65 6.35A7.958 7.958 0 0012 4a8 8 0 108 8"/><path d="M17 4v4h-4"/></svg> Retry</button>
        </div>`);
          return;
        }

        // Sirf ek hi folder hai aur wo active nahi hai — usko khud active kar do,
        // kyunki jab sirf ek option hi hai to usse "off" rehne ka koi matlab nahi,
        // aur na hi uske liye ek switch dikhane ki zaroorat hai.
        if (list.length === 1) {
          // Ek hi folder ho to wo hamesha Active dikhna chahiye — chahe
          // Sheet me abhi TRUE mark na ho. UI turant "ACTIVE" dikhaye,
          // aur background me Sheet ko bhi sync kar de agar zaroorat ho.
          if (!list[0].active) {
            list[0].active = true; // turant local UI update
            try { await withTimeout(Sync.setActiveImageStore(list[0].folderLink), 10000); }
            catch (e) { /* ignore — UI already shows it correctly */ }
          }
        }
        const multi = list.length > 1;
        UI.sheet(`<div class="sheet-head"><h3>Image Store</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:14px">Jo folder <b style="color:var(--success)">green (Active)</b> hai, customer/product photo upload usi Google Drive folder me hoga. ${multi ? "Switch on karke kisi bhi folder ko Active karo." : "Ek hi folder hai isliye ye hamesha active rahega."}</div>
        <button class="btn primary block" style="margin-bottom:14px" onclick="More.imageStoreForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> Add New Folder</button>
        ${list.length === 0 ? '<div class="empty">Koi folder add nahi kiya gaya</div>' : list.map(r => `
          <div class="card" style="margin-bottom:10px;border:1.5px solid ${r.active ? 'var(--success)' : 'var(--danger)'};background:${r.active ? 'var(--success-bg)' : 'var(--danger-bg)'};">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div style="min-width:0;flex:1;">
                <div style="font-weight:800;font-size:13.5px;color:${r.active ? 'var(--success)' : 'var(--danger)'};">${U.escapeHtml(r.folderName || "Untitled")}</div>
                ${r.email ? `<div class="hint" style="margin-top:1px;">${U.escapeHtml(r.email)}</div>` : ''}
                <div class="hint" style="word-break:break-all;margin-top:2px;">${U.escapeHtml(r.folderLink)}</div>
                <div class="pill ${r.active ? 'green' : 'red'}" style="margin-top:6px;">${r.active ? 'ACTIVE' : 'INACTIVE'}</div>
              </div>
              ${multi ? `<button type="button" class="switch ${r.active ? 'on' : ''}" style="flex-shrink:0;position:relative;z-index:2;" onclick="event.stopPropagation();More.setActiveImageStore('${U.escapeHtml(r.folderLink)}')" title="${r.active ? 'Active' : 'Make this active'}"></button>` : ''}
            </div>
            <div class="row" style="margin-top:10px;">
              <button class="btn ghost" onclick='More.imageStoreForm(${JSON.stringify(r).replace(/'/g, "&#39;")})'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg> Edit</button>
              <button class="btn danger" onclick="More.deleteImageStoreEntry('${U.escapeHtml(r.folderLink)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg></button>

      function imageStoreForm(existing) {
        UI.sheet(`<div class="sheet-head"><h3>${existing ? "Edit Folder" : "Add Folder"}</h3><button class="icon-btn dark" onclick="More.imageStore()">✕</button></div>
      <div class="sheet-body">

        <button class="btn primary block" onclick="More.saveImageStoreEntry()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save</button>

      async function saveImageStoreEntry() {
        const name = document.getElementById("isName").value.trim();
        const link = document.getElementById("isLink").value.trim();
        if (!name || !link) { U.toast("Folder Name aur Link daalein"); return; }
        const btn = document.querySelector('.sheet-body .btn.primary.block');
        if (btn) { btn.disabled = true; btn.textContent = "Saving..."; }
        const origLink = document.getElementById("isOrigLink").value;
        const row = { email: document.getElementById("isEmail").value.trim(), folderName: name, folderLink: link };
        let r;
        try {
          r = await Sync.saveImageStoreEntry(row, origLink);
        } catch (e) {
          console.error("saveImageStoreEntry threw:", e);
          U.toast("Network error: " + (e.message || e));
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save'; }
          return;
        }
        console.log("saveImageStoreEntry response:", r);
        if (r.ok && r.data && r.data.success) {
          U.toast("Saved");
          imageStore();
        } else if (r.ok && r.data && r.data.error) {
          U.toast("Sheet error: " + r.data.error);
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save'; }
        } else if (r.ok && !r.data) {
          U.toast("Backend se response nahi mila — Apps Script ko dobara Deploy karo (New Version)");
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save'; }
        } else {
          U.toast("Save fail hua — internet ya Sheet URL check karo");
          if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save'; }
        }
      }

      async function saveCustomer() {
        const name = document.getElementById("mcName").value.trim();
        if (!name) return;
        const idVal = document.getElementById("mcId").value;
        const photoUrl = document.getElementById("mcPhotoUrl")?.value.trim() || "";
        const obj = { name, mobile: document.getElementById("mcMobile").value.trim(), gender: document.getElementById("mcGender").value, dob: document.getElementById("mcDob").value, address: document.getElementById("mcAddr").value.trim(), photo: photoUrl };
        if (idVal) obj.id = Number(idVal);
        const id = await DB.put("customers", obj);
        Sync.push("Customers", "Customer ID", {
          "Customer ID": id, "Name": obj.name, "Mobile": obj.mobile, "Gender": obj.gender,
          "DOB": obj.dob, "Address": obj.address, "Photo": obj.photo || ""
        });
        SFX.success();
        U.toast(idVal ? "Customer updated" : "Customer added"); customers();
      }

      async function expiryTracker() {
        const all = await DB.all("items");
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const in7 = new Date(today); in7.setDate(in7.getDate() + 7);
        const expired = all.filter(i => i.expiryDate && new Date(i.expiryDate) < today)
          .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
        const expiringSoon = all.filter(i => i.expiryDate && new Date(i.expiryDate) >= today && new Date(i.expiryDate) <= in7)
          .sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));
        const row = (it, color) => `<div class="list-row" style="padding:10px 0;">${U.itemAvatar(it, color)}
        <div class="main"><div class="title">${U.escapeHtml(it.name)}</div><div class="meta">stock ${it.stockQty ?? 0} ${U.escapeHtml(it.unit || "")}</div></div>
        <div class="right title num" style="color:${color}">${U.fmtDate(it.expiryDate)}</div></div>`;
        UI.sheet(`<div class="sheet-head"><h3>Expiry Tracker</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="section-title" style="font-weight:800;color:var(--danger);margin-bottom:6px;">Expired</div>
        ${expired.length === 0 ? '<div class="empty">Koi item expire nahi hua 👍</div>' : expired.map(it => row(it, 'var(--danger)')).join("")}
        <div class="section-title" style="font-weight:800;color:var(--gold-dark);margin:16px 0 6px;">Expiring in 7 Days</div>
        ${expiringSoon.length === 0 ? '<div class="empty">Agle 7 din me koi item expire nahi ho raha 👍</div>' : expiringSoon.map(it => row(it, 'var(--gold-dark)')).join("")}
      </div>`);
      }

        const items = await DB.all("items");
        const total = items.reduce((s, i) => s + (mode === 'cost' ? i.buyPrice : i.sellPrice) * (i.stockQty || 0), 0);
        UI.sheet(`<div class="sheet-head"><h3>Stock Value — ${mode === 'cost' ? 'Cost' : 'Selling'} Price</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div style="font-size:24px;font-weight:800;text-align:center;margin-bottom:14px" class="num">${U.money(total)}</div>
        ${items.map(it => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${U.escapeHtml(it.name)} x${it.stockQty || 0}</span><span class="num">${U.money((mode === 'cost' ? it.buyPrice : it.sellPrice) * (it.stockQty || 0))}</span></div>`).join("")}
      </div>`);
      }

        <div class="divider"></div>
        <div class="label">Payment Modes</div>
        <div id="payModeList">${s.paymentModes.map((m, i) => `<span class="chip on" style="margin:0 6px 6px 0;display:inline-flex" onclick="More.removePayMode(${i})">${U.escapeHtml(m)} ✕</span>`).join("")}</div>

        <button class="btn primary block" onclick="More.saveBusinessSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Save Settings</button>

      function updateTax(i, k, v) { const s = Settings.get(); s.taxes[i][k] = k === 'pct' ? parseFloat(v) || 0 : v; Settings.set({ taxes: s.taxes }); }
      function addDiscount() { const s = Settings.get(); s.discounts.push({ name: "", value: 0, unit: "%" }); Settings.set({ discounts: s.discounts }); businessSettings(); }
      function updateDiscount(i, k, v) { const s = Settings.get(); s.discounts[i][k] = k === 'value' ? parseFloat(v) || 0 : v; Settings.set({ discounts: s.discounts }); }
      function addFee() { const s = Settings.get(); s.fees.push({ name: "", value: 0, unit: "₹" }); Settings.set({ fees: s.fees }); businessSettings(); }
      function updateFee(i, k, v) { const s = Settings.get(); s.fees[i][k] = k === 'value' ? parseFloat(v) || 0 : v; Settings.set({ fees: s.fees }); }
      function addPayMode() {
        const v = document.getElementById("newPayMode").value.trim();
        if (!v) return;
        const s = Settings.get(); s.paymentModes.push(v); Settings.set({ paymentModes: s.paymentModes }); businessSettings();

      function removePayMode(i) { const s = Settings.get(); s.paymentModes.splice(i, 1); Settings.set({ paymentModes: s.paymentModes }); businessSettings(); }
      function saveBusinessSettings() {

          idPrefix: document.getElementById("bsPrefix").value.trim() || "RM"

      }

      /* ---- Printer setup (ESC/POS thermal — Bluetooth primary path) ---- */
      function printerSetup() {
        const s = Settings.get();
        const bridge = Printer.nativeBridge();
        const status = Printer.statusLabel();
        const paperWidth = (s.printer && s.printer.paperWidth) || 58;
        UI.sheet(`<div class="sheet-head"><h3>Printer Setup</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="pill ${status.ok ? 'green' : 'red'}" style="margin-bottom:12px">${status.text}</div>
        ${bridge ? `<div class="hint" style="margin-bottom:12px">Running inside the Android app — native thermal printing is active automatically.</div>` : ""}
        ${s.printer && s.printer.type === "bluetooth" ? `
          <div class="card" style="margin-bottom:14px">
            <div style="font-weight:700">${U.escapeHtml(s.printer.name)}</div>
            <div class="hint">Bluetooth ESC/POS printer</div>
          </div>` : ""}
        <div class="field"><label class="label">Paper Width</label>
          <select class="select" id="ppWidth" onchange="More.setPaperWidth(this.value)">
            <option value="58" ${paperWidth == 58 ? 'selected' : ''}>58mm</option>
            <option value="80" ${paperWidth == 80 ? 'selected' : ''}>80mm</option>
          </select>
        </div>
        <button class="btn gold block" style="margin-bottom:8px" onclick="More.connectPrinter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg> Connect Printer (Bluetooth)</button>
        ${s.printer && s.printer.type === "bluetooth" ? `<button class="btn ghost block" style="margin-bottom:8px" onclick="More.testPrint()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Test Print</button>` : ""}
        ${s.printer ? `<button class="btn danger block" style="margin-bottom:14px" onclick="More.disconnectPrinter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M9 7V3M15 7V3M6 7h12l-1 5a5 5 0 01-10 0L6 7z"/><path d="M12 17v4"/></svg> Disconnect Printer</button>` : ""}
        <div class="divider"></div>
        <div class="hint" style="margin-bottom:10px">Other connection types (basic, best-effort):</div>
        <button class="btn ghost block" style="margin-bottom:8px" onclick="More.addPrinter('usb')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> Add USB Printer</button>
        <button class="btn ghost block" onclick="More.addPrinter('network')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> Add Network Printer</button>
        <div class="divider"></div>
        <div class="hint">On the web, thermal printing needs Bluetooth pairing once; after a refresh the app reconnects automatically. Agar phir bhi connect na ho: Chrome me <b>chrome://flags</b> kholkar <b>Web Bluetooth new permissions backend</b> ko Enabled karein.  Once this app is packaged as an Android APK, native thermal printing will work automatically without any code changes here.</div>
      </div>`);
      }
      async function connectPrinter() {
        const ok = await Printer.connectBluetooth();
        if (ok) { SFX.success(); printerSetup(); } else SFX.error();
      }
      function setPaperWidth(v) {
        const s = Settings.get();
        Settings.set({ printer: Object.assign({}, s.printer, { paperWidth: parseInt(v, 10) }) });
      }
      async function testPrint() { await Printer.testPrint(); }
      function disconnectPrinter() { Printer.disconnectBluetooth(); SFX.remove(); printerSetup(); }
      async function addPrinter(type) {
        if (type === "usb") {
          if (!navigator.usb) { U.toast("WebUSB not supported on this browser"); return; }
          try {
            const device = await navigator.usb.requestDevice({ filters: [] });
            Settings.set({ printer: { type: "usb", name: device.productName || "USB Printer" } });
            U.toast("USB printer paired (basic support)"); printerSetup();
          } catch (e) { U.toast("No printer selected"); }
        } else {
          UI.sheet(`<div class="sheet-head"><h3>Network Printer</h3><button class="icon-btn dark" onclick="More.printerSetup()">✕</button></div>
        <div class="sheet-body">
          <div class="field"><label class="label">Printer IP Address</label><input class="input" id="npIp" placeholder="192.168.1.50"></div>
          <button class="btn primary block" onclick="More.saveNetworkPrinter()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg> Connect</button>
        </div>`);
        }
      }
      function saveNetworkPrinter() {
        const ip = document.getElementById("npIp").value.trim();
        if (!ip) return;
        Settings.set({ printer: { type: "network", name: ip } });
        U.toast("Network printer saved (basic support)"); printerSetup();
      }

      /* ---- Barcode Scanner setup (hardware keyboard-wedge — Bluetooth primary path) ---- */
      function refreshScanStageIfOpen() {
        if (document.getElementById("scanStageWrap") && typeof Counter !== "undefined" && Counter.renderScanStage) Counter.renderScanStage();
      }
      function barcodeScannerSetup() {
        const s = Settings.get();
        const status = HWScan.statusLabel();
        UI.sheet(`<div class="sheet-head"><h3>Barcode Scanner Setup</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="pill ${status.ok ? 'green' : 'red'}" id="scannerStatusPill" style="margin-bottom:12px">${status.text}</div>
        ${s.barcodeScanner ? `
          <div class="card" style="margin-bottom:14px">
            <div style="font-weight:700">${U.escapeHtml(s.barcodeScanner.name)}</div>
            <div class="hint">${s.barcodeScanner.type === "usb" ? "USB" : "Bluetooth"} barcode scanner</div>
          </div>` : `<div class="hint" style="margin-bottom:14px">Already paired in your phone's Bluetooth settings? You don't need to connect it here again — just tap "Test Scan" below and scan any item, it links automatically.</div>`}
        <button class="btn gold block" style="margin-bottom:8px" onclick="HWScan.testScan()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M6 8v8M9 8v8M12 8v8M15 8v8M18 8v8" stroke-linecap="round"/></svg> Test Scan</button>
        <button class="btn ghost block" style="margin-bottom:8px" onclick="More.connectScanner()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/></svg> Pair via Bluetooth (optional)</button>
        ${s.barcodeScanner ? `<button class="btn danger block" style="margin-bottom:14px" onclick="More.disconnectScanner()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;flex-shrink:0"><path d="M9 7V3M15 7V3M6 7h12l-1 5a5 5 0 01-10 0L6 7z"/><path d="M12 17v4"/></svg> Forget Scanner</button>` : ""}
        <div class="divider"></div>
        <div class="hint" style="margin-bottom:10px">Other connection type (basic, best-effort):</div>
        <button class="btn ghost block" onclick="More.addUsbScanner()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> Add USB Barcode Scanner</button>
        <div class="divider"></div>
        <div class="hint">Most Bluetooth/USB barcode scanners act like a keyboard — once paired at the phone's Bluetooth level (Settings → Connected devices), they automatically type scanned codes into the "Scan Items" page whenever it's open on Barcode Scanner mode. The status above links itself the moment a real scan comes through.</div>
      </div>`);
      }
      async function connectScanner() {
        const ok = await HWScan.connectBluetooth();
        if (ok) { SFX.success(); barcodeScannerSetup(); refreshScanStageIfOpen(); } else SFX.error();
      }
      function disconnectScanner() {
        HWScan.disconnect(); SFX.remove(); barcodeScannerSetup(); refreshScanStageIfOpen();
      }
      async function addUsbScanner() {
        const ok = await HWScan.addUsb();
        if (ok) { SFX.success(); barcodeScannerSetup(); refreshScanStageIfOpen(); }
      }

      return {
        render, customers, addCustomerForm, editCustomerForm, previewCustomerPhoto, handlePhotoFileChange, deleteCustomer, saveCustomer, lowStock, expiryTracker, stockValue, receiptSettings, toggleSetting, toggleSound,
        handleLogoUpload, removeLogo, saveReceiptSettings,
        businessSettings, addTax, updateTax, addDiscount, updateDiscount, addFee, updateFee, addPayMode, removePayMode, saveBusinessSettings,
        printerSetup, connectPrinter, setPaperWidth, testPrint, disconnectPrinter, addPrinter, saveNetworkPrinter,
        barcodeScannerSetup, connectScanner, disconnectScanner, addUsbScanner
      };
    })();

    /* ================================================================
       USE ITEMS — mark stock as internally used (breakage, samples,
       personal use, etc). Deducts stock, and pushes the cost value
       as an expense into Revenue & Expense so it reduces profit; also
       keeps a running "Used Items" history log.
    ================================================================ */
    const UseItems = (() => {
      const state = { cart: {} };

      async function openGrid() {
        state.cart = {};
        const root = document.getElementById("counterRoot");
        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="Counter.renderHome()">✕</button>
        <div style="flex:1"><h1 style="font-size:14px">Use Items</h1></div>
      </div>
      <div class="item-search">
        <input class="input" id="useGridSearch" placeholder="Search item..." oninput="UseItems.renderGrid()">
        <button class="icon-btn dark" onclick="UseItems.scanBarcode()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:17px;height:17px"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg></button>
      </div>
      <div class="scroll" style="position:relative;"><div class="item-grid" id="useGridBody"></div></div>
    `;
        renderGrid();
      }

      async function renderGrid() {
        const q = document.getElementById("useGridSearch").value.toLowerCase();
        const items = (await DB.all("items")).filter(i => (typeof i.name === "string" ? i.name : Array.isArray(i.name) ? (i.name[0] || "") : String(i.name || "")).toLowerCase().includes(q));
        const body = document.getElementById("useGridBody");
        if (items.length === 0) { body.innerHTML = `<div class="empty" style="grid-column:1/-1">No items found</div>`; return; }
        body.innerHTML = items.map(it => {
          const qty = state.cart[it.id]?.qty || 0;
          const extraTotal = (it.extraStock || []).reduce((s, b) => s + (Number(b.qty) || 0), 0);
          const totalStock = (Number(it.stockQty) || 0) + extraTotal;
          const isOOS = totalStock <= 0;
          const isLow = !isOOS && it.lowStockThreshold && totalStock <= it.lowStockThreshold;
          return `<div class="item-card ${qty > 0 ? 'added' : ''}"
        onclick="UseItems.handleCardClick(${it.id})"
        onpointerdown="UseItems.startLongPress(${it.id})"
        onpointerup="UseItems.cancelLongPress()"
        onpointerleave="UseItems.cancelLongPress()"
        onpointercancel="UseItems.cancelLongPress()"
        oncontextmenu="return false">
        ${U.itemThumb(it)}
        ${isOOS ? `<div class="stock-badge-oos"><span>Out Of Stock</span></div>` : ""}
        ${isLow ? `<div class="stock-badge-low">Low Stock</div>` : ""}
        ${qty > 0 ? `<div class="item-qty-badge">${qty}</div>` : ""}
        <div class="item-body"><div class="item-name">${U.escapeHtml(it.name)}</div><div class="item-price num">${U.money(it.buyPrice || 0)}</div></div>
      </div>`;
        }).join("");
        renderCartBar();
      }

      let longPressTimer = null;
      let longPressFired = false;
      function startLongPress(itemId) {
        longPressFired = false;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          removeFromCart(itemId);
        }, 1000);
      }
      function cancelLongPress() { clearTimeout(longPressTimer); }
      function handleCardClick(itemId) {
        if (longPressFired) { longPressFired = false; return; }
        addToCart(itemId);
      }
      function removeFromCart(itemId) {
        if (!state.cart[itemId]) return;
        const name = state.cart[itemId].name;
        delete state.cart[itemId];
        if (navigator.vibrate) navigator.vibrate(35);
        U.toast(`${name} removed`);
        renderGrid();
      }
      async function addToCartCore(itemId) {
        if (!state.cart[itemId]) {
          const it = await DB.get("items", itemId);
          if (!it) return;
          state.cart[itemId] = { itemId, name: it.name, cost: it.buyPrice || 0, unit: it.unit || "", avail: Number(it.stockQty) || 0, qty: 0, imageUrl: it.imageUrl || "" };
        }
        const c = state.cart[itemId];
        if (c.qty >= c.avail) { SFX.error(); U.toast("Stock khatam ho gaya"); return; }
        c.qty += 1;
        SFX.tap();
      }
      async function addToCart(itemId) { await addToCartCore(itemId); renderGrid(); }
      function changeQty(itemId, d) {
        const c = state.cart[itemId];
        if (!c) return;
        if (d > 0) {
          if (c.qty >= c.avail) { SFX.error(); U.toast("Stock khatam ho gaya"); return; }
          c.qty += 1;
        } else {
          c.qty -= 1;
          if (c.qty <= 0) delete state.cart[itemId];
        }
      }

      async function scanBarcode() { openContinuousScan(); }

      async function openContinuousScan() {
        if (!state.scanMode) state.scanMode = Scanner.getPreferredMode();
        const root = document.getElementById("counterRoot");
        root.innerHTML = `
      <div class="topbar"><button class="icon-btn" onclick="UseItems.closeContinuousScan()">✕</button>
        <div style="flex:1"><h1 style="font-size:14px">Scan Items to Use</h1></div>
        <div class="scan-mode-switch">
          <button class="scan-mode-btn" id="scanModeCamBtn" title="Camera" onclick="UseItems.setScanMode('camera')">${SCAN_MODE_ICON.camera}</button>
          <button class="scan-mode-btn" id="scanModeHwBtn" title="Barcode Scanner" onclick="UseItems.setScanMode('hardware')">${SCAN_MODE_ICON.hardware}</button>
        </div>
        <button class="icon-btn" style="margin-right:6px" title="Switch camera" id="switchCamBtn" onclick="Scanner.switchCamera()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></button>
        <span id="scanBadgeSlot"></span>
      </div>
      <div id="scanStageWrap"></div>
      <div class="scroll" style="position:relative;"><div class="section" id="useScanFeed" style="padding-top:12px"></div></div>
    `;
        renderContinuousFeed();
        renderScanStage();
      }
      function setScanMode(mode) {
        if (state.scanMode === mode) return;
        state.scanMode = mode;
        Scanner.setPreferredMode(mode);
        renderScanStage();
      }
      function renderScanStage() {
        const camBtn = document.getElementById("scanModeCamBtn"), hwBtn = document.getElementById("scanModeHwBtn");
        const switchCamBtn = document.getElementById("switchCamBtn"), badgeSlot = document.getElementById("scanBadgeSlot");
        const stageWrap = document.getElementById("scanStageWrap");
        if (!stageWrap) return;
        if (camBtn) camBtn.classList.toggle("on", state.scanMode === "camera");
        if (hwBtn) hwBtn.classList.toggle("on", state.scanMode === "hardware");
        if (state.scanMode === "camera") {
          HWScan.detach();
          if (switchCamBtn) switchCamBtn.style.display = "";
          if (badgeSlot) badgeSlot.innerHTML = `<div class="scan-live-badge"><span class="pulse-dot"></span>LIVE</div>`;
          stageWrap.innerHTML = `
        <div class="scan-live-video-wrap">
          <div id="useScanReader"></div>
          <div class="scan-live-frame" id="useScanFrame">
            <span class="scan-live-corner tl"></span><span class="scan-live-corner tr"></span>
            <span class="scan-live-corner bl"></span><span class="scan-live-corner br"></span>
            <div class="scan-live-laser"></div>
          </div>
          <div class="scan-live-pill" id="useScanPill"><span class="dot"></span><span id="useScanPillText">Camera ke saamne barcode laayein</span></div>
        </div>`;
          Scanner.startContinuous("useScanReader", { onDetect: handleContinuousDetect });
        } else {
          Scanner.stopContinuous();
          if (switchCamBtn) switchCamBtn.style.display = "none";
          const scanner = Settings.get().barcodeScanner, linked = !!scanner;
          if (badgeSlot) badgeSlot.innerHTML = `<div class="scan-live-badge" style="${linked ? '' : 'opacity:.65'}"><span class="pulse-dot" style="background:${linked ? 'var(--success)' : '#8a8f9c'}"></span>${linked ? 'READY' : 'SCANNER'}</div>`;
          stageWrap.innerHTML = `
        <div class="hw-scan-stage">
          <div class="hw-scan-panel">
            <div class="hw-scan-icon ${linked ? 'linked' : ''}">${SCAN_MODE_ICON.hardware}</div>
            <div class="hw-scan-title">${linked ? "Barcode Scanner Ready" : "Use your Barcode Scanner"}</div>
            <div class="hw-scan-sub">${linked ? `Linked: ${U.escapeHtml(scanner.name)} — scan any item` : "Already paired in phone's Bluetooth settings? Just scan an item."}</div>
            <div class="hw-scan-hint">Need help connecting? <span style="text-decoration:underline;cursor:pointer" onclick="More.barcodeScannerSetup()">Click Here</span></div>
            <input id="hwUseInput" class="hw-scan-input" autocomplete="off" inputmode="none">
          </div>
        </div>`;
          HWScan.attach(document.getElementById("hwUseInput"), (code) => { HWScan.markLinkedFromScan(); handleContinuousDetect(code); });
        }
      }
      function closeContinuousScan() {
        Scanner.stopContinuous();
        HWScan.detach();
        openGrid();
      }
      let _useScanFlashTimer = null;
      function scanFlash(st) {
        const frame = document.getElementById("useScanFrame");
        const pill = document.getElementById("useScanPill");
        if (!frame || !pill) return;
        clearTimeout(_useScanFlashTimer);
        frame.classList.remove("found", "not-found");
        pill.classList.remove("found", "not-found");
        if (st) { frame.classList.add(st); pill.classList.add(st); }
        _useScanFlashTimer = setTimeout(() => {
          frame.classList.remove("found", "not-found");
          pill.classList.remove("found", "not-found");
          const pillText = document.getElementById("useScanPillText");
          if (pillText) pillText.textContent = "Camera ke saamne barcode laayein";
        }, 1400);
      }
      async function handleContinuousDetect(code) {
        const pillText = document.getElementById("useScanPillText");
        const items = await DB.all("items");
        const it = items.find(i => String(i.barcode || "").trim() === String(code || "").trim());
        if (it) {
          SFX.scan();
          if (navigator.vibrate) navigator.vibrate(30);
          await addToCartCore(it.id);
          if (pillText) pillText.textContent = `✓ ${it.name} added`;
          else U.toast(`✓ ${it.name} added`);
          scanFlash("found");
          renderContinuousFeed(it.id);
        } else {
          SFX.error();
          if (pillText) pillText.textContent = "Item not found for this barcode";
          scanFlash("not-found");
          U.toast("Item not found for this barcode");
        }
      }
      function renderContinuousFeed(justAddedId) {
        const feed = document.getElementById("useScanFeed");
        if (!feed) return;
        const items = Object.values(state.cart);
        if (items.length === 0) {
          feed.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8V6a2 2 0 012-2h2M4 16v2a2 2 0 002 2h2M20 8V6a2 2 0 00-2-2h-2M20 16v2a2 2 0 01-2 2h-2M7 8v8M11 8v8M14 8v8M17 8v8"/></svg>Scanned items yahan dikhenge</div>`;
        } else {
          const count = items.reduce((s, c) => s + c.qty, 0);
          const rows = items.slice().reverse().map(it => {
            const isNew = it.itemId === justAddedId;
            return `<div class="scan-live-row${isNew ? ' new' : ''}">
            <div style="display:flex;align-items:center;gap:10px;">
              ${U.itemAvatar(it)}
              <div><div style="font-weight:700;font-size:13px">${U.escapeHtml(it.name)}</div>
                <div class="hint">${U.money(it.cost)} x ${it.qty}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <button class="icon-btn dark" style="width:26px;height:26px" onclick="UseItems.contScanChangeQty(${it.itemId},-1)">−</button>
              <span class="num" style="font-weight:700;min-width:16px;text-align:center">${it.qty}</span>
              <button class="icon-btn dark" style="width:26px;height:26px" onclick="UseItems.contScanChangeQty(${it.itemId},1)">+</button>
            </div>
          </div>`;
          }).join("");
          feed.innerHTML = `<div class="scan-feed-head"><span class="t">Scanned Items</span><span class="count">${count}</span></div><div class="card">${rows}</div>`;
        }
        renderCartBar();
      }
      function contScanChangeQty(itemId, d) { changeQty(itemId, d); renderContinuousFeed(); }

      function cartTotal() { return Object.values(state.cart).reduce((s, c) => s + (c.cost || 0) * c.qty, 0); }
      function renderCartBar() {
        const scrollArea = document.querySelector("#page-counter .scroll");
        let bar = document.getElementById("useCartBar");
        const count = Object.values(state.cart).reduce((s, c) => s + c.qty, 0);
        if (bar) bar.remove();
        if (count === 0 || !scrollArea) return;
        const total = cartTotal();
        bar = document.createElement("div");
        bar.className = "cart-bar"; bar.id = "useCartBar";
        bar.innerHTML = `<div><div style="font-size:11px;opacity:.75">${count} items</div><div class="amt num">${U.money(total)}</div></div><button class="btn danger" onclick="UseItems.confirmUse()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Mark as Used</button>`;
        scrollArea.parentElement.style.position = "relative";
        scrollArea.parentElement.appendChild(bar);
      }

      function confirmUse() {
        const items = Object.values(state.cart).filter(c => c.qty > 0);
        if (items.length === 0) return;
        const total = cartTotal();
        UI.sheet(`<div class="sheet-head"><h3>Confirm Use</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div class="hint" style="margin-bottom:12px">Yeh items stock se hat jaayenge aur inki cost value Revenue &amp; Expense me expense ki tarah jud jaayegi.</div>
        ${items.map(it => `<div class="list-row" style="padding:8px 0;"><div class="main"><div class="title">${U.escapeHtml(it.name)} x${it.qty}</div></div><div class="right title num">${U.money(it.cost * it.qty)}</div></div>`).join("")}
        <div class="divider"></div>
        <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px;">
          <span>Total Value</span><span class="num" style="color:var(--danger)">${U.money(total)}</span>
        </div>
        <button class="btn danger block" onclick="UseItems.save()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:15px;height:15px;flex-shrink:0"><path d="M20 6L9 17l-5-5"/></svg> Confirm &amp; Use</button>
      </div>`);
      }

      async function save() {
        const cartItems = Object.values(state.cart).filter(c => c.qty > 0);
        if (cartItems.length === 0) { SFX.error(); U.toast("Kam se kam ek item chuno"); return; }
        const date = new Date().toISOString();
        let totalCost = 0;
        const usedLabel = [];
        for (const c of cartItems) {
          const it = await DB.get("items", c.itemId);
          if (!it) continue;
          const useQty = Math.min(c.qty, Number(it.stockQty) || 0);
          if (useQty <= 0) continue;
          const unitCost = Number(it.buyPrice) || 0;
          const cost = unitCost * useQty;
          totalCost += cost;
          it.stockQty = Math.max(0, (Number(it.stockQty) || 0) - useQty);
          await DB.put("items", it);
          Sync.push("Products", "Product ID", {
            "Product ID": it.id, "Product Name": it.name, "Category": it.category,
            "Barcode": it.barcode, "Selling Price": it.sellPrice, "Buying Price": it.buyPrice,
            "Unit": it.unit, "Opening Stock": it.stockQty, "Low Stock Alert": it.lowStockThreshold,
            "Expiry Date": it.expiryDate, "Image URL": it.imageUrl
          });
          await DB.put("usedItems", { date, itemId: it.id, itemName: it.name, qty: useQty, unit: it.unit || "", cost: unitCost, total: cost });
          Sync.push("Used Items", "", { "Date": date, "Item": it.name, "Qty": useQty, "Unit": it.unit || "", "Cost Price": unitCost, "Total": cost });
          usedLabel.push(`${it.name} x${useQty}`);
        }
        if (totalCost > 0) {
          const title = `Used Items — ${usedLabel.join(", ")}`;
          await DB.put("revenueExpense", { date, type: "expense", title, amount: totalCost, mode: "Stock Use" });
          Sync.push("Revenue & Expenses", "", { "Date": date, "Type": "expense", "Title": title, "Amount": totalCost, "Mode": "Stock Use" });
        }
        state.cart = {};
        SFX.success();
        UI.close();
        U.toast("Items used — revenue se kaat diya gaya");
        Counter.renderHome();
      }

      async function history() {
        const list = (await DB.all("usedItems")).sort((a, b) => new Date(b.date) - new Date(a.date));
        const total = list.reduce((s, r) => s + (Number(r.total) || 0), 0);
        UI.sheet(`<div class="sheet-head"><h3>Used Items</h3><button class="icon-btn dark" onclick="UI.close()">✕</button></div>
      <div class="sheet-body">
        <div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px;">
          <span>Total Used Value</span><span class="num" style="color:var(--danger)">${U.money(total)}</span>
        </div>
        ${list.length === 0 ? '<div class="empty">Abhi tak koi item use nahi kiya</div>' : list.map(r => `
        <div class="list-row" style="padding:9px 0;">
          <div class="main"><div class="title">${U.escapeHtml(r.itemName)} x${r.qty} ${U.escapeHtml(r.unit || "")}</div><div class="meta">${U.fmtDate(r.date)} · ${U.fmtTime(r.date)}</div></div>
          <div class="right title num" style="color:var(--danger)">-${U.money(r.total)}</div>
        </div>`).join("")}
      </div>`);
      }

      return {
        openGrid, renderGrid, handleCardClick, startLongPress, cancelLongPress, removeFromCart, addToCart, changeQty,
        scanBarcode, closeContinuousScan, contScanChangeQty, setScanMode, renderScanStage, confirmUse, save, history
      };
    })();

       BOOT
